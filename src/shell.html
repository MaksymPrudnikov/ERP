<body>
<div class="shell">
<nav class="side" id="side"></nav>
<div class="main">
<header>
  <div class="header-title"><h1 id="hdr">ERP Glazing System</h1><span class="header-kicker" id="hdrSub">Производственная система · прототип</span></div>
  <span id="dirty">● несохранённые изменения</span>
  <span class="sp"></span>
  <div class="lang-switch" aria-label="Language">
    <button type="button" id="langRu" onclick="setLang('ru')">RU</button>
    <button type="button" id="langEn" onclick="setLang('en')">EN</button>
  </div>
  <span class="top-chip" id="phaseChip"></span>
  <button class="gh" onclick="doExport()">Экспорт JSON</button>
  <button class="gh" onclick="document.getElementById('imp').click()">Импорт JSON</button>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="doImport(this)">
</header>
<main id="app"></main>
</div>
</div>

<!DOCTYPE html>
<!--
  GLASS ERP — режим разработки.
  Этот файл подключает модули из src/ отдельными <script src>: правишь модуль,
  жмёшь F5 — без сборки. Работает при открытии с диска (file://) в Chrome.
  Для передачи одним файлом: node build/build.js → dist/GLASS_ERP.html
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLASS ERP — Glazing System (dev)</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/modules.css">
</head>
<body>
<div class="shell">
<nav class="side" id="side"></nav>
<div class="main">
<header>
  <div class="header-title"><h1 id="hdr">ERP Glazing System</h1><span class="header-kicker" id="hdrSub">Производственная система · прототип</span></div>
  <span id="dirty">● несохранённые изменения</span>
  <span class="sp"></span>
  <div class="lang-switch" aria-label="Language">
    <button type="button" id="langRu" onclick="setLang('ru')">RU</button>
    <button type="button" id="langEn" onclick="setLang('en')">EN</button>
  </div>
  <span class="top-chip" id="phaseChip"></span>
  <button class="gh" onclick="doExport()">Экспорт JSON</button>
  <button class="gh" onclick="document.getElementById('imp').click()">Импорт JSON</button>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="doImport(this)">
</header>
<main id="app"></main>
</div>
</div>
<script src="core/dim.js"></script>
<script src="core/poly.js"></script>
<script src="modules/shape/consts.js"></script>
<script src="modules/shape/model.js"></script>
<script src="modules/shape/contour.js"></script>
<script src="modules/shape/validate.js"></script>
<script src="modules/shape/geometry.js"></script>
<script src="modules/shape/index.js"></script>
<script src="modules/muntin/catalog.js"></script>
<script src="modules/muntin/model.js"></script>
<script src="modules/muntin/layout.js"></script>
<script src="modules/muntin/clip.js"></script>
<script src="modules/muntin/adaptive.js"></script>
<script src="modules/muntin/bom.js"></script>
<script src="modules/muntin/drawing.js"></script>
<script src="modules/muntin/index.js"></script>
<script src="erp/data.js"></script>
<script src="erp/icons.js"></script>
<script src="erp/i18n.js"></script>
<script src="erp/nav.js"></script>
<script src="erp/views/dashboard.js"></script>
<script src="erp/views/users.js"></script>
<script src="erp/views/sales.js"></script>
<script src="erp/views/sales-shape-ui.js"></script>
<script src="erp/views/sales-muntin-ui.js"></script>
<script src="erp/views/optimization.js"></script>
<script src="erp/views/production.js"></script>
<script src="erp/storage.js"></script>
</body>
</html>

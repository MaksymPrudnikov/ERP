/* ==== src/erp/masterdata/glass.js ==== */
/* =====================================================================
   erp/masterdata/glass · masterdata-1.0
   Каталог стекла, точки поставки и остальные материалы Makeup.
   IN : templates/GLASS_PRODUCTS.csv (засев — erp/masterdata/glass-catalog)
        templates/GLASS_SHEETS.csv  (импорт)
   OUT: DEFAULT.glassProduct · DEFAULT.glassSheet · DEFAULT.<материалы>
   Правило: файл не знает про цены продажи, клиентов и заказы. Только вход→выход.

   ПРОДУКТ И ПОСТАВКА — ДВЕ ТАБЛИЦЫ, А НЕ ОДНА

   Раньше `supplier`, `sheetSizes` и `leadTimeDays` висели прямо на продукте, и
   на вопрос «почём» ответа не было вовсе: валюты в модели не существовало. Но
   валюта принадлежит ТОЧКЕ ПОСТАВКИ, а не поставщику — Vitro Barrie отгружает
   в CAD, Vitro USA то же самое стекло в USD. Один продукт, две строки цены,
   две даты, два срока.

   Поэтому:
     glassProduct  ЧТО за стекло: подложка, покрытие, толщина, закалка, гейты
     glassSheet    ГДЕ и ПОЧЁМ:  точка поставки, валюта, размер листа, цена

   Ключ строки поставки — тройка «продукт · точка поставки · размер листа».
   Один поставщик держит один и тот же продукт двумя форматами листа, и это
   две разные закупки, а не переписанная строка.

   TEMPER_MODE — ЭТО ДВА ЖЁСТКИХ ГЕЙТА, А НЕ СПРАВКА

     temper_required  (`Q` у Cardinal, `VT` у Vitro) — БЕЗ ПЕЧИ НЕ ВЫПУСКАТЬ.
       Цвет приходит к финальному только после закалки; невыпеченный лист не
       сойдётся с соседним в том же фасаде.
     annealed_only    (`E`, без `VT`) — В ПЕЧЬ НЕ ПУСКАТЬ. Там гибнет товар,
       а не портится деталь.

   Обе версии лежат на складе как РАЗНЫЕ товары; в каталоге таких пар десять.
   Пустая клетка в файле означает «закаливается штатно» (подтверждено
   пользователем): печь допустима, но не обязательна, гейт не срабатывает.

   STOCKED И AVAILABILITY — РАЗНЫЕ ВОПРОСЫ

     stocked       на ПРОДУКТЕ: держим ли мы это у себя на складе
     availability  на СТРОКЕ ПОСТАВКИ: через какую точку и за сколько дней

   Позиция без `stocked` из выбора НЕ выпадает — она помечается «по
   предзаказу». Из выбора выпадает только снятая с производства (`active`).

   ДОСТУПНОСТИ НА ПРОДУКТЕ БОЛЬШЕ НЕТ. Старое поле `availability:'inactive'`
   означало ровно «снято с производства» и переезжает в `active:false` — иначе
   рядом оказались бы два поля об одном и том же («stock» и «stocked»), и
   однажды они разошлись бы.
   ===================================================================== */

const MATERIAL_AVAILABILITY=['stock','order','special','inactive'];
const GLASS_SUBSTRATES=['clear','low_iron','tinted','patterned','wired'];
const GLASS_COATING_FAMILIES=['uncoated','lowe','reflective'];
const GLASS_TEMPER_MODES=['temperable','temper_required','annealed_only','unknown'];
/* exposure_rule определяется СПОСОБОМ НАНЕСЕНИЯ, а не эмиссивностью:
   пиролитика стойкая (`any`), напыление мягкое и живёт только внутри пакета
   (`cavity_only`). */
const GLASS_EXPOSURE_RULES=['any','cavity_only','exterior_only','interior_only'];
const GLASS_DEPOSITIONS=['pyrolytic','sputtered'];
/* Толщины каталога — предел пользователя, а не мира. Строка вне диапазона
   отклоняется с названным диапазоном в причине: расширять — здесь. */
const GLASS_MIN_MM=3, GLASS_MAX_MM=19;
/* Коды Cardinal `3Q340+` и `3E+272` — фирменные обозначения, а не опечатки:
   плюс в коде законен. */
const GLASS_CODE_RE=/^[A-Za-z0-9][A-Za-z0-9+._/-]{0,39}$/;
/* Валюта точки поставки. Список не закрываем: пользователь пересчитывает
   прайсы вручную и вносит по канадским меркам, но чужая строка с USD обязана
   заезжать без правки кода. Проверяем формат — три буквы. */
const CURRENCY_RE=/^[A-Za-z]{3}$/;
const GLASS_DEFAULT_CURRENCY='CAD';
/* Единица закупки стекла по умолчанию — квадратный фут; всё, что покупается
   иначе, выбирается из MD_UNITS (см. erp/masterdata/units). */
const GLASS_DEFAULT_UNIT='sqft';

function mdString(v){return String(v==null?'':v).trim();}
function mdNum(v){if(v==null||v==='')return null;const n=+v;return Number.isFinite(n)?n:null;}
function mdNonNeg(v){const n=mdNum(v);return n!=null&&n>=0?n:null;}
function mdInt(v){const n=mdNum(v);return n!=null&&Number.isInteger(n)&&n>=0?n:null;}
function mdAvailability(v){return MATERIAL_AVAILABILITY.includes(v)?v:'order';}
/* Дата цены — только ISO. Прайс без даты бесполезен не тем, что он пуст, а
   тем, что неизвестно, насколько он устарел; поэтому мусор становится пустотой,
   а не сегодняшним числом. */
const ISO_DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function mdDate(v){const s=mdString(v);return ISO_DATE_RE.test(s)?s:'';}

/* --- 1. Продукт ------------------------------------------------------ */

/* Оптика IGDB. Она здесь не для показа: из неё считаются U-value и SHGC на
   более позднем этапе, и потерять её при первой же правке каталога нельзя.
   Мусор в клетке превращается в пустоту, а не роняет строку — это справочные
   числа, а не идентичность продукта. */
const GLASS_OPTICS_KEYS=['tvis','tsol','rvis1','rvis2','rsol1','rsol2','emis1','emis2','conductivity'];
function normalizeGlassOptics(o){
 o=o&&typeof o==='object'?o:{};
 const out={};
 GLASS_OPTICS_KEYS.forEach(k=>{out[k]=mdNum(o[k]);});
 out.coatedSide=[1,2].includes(+o.coatedSide)?+o.coatedSide:null;
 return out;
}
/* Происхождение строки: какой файл IGDB и какая запись в нём. Нужно, чтобы
   пересборка каталога могла сойтись с прошлой, а спорное число — с источником. */
function normalizeGlassOrigin(o){
 o=o&&typeof o==='object'?o:{};
 return {igdbId:mdString(o.igdbId),igdbName:mdString(o.igdbName),igdbSource:mdString(o.igdbSource)};
}
/* Номера поверхностей: 1–8 (четырёхкамерных пакетов не бывает). Пусто = любая. */
function normalizeSurfaceList(v){
 const seen=Object.create(null),out=[];
 (Array.isArray(v)?v:[]).forEach(x=>{
  const n=+x;
  if(Number.isInteger(n)&&n>=1&&n<=8&&!seen[n]){seen[n]=true;out.push(n);}
 });
 return out.sort((a,b)=>a-b);
}
function normalizeGlassProduct(p){
 p=p&&typeof p==='object'?p:{};
 /* `family` — имя поля прежней схемы; читаем, чтобы сохранённый браузер не
    потерял покрытие ещё до пересева. */
 const fam=GLASS_COATING_FAMILIES.includes(p.coatingFamily)?p.coatingFamily
  :(GLASS_COATING_FAMILIES.includes(p.family)?p.family:'uncoated');
 return {
  id:mdString(p.id),code:mdString(p.code),manufacturer:mdString(p.manufacturer),name:mdString(p.name),
  substrate:GLASS_SUBSTRATES.includes(p.substrate)?p.substrate:'clear',
  coatingFamily:fam,
  thicknessMm:mdNum(p.thicknessMm),actualThicknessMm:mdNum(p.actualThicknessMm),
  temperMode:GLASS_TEMPER_MODES.includes(p.temperMode)?p.temperMode:'temperable',
  exposureRule:GLASS_EXPOSURE_RULES.includes(p.exposureRule)?p.exposureRule:'any',
  allowedSurfaces:normalizeSurfaceList(p.allowedSurfaces),
  edgeDeletion:p.edgeDeletion===true,
  deposition:GLASS_DEPOSITIONS.includes(p.deposition)?p.deposition:'',
  stocked:p.stocked===true,
  legacyCode:mdString(p.legacyCode),note:mdString(p.note),
  stockingUnit:mdUnitCode(p.stockingUnit,GLASS_DEFAULT_UNIT),
  salesUnit:mdUnitCode(p.salesUnit,GLASS_DEFAULT_UNIT),
  optics:normalizeGlassOptics(p.optics),
  origin:normalizeGlassOrigin(p.origin),
  /* миграция прежней схемы: снятое с производства было availability='inactive' */
  active:p.active!==false&&p.availability!=='inactive'
 };
}
/* Идентификатор переживает переименование кода, и это не украшение: пользователь
   переписывает `6BIRDSMART…` в свои цеховые коды, а сохранённые Makeup ссылаются
   на стекло по id. Совпадает с tools/catalog-to-js.py — иначе пересобранный
   каталог приехал бы новыми записями вместо обновления старых. */
function glassProductId(code){return 'GL-'+mdString(code).toUpperCase().replace(/[^A-Za-z0-9_-]/g,'-');}

/* --- 2. Строка поставки ---------------------------------------------- */

/* Ключ — тройка «продукт · точка поставки · размер листа». Размер входит в
   ключ намеренно: тот же лист по новой цене обновляет строку, другой формат
   листа добавляет свою. */
function glassSheetKey(code,supplier,wIn,hIn){
 return [mdString(code).toUpperCase(),mdString(supplier).toLowerCase(),wIn==null?'':wIn,hIn==null?'':hIn].join('|');
}
function glassSheetId(code,supplier,wIn,hIn){
 const slug=s=>mdString(s).toUpperCase().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');
 return ['GS',slug(code),slug(supplier),(wIn==null?'':wIn)+'x'+(hIn==null?'':hIn)].join('-');
}
function normalizeGlassSheet(s){
 s=s&&typeof s==='object'?s:{};
 const code=mdString(s.productCode||s.code),supplier=mdString(s.supplier);
 const wIn=mdNonNeg(s.sheetWIn),hIn=mdNonNeg(s.sheetHIn);
 const cur=mdString(s.currency).toUpperCase();
 return {
  id:mdString(s.id)||glassSheetId(code,supplier,wIn,hIn),
  productCode:code,supplier,
  currency:CURRENCY_RE.test(cur)?cur:GLASS_DEFAULT_CURRENCY,
  sheetWIn:wIn,sheetHIn:hIn,
  purchaseUnit:mdUnitCode(s.purchaseUnit,GLASS_DEFAULT_UNIT),
  purchasePrice:mdNonNeg(s.purchasePrice),
  priceDate:mdDate(s.priceDate),
  freightPct:mdNonNeg(s.freightPct),
  leadTimeDays:mdInt(s.leadTimeDays),
  availability:mdAvailability(s.availability),
  note:mdString(s.note)
 };
}

/* --- 3. Разбор CSV каталога ------------------------------------------ */

/* Один разбор на засев и на импорт. Вторая схема разбора однажды разойдётся с
   первой, и заводские данные начнут отличаться от загруженных тем же файлом. */
const GLASS_TEMPER_CSV={
 '':'temperable',
 'TEMPERED':'temper_required',
 'NO TEMPERABLE':'annealed_only',
 'NOT TEMPERABLE':'annealed_only',
 'TEMPER REQUIRED':'temper_required',
 'TEMPERABLE':'temperable',
 'ANNEALED ONLY':'annealed_only',
 'UNKNOWN':'unknown'
};
const GLASS_YES=['yes','y','true','1','да','+','x'];
const GLASS_NO=['','no','n','false','0','нет','-'];
/* undefined — «не разобрали», это отказ строки; пустая клетка означает «нет». */
function glassBoolCell(v){
 const s=mdString(v).toLowerCase();
 if(GLASS_YES.includes(s))return true;
 if(GLASS_NO.includes(s))return false;
 return undefined;
}
function glassSurfacesCell(v){
 const s=mdString(v);
 if(!s)return [];
 const parts=s.split(/[,;\s]+/).filter(Boolean),out=[];
 for(let i=0;i<parts.length;i++){
  const n=+parts[i];
  if(!Number.isInteger(n)||n<1||n>8)return null;
  out.push(n);
 }
 return normalizeSurfaceList(out);
}

/* Разбор файла каталога. Возвращает отчёт и список принятых строк; каждая
   строка несёт ТОЛЬКО те поля, колонки которых в файле есть.

   Это не мелочь: файл возвращается из Excel то с потерянными колонками, то с
   `LoE` в каждой пустой клетке. Обновлять запись целиком таким файлом значит
   стереть оптику и примечания всего каталога одной загрузкой. Чего в шапке
   нет — того импорт не трогает. */
function glassParseProductsCsv(text){
 const parsed=parseCsv(text),header=parsed.header,rep=sfReport(),out=[];
 if(!header.includes('code')||!header.includes('name')){
  sfReject(rep,0,'','файл не похож на GLASS_PRODUCTS.csv: нет колонок code и name');
  return {rep,out};
 }
 const has=c=>header.includes(c);
 const seen=Object.create(null);
 parsed.rows.forEach((r,n)=>{
  const line=n+2,code=mdString(r.code);
  if(!code)return sfReject(rep,line,'','пустой код');
  if(!GLASS_CODE_RE.test(code))return sfReject(rep,line,code,'код: только буквы, цифры и + . _ - /');
  if(seen[code.toUpperCase()])return sfReject(rep,line,code,'код повторяется в файле');
  const name=mdString(r.name);
  if(!name)return sfReject(rep,line,code,'пустое название');
  const f={code,name};

  if(has('manufacturer'))f.manufacturer=mdString(r.manufacturer);
  if(has('substrate')){
   const v=mdString(r.substrate).toLowerCase();
   if(!GLASS_SUBSTRATES.includes(v))return sfReject(rep,line,code,'substrate: ожидается '+GLASS_SUBSTRATES.join(' · '));
   f.substrate=v;
  }
  if(has('coating_family')){
   const v=mdString(r.coating_family).toLowerCase();
   if(!GLASS_COATING_FAMILIES.includes(v))return sfReject(rep,line,code,'coating_family: ожидается '+GLASS_COATING_FAMILIES.join(' · '));
   f.coatingFamily=v;
  }
  if(has('thickness_mm')){
   const t=mdNum(r.thickness_mm);
   if(t==null)return sfReject(rep,line,code,'thickness_mm: не число');
   if(t<GLASS_MIN_MM||t>GLASS_MAX_MM)return sfReject(rep,line,code,'толщина вне диапазона '+GLASS_MIN_MM+'–'+GLASS_MAX_MM+' мм');
   f.thicknessMm=t;
  }
  if(has('actual_thickness_mm'))f.actualThicknessMm=mdNum(r.actual_thickness_mm);
  if(has('temper_mode')){
   const key=mdString(r.temper_mode).toUpperCase();
   const v=GLASS_TEMPER_CSV[key];
   if(!v)return sfReject(rep,line,code,'temper_mode: ожидается пусто · TEMPERED · NO TEMPERABLE');
   f.temperMode=v;
  }
  if(has('exposure_rule')){
   const v=mdString(r.exposure_rule).toLowerCase()||'any';
   if(!GLASS_EXPOSURE_RULES.includes(v))return sfReject(rep,line,code,'exposure_rule: ожидается '+GLASS_EXPOSURE_RULES.join(' · '));
   f.exposureRule=v;
  }
  if(has('allowed_surfaces')){
   const v=glassSurfacesCell(r.allowed_surfaces);
   if(v===null)return sfReject(rep,line,code,'allowed_surfaces: номера поверхностей 1–8 через запятую');
   f.allowedSurfaces=v;
  }
  if(has('edge_deletion')){
   const v=glassBoolCell(r.edge_deletion);
   if(v===undefined)return sfReject(rep,line,code,'edge_deletion: ожидается YES или пусто');
   f.edgeDeletion=v;
  }
  if(has('deposition')){
   const v=mdString(r.deposition).toLowerCase();
   if(v&&!GLASS_DEPOSITIONS.includes(v))return sfReject(rep,line,code,'deposition: ожидается пусто · '+GLASS_DEPOSITIONS.join(' · '));
   f.deposition=v;
  }
  if(has('stocked')){
   const v=glassBoolCell(r.stocked);
   if(v===undefined)return sfReject(rep,line,code,'stocked: ожидается YES или пусто');
   f.stocked=v;
  }
  if(has('legacy_code'))f.legacyCode=mdString(r.legacy_code);
  if(has('notes'))f.note=mdString(r.notes);
  if(has('stocking_unit'))f.stockingUnit=mdUnitCode(r.stocking_unit,GLASS_DEFAULT_UNIT);
  if(has('sales_unit'))f.salesUnit=mdUnitCode(r.sales_unit,GLASS_DEFAULT_UNIT);

  const optics={};let anyOptics=false;
  GLASS_OPTICS_KEYS.forEach(k=>{if(has(k)){optics[k]=mdNum(r[k]);anyOptics=true;}});
  if(has('coated_side')){optics.coatedSide=mdNum(r.coated_side);anyOptics=true;}
  if(anyOptics)f.optics=optics;
  if(has('igdb_id')||has('igdb_name')||has('igdb_source'))
   f.origin={igdbId:mdString(r.igdb_id),igdbName:mdString(r.igdb_name),igdbSource:mdString(r.igdb_source)};

  seen[code.toUpperCase()]=true;
  rep.accepted++;
  out.push({line,code,fields:f});
 });
 return {rep,out};
}

/* --- 4. Заводской каталог -------------------------------------------- */

/* 511 позиций приезжают из того же файла, который лежит в templates/ — см.
   erp/masterdata/glass-catalog. Отклонённая строка засева означает, что
   каталог пересобрали сломанным, и молчать об этом нельзя. */
function glassSeedProducts(){
 const parsed=glassParseProductsCsv(typeof GLASS_PRODUCTS_CSV==='string'?GLASS_PRODUCTS_CSV:'');
 if(parsed.rep.rejected.length)
  console.warn('glass catalog seed: '+parsed.rep.rejected.length+' row(s) rejected — '+
   parsed.rep.rejected.map(x=>x.line+' '+x.code+': '+x.why).join('; '));
 return parsed.out.map(x=>normalizeGlassProduct(Object.assign({id:glassProductId(x.code)},x.fields)));
}
DEFAULT.glassProduct=glassSeedProducts();
/* Строки поставки заводскими НЕ бывают: точки поставки, размеры листа, цены и
   сроки пользователем ещё не подтверждены, а выдуманная цена в прайсе хуже
   отсутствующей. Таблица стартует пустой и заполняется экраном или CSV.

   И по той же причине её НЕТ в REFERENCE_TABLES (см. erp/data): пересев
   заменяет справочник заводским, то есть стёр бы все введённые цены. */
DEFAULT.glassSheet=[];

function normalizeSimpleMaterial(p,type){p=p&&typeof p==='object'?p:{};return {id:mdString(p.id),type,name:mdString(p.name),code:mdString(p.code),thicknessMm:mdNum(p.thicknessMm),availability:mdAvailability(p.availability),supplier:mdString(p.supplier),leadTimeDays:mdNum(p.leadTimeDays),active:p.active!==false};}

DEFAULT.heatTreatment=[
 {id:'HT-AN',name:'Annealed',code:'AN'},{id:'HT-HS',name:'Heat Strengthened',code:'HS'},{id:'HT-FT',name:'Tempered',code:'FT'}
].map(x=>normalizeSimpleMaterial(x,'heatTreatment'));
DEFAULT.spacerVariant=[
 ['SP-BWE-038','Black Warm Edge','3/8'],['SP-BWE-716','Black Warm Edge','7/16'],['SP-BWE-012','Black Warm Edge','1/2'],['SP-BWE-1732','Black Warm Edge','17/32'],['SP-BWE-058','Black Warm Edge','5/8'],
 ['SP-AL-038','Aluminum','3/8'],['SP-AL-012','Aluminum','1/2'],['SP-AL-058','Aluminum','5/8']
].map(x=>({id:x[0],system:x[1],size:x[2],name:x[1]+' '+x[2]+'″',code:x[0],availability:'order',supplier:'',leadTimeDays:null,active:true}));
DEFAULT.gasProduct=[{id:'GAS-AIR',name:'Air',code:'AIR'},{id:'GAS-ARGON',name:'Argon',code:'ARG'}].map(x=>normalizeSimpleMaterial(x,'gas'));
DEFAULT.sealantProduct=[{id:'SEAL-PIB',name:'PIB',code:'PIB'},{id:'SEAL-SIL',name:'Silicone',code:'SIL'},{id:'SEAL-HM',name:'Hot Melt',code:'HM'}].map(x=>normalizeSimpleMaterial(x,'sealant'));
DEFAULT.interlayerProduct=[{id:'INT-PVB030',name:'PVB Clear .030',code:'PVB030',thicknessMm:.762},{id:'INT-PVB060',name:'PVB Clear .060',code:'PVB060',thicknessMm:1.524},{id:'INT-SGP035',name:'Structural interlayer .035',code:'SGP035',thicknessMm:.889}].map(x=>normalizeSimpleMaterial(x,'interlayer'));
DEFAULT.fritProduct=[
 {id:'FRIT-CERAMIC',name:'Ceramic Frit',code:'FRIT-CER'},{id:'FRIT-DIGITAL',name:'Digital Ceramic Print',code:'FRIT-DIG'}
].map(x=>normalizeSimpleMaterial(x,'frit'));
DEFAULT.spandrelProduct=[
 {id:'SPAN-CERAMIC',name:'Ceramic Spandrel',code:'SPAN-CER'},{id:'SPAN-SILICONE',name:'Silicone Spandrel',code:'SPAN-SIL'}
].map(x=>normalizeSimpleMaterial(x,'spandrel'));

/* Frit = силкскрин, и ассортимент цеха узкий (хендофф, раздел 9л; спецификация
   снята со скриншотов рабочего интерфейса). Здесь стояли выдуманные 'Black',
   'Gray', 'Bronze', 'Full coverage', 'Lines' — цех такого не делает, а новый
   лист получал их по умолчанию. Узоров ровно три плюс отсылка к бумажному
   листу спецификации; цвета два. Позиции прайса CERM FRIT - FULL / PATTERN /
   GRADIENT подтверждены пользователем как мёртвые. */
const FRIT_COLORS=['White','Acid Etched'];
const FRIT_PATTERNS=['2 x 2 square','4 x 4 square','2 x 4 diamond','Custom — see silk screen sheet'];
/* Узор кладётся ОТ конкретного угла детали, и этот угол маркируется в цеху:
   иначе трафарет ляжет зеркально. Это производственный параметр, а не
   оформление. На рабочих листах стоит Top right. */
const FRIT_MARGIN_CORNERS=['Top left','Top right','Bottom left','Bottom right'];
const FRIT_DEFAULT_CORNER='Top right';
const FRIT_DEFAULT_DOT_MM=5;
/* 1″ в канонических 1/16″. Это ПРЕДЗАПОЛНЕНИЕ, а не правило: пользователь
   подтвердил, что отступ 0 законен, поэтому минимум не проверяем. */
const FRIT_DEFAULT_MARGIN16=16;
const SPANDREL_COLORS=['Black','White','Gray','Bronze','Custom'];

/* --- 5. Нормализация -------------------------------------------------- */

function normalizeMasterData(){
 if(!Array.isArray(DB.glassProduct))DB.glassProduct=JSON.parse(JSON.stringify(DEFAULT.glassProduct));
 const gSeen=Object.create(null);
 DB.glassProduct=DB.glassProduct.filter(x=>x&&typeof x==='object').map(normalizeGlassProduct)
  .map(p=>{if(!p.id&&p.code)p.id=glassProductId(p.code);return p;})
  .filter(p=>p.id&&p.name&&!gSeen[p.id]&&(gSeen[p.id]=true));

 /* Строка поставки на продукт, которого в каталоге нет, НЕ выбрасывается.
    Пользователь переименовывает коды каталога под цех, и выброшенная строка
    унесла бы с собой цену и срок — молча. Осиротевшая строка остаётся видимой
    на экране Master Data и чинится там же. */
 if(!Array.isArray(DB.glassSheet))DB.glassSheet=[];
 const sSeen=Object.create(null);
 DB.glassSheet=DB.glassSheet.filter(x=>x&&typeof x==='object').map(normalizeGlassSheet)
  .filter(s=>s.productCode&&s.supplier&&!sSeen[s.id]&&(sSeen[s.id]=true));

 /* каталог пересобран — индекс базовых стёкол больше не действителен */
 glassInvalidateNameIndex();

 [['heatTreatment','heatTreatment'],['gasProduct','gas'],['sealantProduct','sealant'],['interlayerProduct','interlayer'],['fritProduct','frit'],['spandrelProduct','spandrel']].forEach(pair=>{
  const k=pair[0],type=pair[1];if(!Array.isArray(DB[k]))DB[k]=JSON.parse(JSON.stringify(DEFAULT[k]));DB[k]=DB[k].filter(x=>x&&typeof x==='object').map(x=>normalizeSimpleMaterial(x,type)).filter(x=>x.id&&x.name);
 });
 if(!Array.isArray(DB.spacerVariant))DB.spacerVariant=JSON.parse(JSON.stringify(DEFAULT.spacerVariant));
 DB.spacerVariant=DB.spacerVariant.filter(x=>x&&typeof x==='object').map(x=>({id:mdString(x.id),system:mdString(x.system),size:mdString(x.size),name:mdString(x.name)||[mdString(x.system),mdString(x.size)].filter(Boolean).join(' '),code:mdString(x.code),availability:mdAvailability(x.availability),supplier:mdString(x.supplier),leadTimeDays:mdNum(x.leadTimeDays),active:x.active!==false})).filter(x=>x.id&&x.system&&x.size);
}

/* --- 6. Выборки ------------------------------------------------------- */

function mdById(key,id){return (DB[key]||[]).find(x=>x.id===id)||null;}
function glassProductById(id){return mdById('glassProduct',id);}
function glassProductByCode(code){const c=mdString(code).toUpperCase();return (DB.glassProduct||[]).find(x=>x.code.toUpperCase()===c)||null;}
/* Из выбора выпадает только снятое с производства. Отсутствие на складе —
   не запрет, а пометка «по предзаказу»: пользователь начал разговор именно
   с того, что заказать можно и то, чего у него нет. */
function activeGlassProducts(){return (DB.glassProduct||[]).filter(x=>x.active!==false);}
function activeSimple(key){return (DB[key]||[]).filter(x=>x.active!==false&&x.availability!=='inactive');}
function glassIsPreorder(g){return !!g&&g.stocked!==true;}
/* Два жёстких гейта. Названы функциями, а не сравнением по месту, потому что
   на них будет опираться проверка маршрута (этап 7·2), а не только показ. */
function glassNeedsFurnace(g){return !!g&&g.temperMode==='temper_required';}
function glassBannedFromFurnace(g){return !!g&&g.temperMode==='annealed_only';}

function glassSheetsFor(code){const c=mdString(code).toUpperCase();return (DB.glassSheet||[]).filter(s=>s.productCode.toUpperCase()===c);}
/* Срок поставки — минимальный из живых точек: заказ уедет туда, где быстрее. */
function glassLeadTimeDays(code){
 const days=glassSheetsFor(code).filter(s=>s.availability!=='inactive'&&s.leadTimeDays!=null).map(s=>s.leadTimeDays);
 return days.length?Math.min.apply(null,days):null;
}
function glassOrphanSheets(){return (DB.glassSheet||[]).filter(s=>!glassProductByCode(s.productCode));}

/* --- 7. Покрытие и базовое стекло ------------------------------------- */

/* В каталоге одна строка на пару «покрытие × базовое стекло», и у Vitro на
   6 мм Low-E таких строк 92. Выбирать из 92 нельзя: у самого поставщика тот
   же выбор сделан ДВУМЯ шагами — сначала покрытие (Solarban 60), потом на
   каком стекле оно лежит (on Acuity, on Azuria, on Clear).

   Отдельных колонок под это в выгрузке IGDB нет — есть имя. Поэтому имя
   разбирается, и правила ровно те, по которым имена и написаны:

     Solarban 60 on Acuity 6mm     → «on»: покрытие · базовое стекло
     LoE 180 on 3mm Clear          → то же, толщина снимается заранее
     Eclipse Advantage + Grey      → «+» у Pilkington значит то же самое
     Eclipse Advantage Grey        → хвост совпал с известным базовым стеклом

   Список базовых стёкол берётся ИЗ САМОГО КАТАЛОГА: непокрытые позиции
   производителя плюс всё, что нашлось после «on» и «+» у него же. Он не
   выдуман, переживает пересборку каталога и растёт вместе с ним.

   Что не разобралось (тридцать позиций Pilkington вида «Energy Advantage OW»)
   остаётся покрытием без базы, и второй список показывает у него подложку.
   Это честно: базового стекла в имени нет, а придумывать его нельзя. */

const GLASS_THICK_RE=/\b\d+(?:[.,]\d+)?\s*mm\b/ig;
function glassCleanName(name){
 return mdString(name).replace(GLASS_THICK_RE,' ')
  .replace(/\s+glass\s*$/i,'')
  .replace(/[\s\-–—]+$/,'')
  .replace(/\s{2,}/g,' ').trim();
}
/* Делим по ПЕРВОМУ вхождению: «Solarban 70 on Optiblue (Solarban z75)» не
   должно разъезжаться на три части. */
function glassSplitAt(text,re){
 const m=text.match(re);
 if(!m||m.index<=0)return null;
 const head=text.slice(0,m.index).trim(),tail=text.slice(m.index+m[0].length).trim();
 return (head&&tail)?[head,tail]:null;
}
/* Индекс базовых стёкол по производителям. Строится лениво и сбрасывается
   нормализацией: каталог меняют импортом и экраном справочников, и
   переименованная позиция обязана перегруппироваться сразу. */
let glassBaseIndex=null;
function glassInvalidateNameIndex(){glassBaseIndex=null;}
function glassBaseNames(manufacturer){
 if(!glassBaseIndex){
  glassBaseIndex=Object.create(null);
  const add=(mfr,name)=>{
   const key=mdString(mfr).toLowerCase();
   if(!name)return;
   if(!glassBaseIndex[key])glassBaseIndex[key]=Object.create(null);
   glassBaseIndex[key][name]=true;
  };
  (DB.glassProduct||[]).forEach(p=>{
   const n=glassCleanName(p.name);
   const on=glassSplitAt(n,/\s+on\s+/i);
   if(on)return add(p.manufacturer,on[1]);
   const plus=glassSplitAt(n,/\s+\+\s+/);
   if(plus)return add(p.manufacturer,plus[1]);
   if(p.coatingFamily==='uncoated')add(p.manufacturer,n);
  });
  Object.keys(glassBaseIndex).forEach(k=>{
   /* сначала длинные: «Arctic Blue» должно выиграть у «Blue» */
   glassBaseIndex[k]=Object.keys(glassBaseIndex[k]).sort((a,b)=>b.length-a.length);
  });
 }
 return glassBaseIndex[mdString(manufacturer).toLowerCase()]||[];
}
function glassNameParts(p){
 if(!p)return {coating:'',base:''};
 const n=glassCleanName(p.name);
 const on=glassSplitAt(n,/\s+on\s+/i);
 if(on)return {coating:on[0],base:on[1]};
 const plus=glassSplitAt(n,/\s+\+\s+/);
 if(plus)return {coating:plus[0]+' +',base:plus[1]};
 const bases=glassBaseNames(p.manufacturer);
 for(let i=0;i<bases.length;i++){
  const b=bases[i];
  if(n.length>b.length+1&&n.slice(-b.length).toLowerCase()===b.toLowerCase()&&n.charAt(n.length-b.length-1)===' ')
   return {coating:n.slice(0,n.length-b.length-1).trim(),base:n.slice(n.length-b.length)};
 }
 return {coating:n,base:''};
}
function glassCoatingName(p){return glassNameParts(p).coating;}
/* Имя базового стекла, а если в имени его нет — подложка. Пустой строки здесь
   не бывает: пользователю нужно что-то выбрать во втором списке. */
function glassBaseName(p){
 const parts=glassNameParts(p);
 return parts.base||(p?glassLabel('substrate',p.substrate):'');
}

/* --- 8. Имена значений на языке интерфейса ---------------------------- */

/* Тот же приём, что sfName в цеховом справочнике: обе колонки лежат здесь, а
   язык только выбирает нужную. Доменные термины через словарь интерфейса не
   гоняем — иначе «прозрачное» однажды переведётся там, где стоит имя товара.
   Значение, которого в таблице нет, показывается как есть: пустая ячейка врёт
   меньше, чем подставленное наугад слово. */
const GLASS_VOCAB={
 substrate:{clear:['прозрачное','clear'],low_iron:['осветлённое','low iron'],tinted:['тонированное','tinted'],patterned:['узорчатое','patterned'],wired:['армированное','wired']},
 coatingFamily:{uncoated:['без покрытия','uncoated'],lowe:['Low-E','Low-E'],reflective:['рефлективное','reflective']},
 temperMode:{temperable:['закаливается','temperable'],temper_required:['только закалённым','temper required'],annealed_only:['в печь нельзя','no tempering'],unknown:['не указано','unknown']},
 exposureRule:{any:['любая поверхность','any surface'],cavity_only:['только внутрь пакета','cavity only'],exterior_only:['только наружу','exterior only'],interior_only:['только в помещение','interior only']},
 deposition:{pyrolytic:['пиролитическое','pyrolytic'],sputtered:['напыление','sputtered']},
 availability:{stock:['склад','stock'],order:['под заказ','order'],special:['спецзаказ','special'],inactive:['снято','inactive']},
 /* Ответ на вопрос, с которого пользователь начал разговор: позиция, которой у
    нас нет, из выбора не исчезает — она берётся по предзаказу. */
 stock:{stocked:['на складе','in stock'],preorder:['по предзаказу','pre-order']}
};
function glassLabel(kind,value){
 const row=(GLASS_VOCAB[kind]||{})[value];
 if(!row)return mdString(value);
 return (typeof LANG!=='undefined'&&LANG==='en')?row[1]:row[0];
}

/* --- 9. Импорт -------------------------------------------------------- */

/* Слияние ПО КОДУ, а не замена таблицы: строки, которые пользователь завёл
   руками, чужой файл сносить не должен. Чего в файле нет — попадает в
   `missing` отчёта, а не удаляется молча. */
function importGlassProductsCsv(text){
 const parsed=glassParseProductsCsv(text),rep=parsed.rep,inFile=Object.create(null);
 parsed.out.forEach(row=>{
  const at=DB.glassProduct.findIndex(p=>p.code.toUpperCase()===row.code.toUpperCase());
  inFile[row.code.toUpperCase()]=true;
  if(at<0){
   DB.glassProduct.push(normalizeGlassProduct(Object.assign({id:glassProductId(row.code)},row.fields)));
   rep.added++;
  }else{
   /* id сохраняется: на него ссылаются Makeup сохранённых заказов. */
   DB.glassProduct[at]=normalizeGlassProduct(Object.assign({},DB.glassProduct[at],row.fields,{id:DB.glassProduct[at].id}));
   rep.updated++;
  }
 });
 DB.glassProduct.forEach(p=>{if(!inFile[p.code.toUpperCase()])rep.missing.push(p.code);});
 normalizeMasterData();
 return rep;
}

/* Импорт GLASS_SHEETS.csv — «почём и каким листом». Строка на неизвестный код
   отклоняется: цена, привязанная к продукту, которого нет, не поддаётся
   проверке и тихо ляжет в себестоимость. */
function importGlassSheetsCsv(text){
 const parsed=parseCsv(text),header=parsed.header,rep=sfReport(),inFile=Object.create(null);
 if(!header.includes('code')||!header.includes('supplier')){
  sfReject(rep,0,'','файл не похож на GLASS_SHEETS.csv: нет колонок code и supplier');
  return rep;
 }
 const has=c=>header.includes(c);
 parsed.rows.forEach((r,n)=>{
  const line=n+2,code=mdString(r.code),supplier=mdString(r.supplier);
  const label=code+(supplier?' · '+supplier:'');
  if(!code)return sfReject(rep,line,'','пустой код продукта');
  if(!supplier)return sfReject(rep,line,code,'пустая точка поставки');
  const product=glassProductByCode(code);
  if(!product)return sfReject(rep,line,label,'продукта '+code+' нет в каталоге');
  if(has('thickness_mm')){
   const t=mdNum(r.thickness_mm);
   if(t!=null&&product.thicknessMm!=null&&t!==product.thicknessMm)
    return sfReject(rep,line,label,'толщина '+t+' мм не совпадает с каталогом ('+product.thicknessMm+' мм)');
  }
  const cur=mdString(r.currency).toUpperCase();
  if(cur&&!CURRENCY_RE.test(cur))return sfReject(rep,line,label,'currency: три буквы кода валюты, например CAD');
  const wIn=mdNonNeg(r.sheet_w_in),hIn=mdNonNeg(r.sheet_h_in);
  if(has('sheet_w_in')&&has('sheet_h_in')&&(wIn==null)!==(hIn==null))
   return sfReject(rep,line,label,'размер листа заполняется парой: sheet_w_in и sheet_h_in');
  const unit=mdUnitCode(r.purchase_unit,'');
  if(mdString(r.purchase_unit)&&!unit)
   return sfReject(rep,line,label,'purchase_unit: неизвестная единица, ожидается '+MD_UNITS.map(u=>u.code).join(' · '));
  const price=mdNonNeg(r.purchase_price);
  if(mdString(r.purchase_price)&&price==null)return sfReject(rep,line,label,'purchase_price: неотрицательное число');
  const lead=mdInt(r.lead_time_days);
  if(mdString(r.lead_time_days)&&lead==null)return sfReject(rep,line,label,'lead_time_days: целое неотрицательное число');
  const avail=mdString(r.availability).toLowerCase();
  if(avail&&!MATERIAL_AVAILABILITY.includes(avail))
   return sfReject(rep,line,label,'availability: ожидается '+MATERIAL_AVAILABILITY.join(' · '));
  const priceDate=mdString(r.price_date);
  if(priceDate&&!ISO_DATE_RE.test(priceDate))return sfReject(rep,line,label,'price_date: дата вида ГГГГ-ММ-ДД');

  const key=glassSheetKey(product.code,supplier,wIn,hIn);
  if(inFile[key])return sfReject(rep,line,label,'та же точка поставки и тот же размер листа повторяются в файле');
  inFile[key]=true;

  const next={productCode:product.code,supplier,sheetWIn:wIn,sheetHIn:hIn};
  if(cur)next.currency=cur;
  if(unit)next.purchaseUnit=unit;
  if(has('purchase_price'))next.purchasePrice=price;
  if(has('price_date'))next.priceDate=priceDate;
  if(has('freight_pct'))next.freightPct=mdNonNeg(r.freight_pct);
  if(has('lead_time_days'))next.leadTimeDays=lead;
  if(avail)next.availability=avail;
  if(has('note'))next.note=mdString(r.note);

  const at=DB.glassSheet.findIndex(s=>glassSheetKey(s.productCode,s.supplier,s.sheetWIn,s.sheetHIn)===key);
  if(at<0){DB.glassSheet.push(normalizeGlassSheet(next));rep.added++;}
  else{DB.glassSheet[at]=normalizeGlassSheet(Object.assign({},DB.glassSheet[at],next,{id:DB.glassSheet[at].id}));rep.updated++;}
  rep.accepted++;
 });
 DB.glassSheet.forEach(s=>{
  if(!inFile[glassSheetKey(s.productCode,s.supplier,s.sheetWIn,s.sheetHIn)])rep.missing.push(s.productCode+' · '+s.supplier);
 });
 normalizeMasterData();
 return rep;
}

/* ==== src/erp/customers/data.js ==== */
/* =====================================================================
   erp/customers/data  ·  customers-1.0
   Customer master: schema, normalization, dedicated import/export.
   IN : DB.customer / CSV / JSON
   OUT: normalized Customer entities
   Rule: no Sales Order / Work Order behavior here.
   ===================================================================== */

DEFAULT.customer=[];
if(!Array.isArray(DB.customer))DB.customer=[];

const CUSTOMER_STATUSES=['active','inactive','archived'];
const CUSTOMER_CURRENCIES=['CAD','USD'];
const CUSTOMER_STATEMENT_DELIVERY=['email','print','both','none'];
const CUSTOMER_FUEL_MODES=['default','custom','exempt'];

function customerUid(prefix){
 prefix=prefix||'CUS';
 try{if(globalThis.crypto&&typeof crypto.randomUUID==='function')return prefix+'-'+crypto.randomUUID();}catch(e){}
 return prefix+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,9).toUpperCase();
}
function customerString(v){return String(v==null?'':v).trim();}
function customerBool(v){
 if(typeof v==='boolean')return v;if(typeof v==='number')return v!==0;
 const s=customerString(v).toLowerCase();
 return ['1','true','yes','y','on','checked','x','да','так'].includes(s);
}
function customerNumber(v){
 if(v==null||v==='')return null;
 const n=Number(String(v).replace(/[$,\s]/g,''));return Number.isFinite(n)?n:null;
}
function customerStatus(v){
 const s=customerString(v).toLowerCase();
 if(['archived','archive','архив','closed','deleted'].includes(s))return 'archived';
 if(['inactive','disabled','неактивный','неактивен'].includes(s))return 'inactive';
 return 'active';
}
function customerStatusLabel(v){return v==='archived'?'Архив':v==='inactive'?'Неактивный':'Активный';}
function customerStatementLabel(v){return v==='print'?'Печать':v==='both'?'Email + печать':v==='none'?'Не отправлять':'Email';}
function customerFuelLabel(v){return v==='custom'?'Индивидуальная ставка':v==='exempt'?'Без топливного сбора':'По умолчанию';}

function normalizeCustomerContact(c,i){
 c=c&&typeof c==='object'?c:{};
 return {
  id:customerString(c.id)||customerUid('CON'),
  name:customerString(c.name),role:customerString(c.role),phone:customerString(c.phone),phone2:customerString(c.phone2),
  mobile:customerString(c.mobile),fax:customerString(c.fax),email:customerString(c.email),
  isPrimary:customerBool(c.isPrimary),isInvoice:customerBool(c.isInvoice),isShipping:customerBool(c.isShipping)
 };
}
function normalizeCustomerAddress(a,i){
 a=a&&typeof a==='object'?a:{};
 const type=['billing','delivery','other'].includes(a.type)?a.type:'other';
 return {
  id:customerString(a.id)||customerUid('ADR'),type,label:customerString(a.label),addressee:customerString(a.addressee),
  address1:customerString(a.address1),address2:customerString(a.address2),address3:customerString(a.address3),
  city:customerString(a.city),province:customerString(a.province),postalCode:customerString(a.postalCode),country:customerString(a.country)||'Canada',
  isDefault:customerBool(a.isDefault)
 };
}
function normalizeLegacyRefs(v){
 const src=v&&typeof v==='object'&&!Array.isArray(v)?v:{};
 const out={sourceSystem:customerString(src.sourceSystem)};
 ['dcLink','flid','iClassID','repID','iAreasID','uiARDeliveryMethod','uiARCATID','accountStatusID','iwg'].forEach(k=>{out[k]=customerString(src[k]);});
 return out;
}
function normalizeCustomer(c,i){
 c=c&&typeof c==='object'?c:{};
 const contacts=(Array.isArray(c.contacts)?c.contacts:[]).map(normalizeCustomerContact);

  if(!o||typeof o!=='object'||Array.isArray(o))throw new Error('Sales Order row '+(i+1)+' must be an object.');
  if(o.lines!=null&&!Array.isArray(o.lines))throw new Error('Sales Order '+(i+1)+': lines must be an array.');
  if(o.makeups!=null&&!Array.isArray(o.makeups))throw new Error('Sales Order '+(i+1)+': makeups must be an array.');
  if(o.id){const id=salesString(o.id);if(!entityId.test(id))throw new Error('Sales Order '+(i+1)+' has an invalid id.');if(ids.has(id))throw new Error('Sales Orders contains duplicate id "'+id+'".');ids.add(id);}
  if(o.businessNumber){const n=salesString(o.businessNumber);if(numbers.has(n))throw new Error('Sales Orders contains duplicate number "'+n+'".');numbers.add(n);}
  const muIds=new Set(),muCodes=new Set();(o.makeups||[]).forEach((m,j)=>{if(!m||typeof m!=='object')throw new Error('Sales Order '+(i+1)+', Makeup '+(j+1)+' must be an object.');if(m.id){const id=salesString(m.id);if(!entityId.test(id))throw new Error('Makeup '+(j+1)+' has an invalid id.');if(muIds.has(id))throw new Error('Makeups contains duplicate id "'+id+'".');muIds.add(id);}if(m.code){const c=salesString(m.code).toUpperCase();if(muCodes.has(c))throw new Error('Makeups contains duplicate code "'+c+'".');muCodes.add(c);}});
  (o.lines||[]).forEach((l,j)=>{if(!l||typeof l!=='object'||Array.isArray(l))throw new Error('Sales Order '+(i+1)+', line '+(j+1)+' must be an object.');if(l.id){const id=salesString(l.id);if(!entityId.test(id))throw new Error('Sales Order '+(o.businessNumber||i+1)+', line '+(j+1)+' has an invalid id.');if(lineIds.has(id))throw new Error('Sales Order lines contains duplicate id "'+id+'".');lineIds.add(id);}if(!l.makeupId)throw new Error('Sales Order '+(o.businessNumber||i+1)+', line '+(j+1)+' has no Makeup.');if(!muIds.has(salesString(l.makeupId)))throw new Error('Sales Order '+(o.businessNumber||i+1)+', line '+(j+1)+' references a missing Makeup.');if(l.width16!=null&&!salesStoredDim16(l.width16))throw new Error('Sales Order '+(o.businessNumber||i+1)+', line '+(j+1)+' has an invalid width16.');if(l.height16!=null&&!salesStoredDim16(l.height16))throw new Error('Sales Order '+(o.businessNumber||i+1)+', line '+(j+1)+' has an invalid height16.');});

  "Её не подставляли по догадке: на единице стоит цена, а выдуманная единица тише и опаснее пустой — в неё верят. Заполняется вместе с прайсом на этапе 6.": "It was not guessed at: the price rides on the unit, and an invented unit is quieter and more dangerous than a blank one — people believe it. It is filled in together with the price list in stage 6.",
  "Именно здесь закрывается самый дорогой дефект Spil: закрыть операцию, которой нет в маршруте детали, физически невозможно — на экране её просто нет. Случай «CNC показал петли выполненными, хотя их не делали» не может возникнуть в принципе.": "This is where Spil\u2019s most expensive defect is closed: an operation that is not in the part\u2019s route physically cannot be signed off — it is simply not on the screen. The case where CNC showed the hinges as done although nobody made them cannot arise at all.",
  "Список пуст, и это честное состояние. Сколько экранов стоит в цеху и какие места висят на каждом — ещё не называли. Засеять «по одному на станцию» значило бы повторить болезнь подстанций Spil: справочник, распухший выдуманными строками.": "The list is empty, and that is the honest state. How many screens stand in the shop and which positions hang on each has not been stated yet. Seeding one per station would repeat the disease of Spil\u2019s sub-stations: a reference table swollen with invented rows.",
  "Одинаковы ли CNC1 / CNC2 / CNC3 по рабочему полю. Если нет — маршрут обязан знать, на какой можно.": "Whether CNC1 / CNC2 / CNC3 share the same working field. If not, the route has to know which one is allowed.",
  "Поведение экрана известно, а сколько их в цеху и какие места висят на каждом — ещё нет. Выдуманные строки сюда не заводим.": "The screen behaviour is known; how many stand in the shop and which positions hang on each is not. We do not create invented rows here.",
  "Справочники обновлены: станция стала шагом маршрута, станки переехали в рабочие места, появились операции и терминалы.": "Reference tables refreshed: the station is now a route step, machines moved to work positions, and operations and terminals were added.",

  "Файл обновляет позиции с теми же кодами и добавляет новые. Колонок, которых нет в шапке файла, импорт не трогает — вернувшийся из Excel файл без пяти колонок не сотрёт оптику остального каталога.": "The file updates items with the same codes and adds new ones. Columns missing from the file header are left untouched — a file that came back from Excel without five columns will not wipe the optics of the rest of the catalog.",
  "Строка опознаётся тройкой продукт · точка поставки · размер листа. Строка на код, которого нет в каталоге, отклоняется: цена без продукта тихо ляжет в себестоимость.": "A row is identified by product · supply point · sheet size. A row whose code is not in the catalog is rejected: a price with no product would quietly land in the cost.",

/* ИСПРАВЛЕНО (авг 2026): данные, которые ввёл пользователь, переводчику не отдаём.
   applyLang ходит по ВСЕМ текстовым узлам, поэтому станция с названием «Закалка»
   в EN превращалась в «Tempering» — то есть RU/EN менял сами данные, а не интерфейс.
   raw() помечает узел атрибутом data-raw, и переводчик его пропускает.
   Для <option> тот же смысл даёт атрибут data-raw прямо на теге.

   Исключение — строки, которые засеяли МЫ (примечания к справочникам цеха):
   их перевод остаётся, иначе в EN каталог по умолчанию был бы русским. Как только
   пользователь перепишет примечание — значение перестаёт совпадать с засеянным
   и дальше не переводится никогда. */
/* Имён станций и рабочих мест здесь БОЛЬШЕ НЕТ, и это не пропуск. У них
   появилось поле nameEn: пользователь заполнил в CSV обе колонки, поэтому
   язык выбирает нужную, а не переводит содержимое базы словарём. В словаре
   остались только примечания — их пользователь написал в одном языке. */
const SEED_TEXT=new Set([].concat(
 (DEFAULT.station||[]).map(s=>s.note),
 (DEFAULT.workPosition||[]).map(w=>w.note),
 (DEFAULT.operation||[]).map(o=>o.note)
).filter(Boolean));
const raw=s=>{s=String(s??'');
 /* засеянное значение оборачиваем в свой <span>: так оно становится отдельным
    текстовым узлом и попадает в словарь целиком, а не куском чужой фразы */
 return SEED_TEXT.has(s)?`<span>${esc(s)}</span>`:`<span data-raw>${esc(s)}</span>`;};
const fail=(el,m)=>{el.textContent=tx(m);el.style.display='block';};

function render(){
 renderNav();
 document.getElementById('dirty').style.display=dirty?'inline-flex':'none';
 const meta={
  dashboard:['Обзор системы','Карта ERP и текущий статус'],
  users:['Пользователи','Роли, рабочие места и покрытие навыков'],
  customers:['Клиенты','Справочник клиентов, контакты и коммерческие условия'],
  sales:['Продажи','Заказы и коммерческая конфигурация'],
  configurators:['Конфигураторы','Инженерные конфигураторы Shape и Muntinbar'],
  optimization:['Оптимизация','Мост данных к Perfect Cut'],
  production:['Производство','Станции · рабочие места · операции · терминалы'],
  masterdata:['Справочники','Каталог стекла · точки поставки · обзор базы']
 }[tab]||['ERP Glazing System','Производственная система'];
 document.getElementById('hdr').textContent=meta[0];
 document.getElementById('hdrSub').textContent=meta[1];
 document.getElementById('phaseChip').innerHTML=ico('activity','icon-inline')+'Фаза 1 · фундамент';
 const V={dashboard:viewDashboard,users:viewUsers,customers:viewCustomers,sales:viewSales,configurators:viewConfigurators,optimization:viewOptimization,production:viewProduction,masterdata:viewMasterData}[tab];
 document.getElementById('app').innerHTML = V ? V() : '<div class="empty">модуль в плане</div>';
 afterRender();
}

   OUT: html

let uEdit=null, uDraft=null;
function viewUsers(){
 if(!subtab || !['list','report'].includes(subtab)) subtab='list';
 const covered=SKILLS.filter(skill=>DB.user.some(u=>(u.skills||[]).map(normSkill).some(x=>x&&x.skill===skill))).length;
 return `<div class="page-head"><div><h2>Команда и доступ к производству</h2><p>Кто работает в системе и на каком рабочем месте стоит по умолчанию. Это префилл экрана, а не закрепление человека за станком: правда о том, кто сделал работу, приходит со скана. Права по модулям и полям будут отдельным слоем.</p></div><span class="pill info">${ico('lock','icon-inline')}права — следующий шаг</span></div>
  <div class="kpi-grid">
   <div class="kpi"><div class="kpi-top"><div class="kpi-icon">${ico('users')}</div></div><div class="kpi-num">${DB.user.length}</div><div class="kpi-label">пользователей</div></div>
   <div class="kpi"><div class="kpi-top"><div class="kpi-icon">${ico('factory')}</div></div><div class="kpi-num">${DB.user.filter(u=>u.workPosition).length}</div><div class="kpi-label">привязано к рабочему месту</div></div>
   <div class="kpi"><div class="kpi-top"><div class="kpi-icon">${ico('check')}</div></div><div class="kpi-num">${covered}/${SKILLS.length}</div><div class="kpi-label">типов навыков покрыто</div></div>
   <div class="kpi"><div class="kpi-top"><div class="kpi-icon">${ico('alert')}</div></div><div class="kpi-num">${SKILLS.length-covered}</div><div class="kpi-label">навыков без носителя</div></div>
  </div>
  <div class="card">
   <div class="tabs">
    <button class="${subtab==='list'?'on':''}" onclick="subtab='list';render()">Пользователи</button>
    <button class="${subtab==='report'?'on':''}" onclick="subtab='report';render()">Покрытие навыков</button>
   </div>
   ${subtab==='report'?skillReport():viewUsersList()}
  </div>`;
}
function viewUsersList(){
 const rows=DB.user.map((u,i)=>{
  const st=DB.workPosition.find(w=>w.code===u.workPosition);
  const skillPills=(u.skills||[]).map(skillBadgeHTML).join(' ');
  return `<tr><td><b>${raw(u.name)}</b></td><td>${esc(u.role)}</td>
   <td class="mono">${st?`<span data-raw>${esc(st.code)}</span> — ${sfLabel(st)}`:'<span class="mut">не назначено</span>'}</td>
   <td>${skillPills||'<span class="mut">—</span>'}</td>
   <td style="white-space:nowrap"><button class="sm" onclick="uEdit=${i};uDraft=JSON.parse(JSON.stringify(DB.user[${i}]));uDraft.skills=(uDraft.skills||[]).map(normSkill);render()">Изменить</button>
   <button class="sm dl" onclick="delUser(${i})">×</button></td></tr>`;
 }).join('');
 return `${uEdit!==null?userForm():''}
  <table><thead><tr><th>Имя</th><th>Роль</th><th>Рабочее место</th><th>Навыки</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="5" class="empty">пусто</td></tr>'}</tbody></table>
  ${uEdit!==null?'':'<div class="row"><button class="pri" onclick="uEdit=\'new\';uDraft={name:\'\',role:SAFE_DEFAULT_ROLE,workPosition:\'\',skills:[]};render()">Добавить пользователя</button></div>'}`;
}
function userForm(){
 const r = uDraft;
 return `<div class="form"><h3>${uEdit==='new'?'Новый пользователь':'Изменение'}</h3>
  <div class="grid">
   <div><label>Имя *</label><input id="u_name" value="${esc(r.name||'')}" oninput="uDraft.name=this.value"></div>
   <div><label>Роль *</label><select id="u_role" onchange="uDraft.role=this.value">${ROLES.map(x=>`<option ${x===r.role?'selected':''}>${x}</option>`).join('')}</select></div>
   <div><label>Рабочее место по умолчанию</label><select id="u_workPosition" onchange="uDraft.workPosition=this.value"><option value="">— нет —</option>
    ${DB.workPosition.map(w=>`<option value="${esc(w.code)}" ${w.code===r.workPosition?'selected':''} data-raw>${esc(w.code)} — ${esc(sfName(w))}</option>`).join('')}</select></div>
  </div>
  <div style="margin-top:12px"><label>Навыки и уровень владения</label>
   <div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">
   ${SKILLS.map(s=>{
     const entry=(r.skills||[]).find(x=>x.skill===s);
     return `<div style="display:flex;align-items:center;gap:8px">
      <label class="chk" style="min-width:230px"><input type="checkbox" ${entry?'checked':''} onchange="toggleUserSkill('${esc(s)}',this.checked)"> ${esc(s)}</label>
      ${entry?`<select onchange="setUserSkillLevel('${esc(s)}',this.value)">${SKILL_LEVELS.map(l=>`<option ${l===entry.level?'selected':''}>${l}</option>`).join('')}</select>`:'<span class="mut" style="font-size:12px">не отмечено</span>'}
     </div>`;
   }).join('')}
   </div>
  </div>
  <div class="err" id="e_user"></div>
  <div class="row"><button class="pri" onclick="saveUser()">Сохранить</button><button onclick="uEdit=null;uDraft=null;render()">Отмена</button></div></div>`;
}
function toggleUserSkill(skill, checked){
 if(!uDraft.skills) uDraft.skills=[];
 if(checked){ if(!uDraft.skills.some(x=>x.skill===skill)) uDraft.skills.push({skill, level:'Новичок'}); }
 else { uDraft.skills=uDraft.skills.filter(x=>x.skill!==skill); }
 render();
}
function setUserSkillLevel(skill, level){
 const e=uDraft.skills.find(x=>x.skill===skill); if(e) e.level=level;
}
function saveUser(){
 const e=document.getElementById('e_user'); e.style.display='none';
 uDraft.name=(uDraft.name||'').trim();
 if(!uDraft.name) return fail(e,'Укажи имя');
 if(uEdit==='new') DB.user.push(uDraft); else Object.assign(DB.user[uEdit],uDraft);
 uEdit=null; uDraft=null; touch(); render();
}
function delUser(i){ if(!confirm('Delete this user?'))return; DB.user.splice(i,1); touch(); render(); }

/* --- отчёт: свод по навыкам всех людей сразу, чекбоксы этого не умеют,
   поэтому это отдельный экран, а не ещё одна колонка в списке --- */
function skillReport(){
 const cards=SKILLS.map(skill=>{
  const people=DB.user.filter(u=>(u.skills||[]).map(normSkill).some(x=>x&&x.skill===skill));
  const pct=DB.user.length?Math.min(100,Math.round(people.length/DB.user.length*100)):0;
  const byLevel={}; SKILL_LEVELS.forEach(l=>byLevel[l]=[]);
  DB.user.forEach(u=>{const e=(u.skills||[]).map(normSkill).find(x=>x&&x.skill===skill);if(e&&byLevel[e.level]) byLevel[e.level].push(u.name);});
  const total=SKILL_LEVELS.reduce((s,l)=>s+byLevel[l].length,0), cls=total===0?'bad':total===1?'warn':'ok';
  return `<div class="skill-card skill-coverage-card"><div class="skill-card-icon">${ico(skillIconName(skill))}</div><div class="skill-card-body"><b>${esc(skill)}</b><small>${total===0?'нет носителя':total===1?'риск: 1 человек':total+' человека'}</small><div class="bar-bg" style="margin-top:9px"><div class="bar-fill" style="width:${pct}%"></div></div><div class="skill-card-meta">${SKILL_LEVELS.map(l=>`<span class="pill ${byLevel[l].length?'info':''}">${esc(l)} · ${byLevel[l].length}</span>`).join(' ')}</div></div></div>`;
 }).join('');
 const rows=SKILLS.map(skill=>{
  const byLevel={}; SKILL_LEVELS.forEach(l=>byLevel[l]=[]);
  DB.user.forEach(u=>{const e=(u.skills||[]).map(normSkill).find(x=>x&&x.skill===skill);if(e&&byLevel[e.level]) byLevel[e.level].push(u.name);});
  const total=SKILL_LEVELS.reduce((s,l)=>s+byLevel[l].length,0), cls=total===0?'bad':total===1?'warn':'ok';
  return `<tr><td><b>${esc(skill)}</b></td>${SKILL_LEVELS.map(l=>`<td>${byLevel[l].length?byLevel[l].map(raw).join(', '):'<span class="mut">—</span>'}</td>`).join('')}<td><span class="pill ${cls}">${total===0?'нет носителя':total===1?'риск: 1 человек':total+' человека'}</span></td></tr>`;
 }).join('');
 return `<div class="sub">Сначала визуальный слой — видно пробелы в компетенциях. Ниже остаётся точная матрица по уровням.</div>
  <div class="skill-card-grid" style="margin-bottom:14px">${cards}</div>
  <table><thead><tr><th>Навык</th>${SKILL_LEVELS.map(l=>`<th>${l}</th>`).join('')}<th>Покрытие</th></tr></thead><tbody>${rows}</tbody></table>`;
}

let cEdit=null,cDraft=null,cTab='general',cSearch='',cFilter='active';
function customerVisibleRows(){
 const q=customerString(cSearch).toLowerCase();
 return DB.customer.filter(c=>{
  if(cFilter==='active'&&c.status!=='active')return false;
  if(cFilter==='prospect'&&!c.isProspect)return false;
  if(cFilter==='hold'&&!c.onHold)return false;
  if(cFilter==='archived'&&c.status!=='archived')return false;
  if(q){const p=customerPrimaryContact(c),hay=[c.code,c.legalName,c.displayName,c.customerType,c.group,c.area,c.salesRep,c.taxNumber,p.name,p.phone,p.email].join(' ').toLowerCase();if(!hay.includes(q))return false;}
  return true;
 });
}
function customerSearchChange(el){cSearch=el.value;const pos=el.selectionStart;render();requestAnimationFrame(()=>{const e=document.getElementById('customerSearch');if(e){e.focus();try{e.setSelectionRange(pos,pos);}catch(x){}}});}
function viewCustomers(){
 const active=DB.customer.filter(c=>c.status==='active').length,prospects=DB.customer.filter(c=>c.isProspect).length,holds=DB.customer.filter(c=>c.onHold).length,arch=DB.customer.filter(c=>c.status==='archived').length;
 return `<div class="page-head"><div><h2>Клиенты</h2><p>Единый справочник клиентов для будущих Sales Orders. Контакты, адреса, кредитные условия и legacy-ID хранятся отдельно и не смешиваются с производственными данными.</p></div><span class="pill info">Customer Master · v1</span></div>

function saveCustomer(){
 const e=document.getElementById('e_customer');e.style.display='none';
 cDraft=normalizeCustomer(cDraft);cDraft.legalName=customerString(cDraft.legalName);cDraft.displayName=customerString(cDraft.displayName)||cDraft.legalName;
 if(!cDraft.legalName)return fail(e,'Укажи Legal Name');
 if(!cDraft.code)cDraft.code=nextCustomerCode();
 if(DB.customer.some(c=>c.id!==cDraft.id&&String(c.code).toUpperCase()===String(cDraft.code).toUpperCase()))return fail(e,'Customer Code уже используется');
 if(cDraft.onHold&&!cDraft.holdReason)cDraft.holdReason='Management hold';
 cDraft.updatedAt=new Date().toISOString();if(!cDraft.createdAt)cDraft.createdAt=cDraft.updatedAt;if(cDraft.status==='archived'&&!cDraft.archivedAt)cDraft.archivedAt=cDraft.updatedAt;if(cDraft.status!=='archived')cDraft.archivedAt='';
 if(cEdit==='new')DB.customer.push(cDraft);else{const i=DB.customer.findIndex(c=>c.id===cEdit);if(i>=0)DB.customer[i]=cDraft;else DB.customer.push(cDraft);}
 normalizeCustomers();cEdit=null;cDraft=null;touch();render();
}

let soEdit=null,soDraft=null,soSearch='',soMakeupId=null;
let soExcelMode='current';
let soSelectedLines=new Set();

function salesFindCustomer(id){return (DB.customer||[]).find(c=>c.id===id)||null;}
function salesApplyCustomerDefaults(id){
 const c=salesFindCustomer(id);soDraft.customerId=id||'';if(!c)return;
 if(c.paymentTerms)soDraft.paymentTerms=c.paymentTerms;if(c.currency)soDraft.currency=c.currency;
 const dm=String(c.defaultDeliveryMethod||'').toLowerCase();if(dm.includes('pickup'))soDraft.delivery='pickup';else if(dm)soDraft.delivery='delivery';
}
function salesOrderSearchChange(el){soSearch=el.value;const pos=el.selectionStart;render();requestAnimationFrame(()=>{const e=document.getElementById('salesOrderSearch');if(e){e.focus();try{e.setSelectionRange(pos,pos);}catch(x){}}});}
function salesOrderNew(){soEdit='new';soDraft=newSalesOrderDraft();soMakeupId=soDraft.makeups[0].id;soSelectedLines=new Set();soOpenSectionKey=null;subtab='orders';render();}

/* Закрытие черновика спрашивает подтверждение, если в нём есть что терять.
   Раньше Close молча стирал введённые строки — оператор терял работу без единого
   сообщения. Сравниваем с сохранённым состоянием: у нового заказа терять нечего,
   пока в нём нет строк. */
function salesDraftHasWork(){
 if(!soDraft)return false;
 if(soEdit==='new')return soDraft.lines.length>0;
 const saved=DB.salesOrder.find(x=>x.id===soEdit);
 return saved?JSON.stringify(saved)!==JSON.stringify(normalizeSalesOrder(soDraft)):soDraft.lines.length>0;
}
function salesOrderClose(){
 if(salesDraftHasWork()&&!confirm('Close without saving? Unsaved changes to this order will be lost.'))return;
 soEdit=null;soDraft=null;soMakeupId=null;soSelectedLines=new Set();soOpenSectionKey=null;salesBridge=null;render();
}
function salesOrderSave(){
 const e=document.getElementById('e_sales_order');if(e)e.style.display='none';
 soDraft=normalizeSalesOrder(soDraft);if(!soDraft.customerId)return fail(e,'Select a Customer');
 const customer=salesFindCustomer(soDraft.customerId);if(!customer)return fail(e,'Customer not found');
 /* Строка без размера уезжала в Draft молча и всплывала уже в цеху.
    Размер обязателен всегда — и когда введён руками, и когда пришёл из Shape. */
 const noDim=soDraft.lines.map((l,i)=>(!l.width16||!l.height16)?i+1:0).filter(Boolean);
 if(noDim.length)return fail(e,noDim.length===1
   ?'Line '+noDim[0]+' has no width or height. Enter the size or remove the line.'
   :'Lines without width or height: '+noDim.join(', ')+'. Enter the sizes or remove these lines.');
 if(!soDraft.businessNumber)soDraft.businessNumber=nextSalesOrderNumber();
 soDraft.updatedAt=new Date().toISOString();if(!soDraft.createdAt)soDraft.createdAt=soDraft.updatedAt;
 if(soEdit==='new')DB.salesOrder.push(soDraft);else{const i=DB.salesOrder.findIndex(x=>x.id===soEdit);if(i>=0)DB.salesOrder[i]=soDraft;else DB.salesOrder.push(soDraft);}
 normalizeSalesData();soEdit=soDraft.id;soDraft=JSON.parse(JSON.stringify(DB.salesOrder.find(x=>x.id===soEdit)));if(!salesMakeupById(soDraft,soMakeupId))soMakeupId=soDraft.makeups[0].id;touch();render();
}

function salesCurrentMakeup(){if(!soDraft)return null;let m=salesMakeupById(soDraft,soMakeupId);if(!m)m=soDraft.makeups[0]||null;if(m)soMakeupId=m.id;return m;}

function salesDuplicateMakeup(id){const src=salesMakeupById(soDraft,id);if(!src)return;const copy=JSON.parse(JSON.stringify(src));copy.id=salesUid('MU');copy.code=nextMakeupCode(soDraft);copy.createdAt=copy.updatedAt=new Date().toISOString();copy.panes.forEach((p,i)=>p.id=salesUid('LITE'));copy.cavities.forEach(c=>c.id=salesUid('CAV'));soDraft.makeups.push(copy);soMakeupId=copy.id;soOpenSectionKey=null;render();}

/* Поверхности, на которых это покрытие вообще законно. `allowed_surfaces`
   каталога — номера в пакете (2,3 у напылённых), а Lite держит свою пару
   (#1 #2 снаружи, #3 #4 внутри); пересечение и есть ответ. Пустое пересечение
   означает, что каталог и конструкция не сходятся — тогда показываем всё и не
   мешаем человеку работать. */
function salesAllowedCoatingSurfaces(p,index){
 const nums=salesPaneSurfaces(index),g=glassProductById(p.glassProductId);
 if(!g||!g.allowedSurfaces.length)return nums;
 const ok=nums.filter(n=>g.allowedSurfaces.indexOf(n)>=0);
 return ok.length?ok:nums;
}
/* Смена продукта подставляет ЗАКОННУЮ поверхность по умолчанию: у напыления
   это #2 снаружи. Выбор при этом не запирается — вторая кнопка остаётся
   нажимаемой, просто помечена как не по каталогу. */
function salesPaneSetProduct(i,v){
 const p=salesCurrentMakeup().panes[i],g=glassProductById(v);
 p.glassProductId=v;
 if(g){p.manufacturer=g.manufacturer;p.thicknessMm=g.thicknessMm;}
 if(g&&(p.visionType==='lowe'||p.visionType==='reflective')){
  const ok=salesAllowedCoatingSurfaces(p,i);
  if(ok.indexOf(+p.coatingSurface)<0)p.coatingSurface=ok[0]||null;
 }
 render();
}
/* Первый шаг выбора: ПОКРЫТИЕ. Второй — на каком стекле оно лежит. Пока шаг
   был один, Vitro 6 мм Low-E выкатывал 92 строки одним списком. */
function salesPaneSetCoating(i,coating){
 const p=salesCurrentMakeup().panes[i],rows=salesGlassVariants(p,coating);
 if(!rows.length)return render();
 /* уже выбранное стекло того же покрытия не сбрасываем */
 if(rows.some(g=>g.id===p.glassProductId))return render();
 /* Базовое стекло переносим: сменить покрытие — значит сменить покрытие, а не
    вернуться к первой подложке в списке. Solarban 60 on Azuria → Solarban 90
    on Azuria, и человек не выбирает подложку заново на каждом шаге. */
 const base=glassBaseName(glassProductById(p.glassProductId));
 const same=base?rows.filter(g=>glassBaseName(g)===base)[0]:null;
 salesPaneSetProduct(i,(same||rows[0]).id);
}
function salesPaneSetHeat(i,v){salesCurrentMakeup().panes[i].heatTreatmentId=v;render();}
function salesPaneSetCoatingSurface(i,v){const p=salesCurrentMakeup().panes[i];p.coatingSurface=normalizeSurface(v,salesPaneSurfaces(i));render();}
function salesPaneSetFrit(i,k,v){const p=salesCurrentMakeup().panes[i];if(k==='surface')p.frit.surface=normalizeSurface(v,salesPaneSurfaces(i));else p.frit[k]=v;render();}
/* Диаметр точки и отступы — числа, а не свободный текст: мусор ловим прямо на
   поле, как на размерах строки заказа. Ноль в отступе законен и обязан

 if(!Number.isFinite(n)||n<=0){el.classList.add('bad');return;}
 p.frit.dotMm=n;el.value=String(n);el.classList.remove('bad');

function salesPaneSetSpandrel(i,k,v){const p=salesCurrentMakeup().panes[i];if(k==='surface')p.spandrel.surface=normalizeSurface(v,salesPaneSurfaces(i));else p.spandrel[k]=v;render();}

function salesExcelSetMode(v){soExcelMode=v==='withMakeup'?'withMakeup':'current';const hint=document.getElementById('salesExcelCols');if(hint)hint.textContent=soExcelMode==='withMakeup'?'MU | Qty | Width | Height | Mark':'Qty | Width | Height | Mark';}
function salesExcelApply(){
 const text=document.getElementById('salesExcelText').value,rows=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let added=0,bad=0;const current=salesCurrentMakeup();
 /* Порядок колонок совпадает с таблицей строк заказа: Width, затем Height.
    Раньше вставка ждала Height первым, а таблица показывала Width — на пачке
    строк это давало перевёрнутые размеры, самую дорогую ошибку в стекле. */
 rows.forEach(r=>{const c=r.split(/\t|,|;/).map(x=>x.trim());let mu=current,q,h,w,mark;if(soExcelMode==='withMakeup'){if(c.length<5){bad++;return;}mu=soDraft.makeups.find(m=>m.code.toUpperCase()===String(c[0]).toUpperCase());q=salesPositiveInt(c[1],0);w=salesDimTo16(c[2]);h=salesDimTo16(c[3]);mark=c[4];}else{if(c.length<4){bad++;return;}q=salesPositiveInt(c[0],0);w=salesDimTo16(c[1]);h=salesDimTo16(c[2]);mark=c[3];}
  if(!mu||!q||!h||!w){bad++;return;}soDraft.lines.push(normalizeSalesOrderLine({makeupId:mu.id,qty:q,height16:h,width16:w,mark}));added++;
 });
 salesExcelClose();render();if(bad)alert('Rows added: '+added+'. Skipped: '+bad);else if(added)alert('Rows added: '+added);
}

function salesShapeByRef(ref){return ref&&ref.id?DB.shapeDef.find(s=>s.id===ref.id)||null:null;}
function salesMuntinByRef(ref){return ref&&ref.id?DB.muntinDef.find(m=>m.id===ref.id)||null:null;}
/* Edge-processing allowance belongs to the glass selected in the line's Makeup,
   not to a manually entered Shape thickness. The Shape editor keeps the legacy
   schema field only as an internal calculation input so old saved definitions and
   v4.5 fingerprints remain compatible. */
function salesLineGlassThicknesses(line){
 const m=line&&soDraft?salesMakeupById(soDraft,line.makeupId):null,out=[];if(!m)return out;
 (m.panes||[]).forEach(p=>{const g=glassProductById(p.glassProductId),v=+(g&&g.thicknessMm!=null?g.thicknessMm:p.thicknessMm);if(Number.isFinite(v)&&v>0&&out.indexOf(v)<0)out.push(v);});
 return out.sort((a,b)=>a-b);
}
function salesApplyLineGlassThicknessToShape(line,shape){
 if(!shape)return null;const values=salesLineGlassThicknesses(line);
 if(values.length===1){shape.thickness=String(values[0]);return values[0];}
 /* Mixed-thickness IGUs do not have one safe allowance. Fail closed instead of
    silently using the old 6 mm default. A production rule can be added later if
    the owner defines how edgework should behave for mixed lite thicknesses. */
 if(values.length>1)shape.thickness='';
 return null;
}
function salesShapeRefFrom(s){const r=s&&ShapeModule.compute(s),ready=r&&(r.valid||(r.externalFile&&r.sourceValid));return s&&ready?{id:s.id,revision:s.revision||0,fingerprint:r.fingerprint||''}:{id:'',revision:null,fingerprint:''};}
function salesMuntinRefFrom(m){return m?{id:m.id,shapeId:m.shapeId||'',shapeRevision:m.shapeRevision==null?null:m.shapeRevision}:{id:'',shapeId:'',shapeRevision:null};}
function salesSyncLineFromShape(line,s){const r=s&&ShapeModule.compute(s),external=r&&r.externalFile&&r.sourceValid;if(!r||(!r.valid&&!external))return false;line.width16=Math.round(r.width*16);line.height16=Math.round(r.height*16);line.shapeRef=salesShapeRefFrom(s);if(line.muntinRef&&line.muntinRef.id&&line.muntinRef.shapeId!==s.id)line.muntinRef=normalizeMuntinRef({});return true;}
function salesOrderConfigureShape(i){
 const line=soDraft.lines[i];if(!line)return;salesBridge={kind:'shape',lineId:line.id};tab='configurators';subtab='shape';sView='setup';sEdgeworkOpen=false;sFeaturesOpen=false;
 const current=salesShapeByRef(line.shapeRef);if(current){const idx=DB.shapeDef.findIndex(s=>s.id===current.id);sEdit=idx;sDraft=normalizeShapeDef(JSON.parse(JSON.stringify(current)));}
 else{sEdit='new';sDraft=newShapeDef('rectangle');sDraft.name=(soDraft.businessNumber||'SO')+' · '+(line.mark||('Line '+(i+1)));if(line.width16)sDraft.w=salesDimFrom16(line.width16);if(line.height16)sDraft.h=salesDimFrom16(line.height16);}
 salesApplyLineGlassThicknessToShape(line,sDraft);
 render();
}
function salesBridgeOnShapeSaved(id){if(!salesBridge||salesBridge.kind!=='shape'||!soDraft)return false;const line=soDraft.lines.find(l=>l.id===salesBridge.lineId),s=DB.shapeDef.find(x=>x.id===id);if(line&&s)salesSyncLineFromShape(line,s);salesBridge=null;sEdit=null;sDraft=null;tab='sales';subtab='orders';touch();render();return true;}
function salesUnlinkShape(i){const l=soDraft.lines[i];if(!l)return;if(l.muntinRef&&l.muntinRef.id&&!confirm('This Shape is linked to a Muntin layout. Unlink both?'))return;l.shapeRef=normalizeShapeRef({});l.muntinRef=normalizeMuntinRef({});render();}
function salesOrderConfigureMuntin(i){
 const line=soDraft.lines[i];if(!line)return;const shape=salesShapeByRef(line.shapeRef);if(!shape)return alert('Configure the Shape for this line first.');salesBridge={kind:'muntin',lineId:line.id};tab='configurators';subtab='muntin';mFieldErrors={};
 const current=salesMuntinByRef(line.muntinRef);if(current){mEdit=DB.muntinDef.findIndex(m=>m.id===current.id);mDraft=JSON.parse(JSON.stringify(current));mDraft.muntin=normalizeMuntinModel(mDraft.muntin);}
 else{mEdit='new';mDraft=newMuntinDef(shape.id);mDraft.name=(soDraft.businessNumber||'SO')+' · '+(line.mark||('Line '+(i+1)))+' Muntin';pinMuntinShape(mDraft,shape);}
 render();
}
function salesBridgeOnMuntinSaved(id){if(!salesBridge||salesBridge.kind!=='muntin'||!soDraft)return false;const line=soDraft.lines.find(l=>l.id===salesBridge.lineId),m=DB.muntinDef.find(x=>x.id===id);if(line&&m)line.muntinRef=salesMuntinRefFrom(m);salesBridge=null;mEdit=null;mDraft=null;mFieldErrors={};tab='sales';subtab='orders';touch();render();return true;}

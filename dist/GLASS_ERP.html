function salesBridgeCancel(kind){if(!salesBridge||salesBridge.kind!==kind)return false;salesBridge=null;if(kind==='shape'){sEdit=null;sDraft=null;}if(kind==='muntin'){mEdit=null;mDraft=null;mFieldErrors={};}tab='sales';subtab='orders';render();return true;}

/* ==== src/erp/sales/makeup-ui.js ==== */
/* =====================================================================
   erp/sales/makeup-ui · sales-0.3b-makeup
   Compact UX for order-scoped IGU Makeups. Visual reference: IGU Builder;
   data model remains ERP-native and uses Master Data IDs.
   ===================================================================== */

function salesOption(value,label,selected,rawText){return `<option ${rawText?'data-raw':''} value="${esc(value)}" ${selected===value?'selected':''}>${esc(label)}</option>`;}
function salesUnique(arr){return [...new Set(arr.filter(x=>x!==''&&x!=null))];}
function salesManufacturers(){return salesUnique(activeGlassProducts().map(x=>x.manufacturer)).sort();}
function salesThicknessesFor(p){return salesUnique(activeGlassProducts().filter(x=>!p.manufacturer||x.manufacturer===p.manufacturer).map(x=>x.thicknessMm)).sort((a,b)=>a-b);}
function salesBaseGlassCandidates(p){return activeGlassProducts().filter(g=>(!p.manufacturer||g.manufacturer===p.manufacturer)&&(!p.thicknessMm||g.thicknessMm===+p.thicknessMm)&&g.coatingFamily==='uncoated');}
/* Позиция без галочки склада помечается прямо в списке выбора, но из него не
   выпадает: заказать можно и то, чего у нас нет. Строка помечена data-raw и
   собирается заново на каждом переключении языка, поэтому пометка приезжает
   уже на нужном языке, а имя товара переводчик не трогает. */
/* Короткого кода в списке НЕТ намеренно: он уже стоит в шапке Lite и в коде
   makeup, а в строке выбора только мешает читать имя. */
function salesGlassProductOptions(rows,selected){return `<option value="">— select —</option>`+rows.map(g=>salesOption(g.id,g.name+(glassIsPreorder(g)?' · '+glassLabel('stock','preorder'):''),selected,true)).join('');}
/* --- Два шага выбора покрытого стекла --------------------------------
   Раньше шаг был один, и Vitro 6 мм Low-E выкатывал 92 строки списком.
   Теперь как у самого поставщика: сначала покрытие, потом на каком стекле. */
function salesGlassCoatings(p){
 const seen=Object.create(null),out=[];
 salesGlassCandidates(p).forEach(g=>{const c=glassCoatingName(g);if(c&&!seen[c]){seen[c]=true;out.push(c);}});
 return out.sort((a,b)=>a.localeCompare(b));
}
function salesGlassVariants(p,coating){return salesGlassCandidates(p).filter(g=>glassCoatingName(g)===coating);}
function salesCurrentCoating(p){return glassCoatingName(glassProductById(p.glassProductId));}
/* Подпись варианта — базовое стекло. Пара по закалке («Solarban 60 on Clear»
   заведена и закаливаемой, и незакаливаемой) иначе выглядела бы двумя
   одинаковыми строками, поэтому гейт печи стоит прямо в подписи. */
function salesGlassVariantLabel(g){
 const bits=[glassBaseName(g)];
 if(glassNeedsFurnace(g))bits.push(glassLabel('temperMode','temper_required'));
 else if(glassBannedFromFurnace(g))bits.push(glassLabel('temperMode','annealed_only'));
 if(glassIsPreorder(g))bits.push(glassLabel('stock','preorder'));
 return bits.join(' · ');
}
function salesGlassVariantOptions(rows,selected){
 return `<option value="">— select —</option>`+rows.map(g=>salesOption(g.id,salesGlassVariantLabel(g),selected,true)).join('');
}
/* Что именно выбрано: подложка, покрытие, закалка и наличие. До этого в
   конфигураторе было видно одно имя, и разница между двумя соседними строками
   каталога — например закаливаемой и незакаливаемой версией одного покрытия —
   на экране не существовала. */
function salesGlassMeta(g){
 if(!g)return '';
 const facts=[glassLabel('substrate',g.substrate),glassLabel('coatingFamily',g.coatingFamily)];
 if(g.deposition)facts.push(glassLabel('deposition',g.deposition));
 if(g.thicknessMm!=null)facts.push(g.thicknessMm+' mm');
 const pills=[];
 if(glassNeedsFurnace(g))pills.push(`<span class="pill bad">${esc(glassLabel('temperMode','temper_required'))}</span>`);
 else if(glassBannedFromFurnace(g))pills.push(`<span class="pill warn">${esc(glassLabel('temperMode','annealed_only'))}</span>`);
 pills.push(g.stocked?`<span class="pill ok">${esc(glassLabel('stock','stocked'))}</span>`
  :`<span class="pill info">${esc(glassLabel('stock','preorder'))}</span>`);
 const lead=glassLeadTimeDays(g.code);
 if(!g.stocked&&lead!=null)pills.push(`<span class="pill" data-raw>${esc(lead)} d</span>`);
 if(g.exposureRule!=='any')pills.push(`<span class="pill info">${esc(glassLabel('exposureRule',g.exposureRule))}</span>`);
 return `<div class="mu-glass-meta"><span class="mut" data-raw>${esc(facts.join(' · '))}</span>${pills.join('')}</div>`;
}
/* Контейнер меты рендерится ВСЕГДА, даже пустой: иначе выбор стекла менял
   высоту ряда, и соседний Lite подпрыгивал. */
function salesGlassMetaFor(id){return salesGlassMeta(glassProductById(id))||'<div class="mu-glass-meta"></div>';}
function salesSimpleOptions(key,selected){return activeSimple(key).map(x=>salesOption(x.id,(x.code?x.code+' · ':'')+x.name,selected,true)).join('');}
function salesSurfaceSelector(label,index,value,handler){const nums=salesPaneSurfaces(index);return `<div class="mu-surface"><label>${label}</label><div class="mu-surface-buttons">${nums.map(n=>`<button type="button" class="${+value===n?'on':''}" onclick="${handler}(${n})">#${n}</button>`).join('')}</div></div>`;}
function salesPaneProductSummary(p,index){
 if(p.category==='laminated'){const a=glassProductById(p.laminated.outerGlassProductId),b=glassProductById(p.laminated.innerGlassProductId),il=mdById('interlayerProduct',p.laminated.interlayerProductId);return [a&&(a.code||a.name),il&&(il.code||il.name),b&&(b.code||b.name)].filter(Boolean).join(' + ')||'Laminated';}
 const g=glassProductById(p.glassProductId),ht=mdById('heatTreatment',p.heatTreatmentId),bits=[g?(g.code||g.name):'Glass'];
 if(p.category==='spandrel'){bits.push('Spandrel'+(p.spandrel.color?' '+p.spandrel.color:''));if(p.spandrel.surface)bits.push('#'+p.spandrel.surface);}
 else if(p.visionType==='frit'){bits.push('Frit'+(p.frit.color?' '+p.frit.color:''));if(p.frit.surface)bits.push('#'+p.frit.surface);}
 else if(p.visionType==='lowe'||p.visionType==='reflective'){bits.push(salesVisionTypeLabel(p.visionType));if(p.coatingSurface)bits.push('#'+p.coatingSurface);}
 if(ht&&ht.code!=='AN')bits.push(ht.code);return bits.join(' · ');
}

function salesAccordionToggle(el,key){
 if(!el)return;
 if(!el.open){if(soOpenSectionKey===key)soOpenSectionKey=null;return;}
 soOpenSectionKey=key;
 const stack=el.closest('.mu-stack');if(!stack)return;
 stack.querySelectorAll('details.mu-section[open]').forEach(x=>{if(x!==el)x.open=false;});
}
function salesCavitySummary(c){
 const sp=mdById('spacerVariant',c.spacerVariantId),gas=mdById('gasProduct',c.gasProductId),pri=mdById('sealantProduct',c.primarySealantId),sec=mdById('sealantProduct',c.secondarySealantId);
 const bits=[sp?sp.name:'Spacer',gas?gas.name:'Gas'];if(pri||sec)bits.push([pri&&(pri.code||pri.name),sec&&(sec.code||sec.name)].filter(Boolean).join(' / '));return bits.join(' · ');
}
function salesMakeupTabs(){
 const selected=salesCurrentMakeup();return `<div class="mu-strip"><div class="mu-strip-scroll">${soDraft.makeups.map(m=>`<button type="button" class="mu-tab ${selected&&selected.id===m.id?'on':''}" onclick="salesSelectMakeup('${esc(m.id)}')"><b>${esc(m.code)}</b><span>${esc(salesMakeupSummary(m))}</span></button>`).join('')}</div><button type="button" class="mu-add" onclick="salesAddMakeup()">+ Makeup</button></div>`;
}
function salesUnitTypeControl(m){return `<div class="mu-unit-row"><span>UNIT TYPE</span><div class="mu-segment">${[['single','Single Lite'],['double','Double'],['triple','Triple']].map(x=>`<button type="button" class="${m.unitType===x[0]?'on':''}" onclick="salesSetUnitType('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="mu-total"><span>Overall</span><b>${salesMakeupThicknessMm(m)==null?'—':salesMakeupThicknessMm(m).toFixed(1)+' mm'}</b></div></div>`;}
function salesLiteCategoryTabs(p,index){return `<div class="mu-lite-tabs">${[['vision','Vision'],['spandrel','Spandrel'],['laminated','Laminated']].map(x=>`<button type="button" class="${p.category===x[0]?'on':''}" onclick="salesSetPaneCategory(${index},'${x[0]}')">${x[1]}</button>`).join('')}</div>`;}
function salesManufacturerField(p,index){return `<div><label>Manufacturer</label><select onchange="salesPaneSetManufacturer(${index},this.value)">${salesManufacturers().map(x=>salesOption(x,x,p.manufacturer,true)).join('')}</select></div>`;}
function salesThicknessField(p,index){return `<div><label>Thickness</label><select onchange="salesPaneSetThickness(${index},this.value)">${salesThicknessesFor(p).map(x=>salesOption(String(x),x+' mm',String(p.thicknessMm),true)).join('')}</select></div>`;}
function salesHeatField(p,index){return `<div><label>Heat Treatment</label><select onchange="salesPaneSetHeat(${index},this.value)">${salesSimpleOptions('heatTreatment',p.heatTreatmentId)}</select></div>`;}
/* Surface buttons need literal calls; keeping this helper separate avoids
   generating unsafe/eval-style handlers. */
function salesFritSurfaceSelector(p,index){const nums=salesPaneSurfaces(index);return `<div class="mu-surface"><label>Frit Surface</label><div class="mu-surface-buttons">${nums.map(n=>`<button type="button" class="${+p.frit.surface===n?'on':''}" onclick="salesPaneSetFrit(${index},'surface',${n})">#${n}</button>`).join('')}</div></div>`;}
/* Спецификация силкскрина: узор, цвет, диаметр точки, опорный угол и отступы
   от него, строка маркировки для цеха. Поля перенесены с рабочего листа
   спецификации (хендофф, раздел 9л), а не придуманы. Coverage % убрано — в
   реальной спецификации такого поля нет. */
function salesFritFields(p,index){
 return `<div class="mu-subgrid"><div><label>Frit Product</label><select onchange="salesPaneSetFrit(${index},'productId',this.value)">${salesSimpleOptions('fritProduct',p.frit.productId)}</select></div><div><label>Colour</label><select onchange="salesPaneSetFrit(${index},'color',this.value)">${FRIT_COLORS.map(x=>salesOption(x,x,p.frit.color,true)).join('')}</select></div><div><label>Pattern</label><select onchange="salesPaneSetFrit(${index},'pattern',this.value)">${FRIT_PATTERNS.map(x=>salesOption(x,x,p.frit.pattern,true)).join('')}</select></div><div><label>Dot diameter, mm</label><input value="${esc(p.frit.dotMm)}" onchange="salesFritDotChange(${index},this)"></div><div><label>Margin measured from</label><select onchange="salesPaneSetFrit(${index},'marginFrom',this.value)">${FRIT_MARGIN_CORNERS.map(x=>salesOption(x,x,p.frit.marginFrom,true)).join('')}</select></div><div><label>Margin — width</label><input value="${esc(salesMarginFrom16(p.frit.marginW16))}" placeholder="1" onchange="salesFritMarginChange(${index},'marginW16',this)"></div><div><label>Margin — height</label><input value="${esc(salesMarginFrom16(p.frit.marginH16))}" placeholder="1" onchange="salesFritMarginChange(${index},'marginH16',this)"></div><div><label>Production marking</label><input value="${esc(p.frit.marking)}" oninput="salesCurrentMakeup().panes[${index}].frit.marking=this.value"></div>${salesFritSurfaceSelector(p,index)}</div>`;
}
/* Кнопка вне `allowed_surfaces` каталога помечается, но остаётся нажимаемой:
   каталог отвечает, где покрытие живёт штатно, а не запрещает работу. */
function salesCoatingSurfaceSelector(p,index){
 const nums=salesPaneSurfaces(index),ok=salesAllowedCoatingSurfaces(p,index);
 /* Подпись одна на оба типа покрытия: разная длина подписи двигала колонку,
    и в Triple соседние лайты стояли с разной шириной поля. */
 const label='On Surface';
 const hint=ok.length&&ok.length<nums.length?`<div class="mu-surface-hint">default #${ok[0]}</div>`:'';
 return `<div class="mu-surface"><label>${label}</label><div class="mu-surface-buttons">${nums.map(n=>`<button type="button" class="${+p.coatingSurface===n?'on':''} ${ok.indexOf(n)<0?'off-catalog':''}" onclick="salesPaneSetCoatingSurface(${index},${n})">#${n}</button>`).join('')}</div>${hint}</div>`;
}
/* Цепочка выбора повторяет ту, которой пользуется сам поставщик:
   производитель → толщина → тип → ПОКРЫТИЕ → на каком стекле оно лежит.
   Пока шага «покрытие» не было, Vitro 6 мм Low-E выкатывал 92 строки одним
   списком, и Solarban 60 на двенадцати подложках приходилось искать глазами.
   У непокрытого стекла и фрита промежуточного шага нет — там выбирают само
   стекло, и второй список был бы пустой формальностью. */
function salesVisionFieldsSafe(p,index){
 const isFrit=p.visionType==='frit',coated=p.visionType==='lowe'||p.visionType==='reflective';
 const coatings=coated?salesGlassCoatings(p):[];
 const coating=coated?(salesCurrentCoating(p)||coatings[0]||''):'';
 const rows=coated?salesGlassVariants(p,coating):salesGlassCandidates(p);
 const glassSelect=`<select onchange="salesPaneSetProduct(${index},this.value)">${
  coated?salesGlassVariantOptions(rows,p.glassProductId):salesGlassProductOptions(rows,p.glassProductId)}</select>`;
 return `<div class="mu-field-grid mu-field-grid-4">${salesManufacturerField(p,index)}${salesThicknessField(p,index)}<div class="mu-type-field"><label>TYPE</label><div class="mu-type-buttons">${[['lowe','Low-E'],['reflective','Reflective'],['frit','Frit'],['uncoated','Uncoated']].map(x=>`<button type="button" class="${p.visionType===x[0]?'on':''}" onclick="salesPaneSetVisionType(${index},'${x[0]}')">${x[1]}</button>`).join('')}</div></div>${salesHeatField(p,index)}</div>
  <div class="mu-coating-grid">
   ${coated
    ?`<div><label>Select Coating</label><select onchange="salesPaneSetCoating(${index},this.value)">${coatings.map(c=>salesOption(c,c,coating,true)).join('')}</select><div class="mu-glass-meta"><span class="mut" data-raw>${esc(coatings.length)} coatings · ${esc(rows.length)} variants</span></div></div>`
    /* ПУСТАЯ ячейка, а не пропущенная: в Double и Triple лайты стоят один под
       другим, и поле, съехавшее на колонку влево у непокрытого стекла,
       заставляло глаз прыгать по всей сетке. Колонки держим на месте. */
    :'<div class="mu-cell-empty"></div>'}
   <div><label>${coated?'On Glass':(isFrit?'Base Glass':'Glass')}</label>${glassSelect}${salesGlassMetaFor(p.glassProductId)}</div>
   ${coated?salesCoatingSurfaceSelector(p,index):'<div class="mu-cell-empty"></div>'}
  </div>
  ${isFrit?salesFritFields(p,index):''}`;
}
function salesSpandrelFields(p,index){const rows=salesBaseGlassCandidates(p);return `<div class="mu-field-grid mu-field-grid-4">${salesManufacturerField(p,index)}${salesThicknessField(p,index)}<div><label>Base Glass</label><select onchange="salesPaneSetProduct(${index},this.value)">${salesGlassProductOptions(rows,p.glassProductId)}</select>${salesGlassMetaFor(p.glassProductId)}</div>${salesHeatField(p,index)}</div><div class="mu-subgrid"><div><label>Spandrel Product</label><select onchange="salesPaneSetSpandrel(${index},'productId',this.value)">${salesSimpleOptions('spandrelProduct',p.spandrel.productId)}</select></div><div><label>Color</label><select onchange="salesPaneSetSpandrel(${index},'color',this.value)">${SPANDREL_COLORS.map(x=>salesOption(x,x,p.spandrel.color,true)).join('')}</select></div>${(()=>{const nums=salesPaneSurfaces(index);return `<div class="mu-surface"><label>Spandrel Surface</label><div class="mu-surface-buttons">${nums.map(n=>`<button type="button" class="${+p.spandrel.surface===n?'on':''}" onclick="salesPaneSetSpandrel(${index},'surface',${n})">#${n}</button>`).join('')}</div></div>`;})()}</div>`;}
function salesLaminatedFields(p,index){const all=activeGlassProducts();return `<div class="mu-lam-grid"><div><label>Outer Ply</label><select onchange="salesPaneSetLam(${index},'outerGlassProductId',this.value)">${salesGlassProductOptions(all,p.laminated.outerGlassProductId)}</select>${salesGlassMetaFor(p.laminated.outerGlassProductId)}</div><div><label>Interlayer</label><select onchange="salesPaneSetLam(${index},'interlayerProductId',this.value)">${salesSimpleOptions('interlayerProduct',p.laminated.interlayerProductId)}</select></div><div><label>Inner Ply</label><select onchange="salesPaneSetLam(${index},'innerGlassProductId',this.value)">${salesGlassProductOptions(all,p.laminated.innerGlassProductId)}</select>${salesGlassMetaFor(p.laminated.innerGlassProductId)}</div></div>`;}
function salesLiteSection(p,index,total){const side=index===0?'OUTSIDE':index===total-1?'INSIDE':'MIDDLE',surfaces=salesPaneSurfaces(index),key='lite-'+index,isOpen=soOpenSectionKey===key;return `<details class="mu-section mu-lite" data-mu-section="${key}" ${isOpen?'open':''} ontoggle="salesAccordionToggle(this,'${key}')"><summary><span class="mu-chevron">›</span><b>LITE ${index+1} · ${side}</b><span class="mu-surface-tags">#${surfaces[0]} &nbsp; #${surfaces[1]}</span><span class="mu-summary">${esc(salesPaneProductSummary(p,index))}</span></summary><div class="mu-section-body"><div class="mu-lite-top">${salesLiteCategoryTabs(p,index)}</div>${p.category==='vision'?salesVisionFieldsSafe(p,index):p.category==='spandrel'?salesSpandrelFields(p,index):salesLaminatedFields(p,index)}</div></details>`;}
function salesCavitySection(c,index){const key='cavity-'+index,isOpen=soOpenSectionKey===key;return `<details class="mu-section mu-cavity" data-mu-section="${key}" ${isOpen?'open':''} ontoggle="salesAccordionToggle(this,'${key}')"><summary><span class="mu-chevron">›</span><b>CAVITY ${index+1}</b><span class="mu-summary">${esc(salesCavitySummary(c))}</span></summary><div class="mu-section-body"><div class="mu-cavity-grid"><div><label>Spacer</label><select onchange="salesCavitySet(${index},'spacerVariantId',this.value)">${(DB.spacerVariant||[]).filter(x=>x.active!==false&&x.availability!=='inactive').map(x=>salesOption(x.id,x.name,c.spacerVariantId,true)).join('')}</select></div><div><label>Gas</label><select onchange="salesCavitySet(${index},'gasProductId',this.value)">${salesSimpleOptions('gasProduct',c.gasProductId)}</select></div><div><label>Primary Seal</label><select onchange="salesCavitySet(${index},'primarySealantId',this.value)">${salesSimpleOptions('sealantProduct',c.primarySealantId)}</select></div><div><label>Secondary Seal</label><select onchange="salesCavitySet(${index},'secondarySealantId',this.value)">${salesSimpleOptions('sealantProduct',c.secondarySealantId)}</select></div></div></div></details>`;}
function salesMakeupBuilder(){const m=salesCurrentMakeup();if(!m)return '<div class="empty">No Makeup</div>';let sections='';m.panes.forEach((p,i)=>{sections+=salesLiteSection(p,i,m.panes.length);if(i<m.cavities.length)sections+=salesCavitySection(m.cavities[i],i);});const used=soDraft.lines.filter(l=>l.makeupId===m.id).length;return `<div class="mu-builder"><div class="mu-builder-head"><div><b>MAKEUP ${esc(m.code)}</b><span>${esc(salesMakeupSummary(m))}</span></div><div class="mu-builder-actions"><span class="pill">${used} lines</span><button class="sm" onclick="salesDuplicateMakeup('${esc(m.id)}')">Duplicate</button><button class="sm dl" onclick="salesDeleteMakeup('${esc(m.id)}')">Delete</button></div></div>${salesUnitTypeControl(m)}<div class="mu-stack">${sections}</div></div>`;}

/* ==== src/erp/views/sales.js ==== */
/* =====================================================================
   view/sales · sales-0.3b-makeup
   Draft Sales Orders with order-scoped IGU Makeups.
   Shape and Muntin remain external engineering configurators.
   ===================================================================== */

function viewSales(){
 subtab='orders';
 return `<div class="page-head sales-page-head"><div><h2>Продажи</h2><p>Sales Order → order-scoped Makeup → line-specific Shape / Muntin. Без глобальной библиотеки конфигураций.</p></div><span class="pill info">Stage 3B · Draft</span></div>${salesOrdersPane()}`;
}
function salesOrdersPane(){return soEdit!==null?salesOrderEditor():salesOrderList();}
function salesOrderList(){
 const q=salesString(soSearch).toLowerCase(),rows=DB.salesOrder.filter(o=>!q||[o.businessNumber,salesCustomerDisplay(o.customerId),o.customerPo,o.priority,o.dueDate].join(' ').toLowerCase().includes(q));
 return `<div class="card sales-list-card"><div class="sales-toolbar"><div class="sales-search"><input id="salesOrderSearch" value="${esc(soSearch)}" placeholder="Поиск по заказу, клиенту, PO…" oninput="salesOrderSearchChange(this)"></div><button class="pri" onclick="salesOrderNew()">+ Новый Sales Order</button></div><div class="sales-table-wrap"><table><thead><tr><th>Sales Order</th><th>Customer</th><th>PO</th><th>Due</th><th>Priority</th><th>Makeups</th><th>Lines</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(o=>`<tr><td><b class="mono">${raw(o.businessNumber||'Auto Number')}</b><div class="mut">${raw(o.id)}</div></td><td><b>${raw(salesCustomerDisplay(o.customerId)||'—')}</b></td><td>${raw(o.customerPo||'—')}</td><td>${esc(o.dueDate||'—')}</td><td>${salesPriorityLabel(o.priority)}</td><td>${o.makeups.length}</td><td>${o.lines.length}</td><td><span class="pill warn">Draft</span></td><td class="sales-row-actions"><button class="sm" onclick="salesOrderEdit('${esc(o.id)}')">Открыть</button><button class="sm dl" onclick="salesOrderDelete('${esc(o.id)}')">×</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Sales Orders пока нет</td></tr>'}</tbody></table></div></div>`;
}
function salesCustomerOptions(){const rows=(DB.customer||[]).filter(c=>c.status!=='archived');return `<option value="">— выбери Customer —</option>`+rows.map(c=>`<option data-raw value="${esc(c.id)}" ${soDraft.customerId===c.id?'selected':''}>${esc(c.code||'')} · ${esc(c.displayName||c.legalName)}</option>`).join('');}
function salesOrderEditor(){
 const o=soDraft,c=salesFindCustomer(o.customerId),title=o.businessNumber?'Sales Order '+o.businessNumber:'New Sales Order · Auto Number',customerFlags=c?`${c.onHold?'<span class="pill bad">On Hold</span>':''}${c.poRequired?'<span class="pill warn">PO Required</span>':''}${c.isProspect?'<span class="pill info">Prospect</span>':''}`:'';
 return `<div class="sales-order-editor"><div class="sales-editor-top"><div><div class="sales-order-title"><h3>${esc(title)}</h3><span class="pill warn">Draft</span>${customerFlags}</div><div class="mut mono">${esc(o.id)}</div></div><div class="sales-editor-actions"><button class="pri" onclick="salesOrderSave()">Save Draft</button><button onclick="salesOrderClose()">Close</button></div></div>
 <div class="sales-header-compact"><div><label>Customer *</label><select onchange="salesApplyCustomerDefaults(this.value);render()">${salesCustomerOptions()}</select></div><div><label>Customer PO</label><input value="${esc(o.customerPo)}" oninput="soDraft.customerPo=this.value"></div><div><label>Due Date</label><input type="date" value="${esc(o.dueDate)}" onchange="soDraft.dueDate=this.value"></div><div><label>Priority</label><select onchange="soDraft.priority=this.value"><option value="normal" ${o.priority==='normal'?'selected':''}>Normal</option><option value="rush" ${o.priority==='rush'?'selected':''}>Rush</option><option value="critical" ${o.priority==='critical'?'selected':''}>Critical</option></select></div><div><label>Delivery</label><select onchange="soDraft.delivery=this.value"><option value="pickup" ${o.delivery==='pickup'?'selected':''}>Pickup</option><option value="delivery" ${o.delivery==='delivery'?'selected':''}>Delivery</option></select></div><div><label>Terms</label><input value="${esc(o.paymentTerms)}" oninput="soDraft.paymentTerms=this.value"></div><div><label>Currency</label><select onchange="soDraft.currency=this.value"><option ${o.currency==='CAD'?'selected':''}>CAD</option><option ${o.currency==='USD'?'selected':''}>USD</option></select></div><div><label>Branch</label><input value="${esc(o.branch)}" oninput="soDraft.branch=this.value"></div></div>
 ${c&&c.onHold?'<div class="sales-hold">Customer is On Hold. Draft can be saved; Release must remain blocked.</div>':''}
 <section class="sales-block"><div class="sales-block-head"><div><b>GLASS / IGU MAKEUPS</b><span>Makeups exist only inside this Sales Order</span></div></div>${salesMakeupTabs()}${salesMakeupBuilder()}</section>
 ${salesOrderLines()}
 <div class="sales-notes"><label>Order Notes</label><textarea rows="2" oninput="soDraft.notes=this.value">${esc(o.notes)}</textarea></div><div class="err" id="e_sales_order"></div>${salesExcelModal()}</div>`;
}
function salesLineShapeCell(l,i){
 const s=salesShapeByRef(l.shapeRef);if(!s)return `<button class="line-link-btn" onclick="salesOrderConfigureShape(${i})">+ Shape</button>`;
 const currentRev=s.revision||0,stale=l.shapeRef.revision!=null&&currentRev!==l.shapeRef.revision;return `<div class="line-config-cell"><button class="line-link-btn ${stale?'stale':'linked'}" onclick="salesOrderConfigureShape(${i})">${esc(s.name)}${stale?' · stale':''}</button><button class="line-x" title="Unlink" onclick="salesUnlinkShape(${i})">×</button></div>`;
}
function salesLineMuntinCell(l,i){
 const m=salesMuntinByRef(l.muntinRef);if(!m)return `<button class="line-link-btn" ${l.shapeRef&&l.shapeRef.id?'':'disabled'} onclick="salesOrderConfigureMuntin(${i})">+ Muntin</button>`;
 const stale=!!(l.shapeRef&&l.shapeRef.id&&(m.shapeId!==l.shapeRef.id||(l.shapeRef.revision!=null&&m.shapeRevision!=null&&m.shapeRevision!==l.shapeRef.revision)));return `<div class="line-config-cell"><button class="line-link-btn ${stale?'stale':'linked'}" onclick="salesOrderConfigureMuntin(${i})">${esc(m.name)}${stale?' · stale':''}</button><button class="line-x" title="Unlink" onclick="salesUnlinkMuntin(${i})">×</button></div>`;
}
function salesOrderLines(){
 const allSelected=soDraft.lines.length>0&&soDraft.lines.every(l=>soSelectedLines.has(l.id)),bulk=soSelectedLines.size>0;
 return `<section class="sales-block sales-lines-block"><div class="sales-lines-head"><div><b>ORDER LINES</b><span>MU → Qty → Dimensions → Mark → engineering configurators</span></div><div class="sales-line-tools"><button onclick="salesExcelOpen()">Paste Excel</button><button onclick="salesOrderAddTen()">+10</button><button class="pri" onclick="salesOrderAddLine(null,true)">+ Line</button></div></div>${bulk?`<div class="sales-bulk"><b id="salesBulkCount">${soSelectedLines.size} selected</b><span>Assign Makeup</span><select onchange="salesAssignSelected(this.value)"><option value="">—</option>${soDraft.makeups.map(m=>`<option value="${esc(m.id)}">${esc(m.code)} · ${esc(salesMakeupSummary(m))}</option>`).join('')}</select><button class="sm" onclick="soSelectedLines=new Set();render()">Clear</button></div>`:''}
 <div class="sales-table-wrap"><table class="sales-lines-table"><thead><tr><th class="line-check"><input type="checkbox" ${allSelected?'checked':''} onchange="salesToggleAllLines(this.checked)"></th><th>#</th><th>MU</th><th>Qty</th><th>Width</th><th>Height</th><th>Mark</th><th>Shape</th><th>Muntin</th><th>Notes</th><th></th></tr></thead><tbody>${soDraft.lines.map((l,i)=>{const linked=!!(l.shapeRef&&l.shapeRef.id);return `<tr><td class="line-check"><input type="checkbox" ${soSelectedLines.has(l.id)?'checked':''} onchange="salesToggleLine('${esc(l.id)}',this.checked)"></td><td class="mono line-num">${i+1}</td><td><select class="line-mu" onchange="soDraft.lines[${i}].makeupId=this.value">${soDraft.makeups.map(m=>`<option value="${esc(m.id)}" ${l.makeupId===m.id?'selected':''}>${esc(m.code)}</option>`).join('')}</select></td><td><input class="line-qty" type="number" min="1" step="1" value="${esc(l.qty)}" oninput="soDraft.lines[${i}].qty=salesPositiveInt(this.value,1)"></td><td><input data-so-width class="line-dim" ${linked?'disabled title="Dimensions come from Shape"':''} value="${esc(salesDimFrom16(l.width16))}" placeholder="34 13/16" onchange="salesLineDimChange(${i},'width',this)"></td><td><input class="line-dim" ${linked?'disabled title="Dimensions come from Shape"':''} value="${esc(salesDimFrom16(l.height16))}" placeholder="15 5/16" onchange="salesLineDimChange(${i},'height',this)"></td><td><input class="line-mark" value="${esc(l.mark)}" oninput="soDraft.lines[${i}].mark=this.value" onkeydown="salesLineMarkKey(${i},event)"></td><td>${salesLineShapeCell(l,i)}</td><td>${salesLineMuntinCell(l,i)}</td><td><input class="line-notes" value="${esc(l.notes)}" oninput="soDraft.lines[${i}].notes=this.value"></td><td><button class="sm dl line-delete" onclick="salesOrderRemoveLine(${i})">×</button></td></tr>`;}).join('')||'<tr><td colspan="11" class="empty">No lines yet. Add a line or paste from Excel.</td></tr>'}</tbody></table></div></section>`;
}

let sEdit=null,sDraft=null,sView='setup',sEdgeworkOpen=false,sFeaturesOpen=false;

function viewShapeSkill(){

    ${sEdit!==null?shapeForm():''}
    <table><thead><tr><th>Название / тип</th><th>Габарит</th><th>Кромок</th><th>Features</th><th>Статус</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">пусто</td></tr>'}</tbody></table>

function openShapeNew(type){sEdit='new';sView='setup';sEdgeworkOpen=false;sFeaturesOpen=false;sDraft=newShapeDef(type||'smart');sDraft.name=shapePresetInfo(sDraft.type).label;render();}
function openShapeEdit(i){sEdit=i;sView='setup';sEdgeworkOpen=false;sFeaturesOpen=false;sDraft=normalizeShapeDef(JSON.parse(JSON.stringify(DB.shapeDef[i])));render();}
function shapeFileSizeText(bytes){
  var n=Math.max(0,+bytes||0);if(n<1024)return Math.round(n)+' B';if(n<1024*1024)return (n/1024).toFixed(n<10240?1:0)+' KB';return (n/(1024*1024)).toFixed(1)+' MB';
}
function shapeAttachDxf(input){
  var file=input&&input.files&&input.files[0];if(!file)return;
  if(!/\.dxf$/i.test(String(file.name||''))){alert('Choose a DXF file.');input.value='';return;}
  if(!(file.size>0)){alert('DXF file is empty.');input.value='';return;}
  var reader=new FileReader();
  reader.onerror=function(){input.value='';alert('DXF file could not be read.');};
  reader.onload=function(){
    var parsed=shapeParseFusionDxf(String(reader.result||''));
    if(!parsed.ok){input.value='';alert(parsed.error||'DXF file could not be parsed.');return;}
    var note=sDraft&&sDraft.source?String(sDraft.source.note||''):'';
    sDraft.source={kind:'dxf',fileName:String(file.name),fileSize:Math.floor(file.size),uploadedAt:new Date().toISOString(),note:note,preview:parsed.preview};
    sDraft.w=frac64(parsed.preview.width16/16);sDraft.h=frac64(parsed.preview.height16/16);sView='setup';render();
  };
  reader.readAsText(file);
}
function removeShapeDxf(){sDraft.source=shapeNormalizeSource(null);sView='setup';render();}

}
function shapeDraftLine(){return shapeDefToLine(sDraft);}

function setShapeField(k,v){sDraft[k]=v;if(sDraft.type==='circle'&&(k==='w'||k==='h')){sDraft.w=v;sDraft.h=v;}refreshShapeEditor();}
function setShapeParam(k,v){sDraft.params[k]=v;refreshShapeEditor();}

function setShapeView(v){if(shapeIsDxfSource(sDraft))return;sView=v;refreshShapeEditor();}

function setShapeType(type){

  var linked=Object.keys(sDraft.edgeOps||{}).length||(sDraft.features||[]).some(function(f){return f.type==='radius'||f.type==='hardware';});
  if(linked&&!confirm('Changing the shape type will remove topology-bound radii, hardware prep and edgework. Continue?')){render();return;}
  sDraft.type=type;sDraft.params=shapeDefaultParams(type);sDraft.edgeOps={};sDraft.features=(sDraft.features||[]).filter(function(f){return f.type!=='radius'&&f.type!=='hardware';});

function shapeDxfPreviewSvg(source){

    <path d='${path}' fill='rgba(46,144,250,.04)' stroke='#667085' stroke-width='1.5'/>
    <line x1='${x0}' y1='${topY}' x2='${x0+dw}' y2='${topY}' class='shape-dxf-dim-line' marker-start='url(#shapeDxfArrow)' marker-end='url(#shapeDxfArrow)'/>
    <line x1='${x0}' y1='${topY-8}' x2='${x0}' y2='${y0}' class='shape-dxf-guide'/><line x1='${x0+dw}' y1='${topY-8}' x2='${x0+dw}' y2='${y0}' class='shape-dxf-guide'/>
    <text x='${x0+dw/2}' y='${topY-9}' class='shape-dxf-dim-text' text-anchor='middle'>Width ${esc(widthLabel)}</text>
    <line x1='${leftX}' y1='${y0}' x2='${leftX}' y2='${y0+dh}' class='shape-dxf-dim-line' marker-start='url(#shapeDxfArrow)' marker-end='url(#shapeDxfArrow)'/>
    <line x1='${leftX-8}' y1='${y0}' x2='${x0}' y2='${y0}' class='shape-dxf-guide'/><line x1='${leftX-8}' y1='${y0+dh}' x2='${x0}' y2='${y0+dh}' class='shape-dxf-guide'/>
    <text x='${leftX-10}' y='${y0+dh/2}' class='shape-dxf-dim-text' text-anchor='middle' transform='rotate(-90 ${leftX-10} ${y0+dh/2})'>Height ${esc(heightLabel)}</text>
  </svg>`;
}
function shapePreviewMarkup(r){
  if(r&&r.externalFile){
    var source=(r.definition&&r.definition.source)||shapeNormalizeSource(null),svg=r.sourceValid?shapeDxfPreviewSvg(source):'';
    return `<div class='shape-dxf-preview visual'><div class='shape-dxf-preview-title'><b>DXF-файл является источником раскроя</b><span>Контур считан из Fusion 360 в дюймах. Красные размеры показывают максимальные габариты от края до края.</span></div>${svg||'<div class="module-invalid">Превью DXF недоступно</div>'}${source.fileName?`<div class='shape-dxf-preview-file'>${raw(source.fileName)}<small data-raw>${esc(shapeFileSizeText(source.fileSize))}</small></div>`:''}</div>`;

function shapeDerivedHTML(r){

    return `<div class='smart-kpis'><div><span>Width</span><b>${dimIn(r.width)}</b></div><div><span>Height</span><b>${dimIn(r.height)}</b></div><div><span>Продажная площадь</span><b>${(r.billableArea/144).toFixed(2)} ft²</b></div><div><span>Grid</span><b>1/16″</b></div></div>
      <div class='validation-box okbox'><b>DXF проверен и принят</b><div>Габариты округлены до ближайшей 1/16″. Продажная площадь считается по габаритному прямоугольнику Width × Height. Исходное содержимое DXF в localStorage не сохраняется.</div></div>`;

    <div class='shape-requirements'><b>Производственные требования</b>${req.length?req.map(function(q){return `<span><i>${esc(q.stationClass)}</i> ${esc(q.operation)}${q.edgeIds?' · '+esc(q.edgeIds.join(', ')):''}</span>`;}).join(''):'<span>Дополнительных операций нет</span>'}</div>
    ${warns.length?`<div class='validation-box warnbox'>${warns.map(function(w){return esc(moduleErrorText({reason:w}));}).join('<br>')}</div>`:`<div class='validation-box okbox'>Контур валиден · Production Drawing и Cutting Geometry синхронизированы · ${esc(r.fingerprint)}</div>`}`;

function refreshShapeEditor(){
  if(!sDraft)return;var r=shapeDraftResult(),p=document.getElementById('shapeLivePreview'),d=document.getElementById('shapeLiveDerived');
  if(p)p.innerHTML=shapePreviewMarkup(r);if(d)d.innerHTML=shapeDerivedHTML(r);

/* ---------- Матрица Edge ----------
   Одна таблица на все стороны: колонка = ребро, строка = параметр. Так видно
   всю фигуру разом, а не четыре отдельные карточки. Цвет буквы совпадает
   с цветом ребра на чертеже — опознание идёт по цвету, а не по подписи. */
function shapeEdgeIsVert(e){return e==='A'||e==='C';}
/* Превью формы выноса: прямое ребро, простой уклон или локоть. */
function shapeOutageIcon(edge){
  var m=sDraft.smart,s=m[edge]||{},vert=shapeEdgeIsVert(edge),W=44,H=30,pad=5,col=shapeEdgeColor(edge),d;
  function seg(x1,y1,x2,y2){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="1.8" stroke-linecap="round"/>';}
  if(edge==='D'){d=seg(pad,H/2,W-pad,H/2);return `<svg viewBox='0 0 ${W} ${H}' class='outage-icon'>${d}</svg>`;}
  var o=ssNN(s.out),lean=o>0?7:0;
  if(m.elbowsOn){
    var E=s.elbow||{},M=ssMode(E.mode)||{s1:0,s2:0},h=ssNN(E.elbowLen),to=ssNN(E.to),past=ssNN(E.past);
    var a=to>0?M.s1*6:0,b=a+(past>0?M.s2*6:0),mid=h>0?0.45:1;
    if(vert)d=seg(W/2+a,pad,W/2+(h>0?a:b),pad+(H-2*pad)*mid)+(h>0?seg(W/2+a,pad+(H-2*pad)*mid,W/2+b,H-pad):'');
    else d=seg(pad,H/2-a,pad+(W-2*pad)*mid,H/2-(h>0?a:b))+(h>0?seg(pad+(W-2*pad)*mid,H/2-a,W-pad,H/2-b):'');
  }else{
    var sgn=vert?(s.dir==='right'?1:s.dir==='left'?-1:0):(s.dir==='up'?-1:s.dir==='down'?1:0);
    if(vert)d=seg(W/2,pad,W/2+sgn*lean,H-pad);
    else d=seg(pad,H/2,W-pad,H/2+sgn*lean);
  }
  return `<svg viewBox='0 0 ${W} ${H}' class='outage-icon'>${d}</svg>`;
}
function shapeEdgeMatrix(){
  var m=sDraft.smart,cols=['A','B','C','D'],r=shapeDraftResult(),base=(r.valid&&r.base)||null;
  var head=cols.map(function(e){return `<span class='em-col' style='color:${shapeEdgeColor(e)}'>${e}</span>`;}).join('');
  function cell(e,html){return `<span class='em-cell'>${html}</span>`;}
  function lengthCell(e){
    if(e==='A')return cell(e,`<input data-vfield='len' value='${esc(sDraft.h)}' oninput='setShapeField("h",this.value)'>`);
    if(e==='B')return cell(e,`<input data-vfield='len' value='${esc(sDraft.w)}' oninput='setShapeField("w",this.value)'>`);

  var prior=sEdit==='new'?null:DB.shapeDef[sEdit],used=prior&&DB.muntinDef.some(function(m){return m.shapeId===prior.id;});
  if(used&&shapeFingerprint(prior)!==r.fingerprint&&!confirm('This shape is used by a Muntin layout. New geometry will change that layout. Save a new revision?'))return;
  var saved=r.definition||normalizeShapeDef(sDraft);saved.name=sDraft.name;saved.revision=prior?(prior.revision||0)+1:1;saved.status='draft';

function shapeSafeFileName(s){return String(s||'shape').trim().replace(/[^A-Za-z0-9._-]+/g,'_').replace(/^_+|_+$/g,'')||'shape';}
function shapeDownload(textValue,mime,name){var b=new Blob([textValue],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);}
function downloadShapeArtifact(kind){
  var r=shapeDraftResult();if(r.externalFile)return alert('ERP-generated artifacts are unavailable for an external DXF source.');if(!r.valid)return alert(moduleErrorText(r));var base=shapeSafeFileName(r.definition.name)+'_R'+(r.definition.revision||0);

  if(kind==='cutting')shapeDownload(ShapeModule.cuttingSvg(r),'image/svg+xml',base+'_cutting.svg');
  if(kind==='json')shapeDownload(JSON.stringify(ShapeModule.machinePayload(r),null,2),'application/json',base+'_machine.json');

/* ==== src/erp/views/production.js ==== */
/* =====================================================================
   view/production  ·  shopfloor-1.0
   Четыре справочника цеха и маршрут по станциям.
   IN : DB.station · DB.operation · DB.workPosition · DB.terminal
   OUT: html
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.

   Экран разложен по тем же четырём сущностям, что и модель: станция, рабочее
   место, операция, терминал. Это не оформление — прежний экран показывал
   станки и «уровни потока» как одно и то же, и пока они выглядят одним, их
   и заводят как одно. Ровно так у Spil в 33 подстанциях оказались вперемешку
   люди, станки, операции и смены.
   ===================================================================== */

const SF_TABS=[
 {k:'stations',  label:'Станции'},
 {k:'positions', label:'Рабочие места'},
 {k:'operations',label:'Операции'},
 {k:'terminals', label:'Терминалы'}
];
const SF_STAGE_LABEL={pre_temper:'до печи',heat:'печь',post_temper:'после печи',any:'не ограничено'};
const SF_UNIT_LABEL={in:'дюйм',ft2:'ft²',pcs:'шт',lb:'фунт'};

function viewProduction(){
 if(!SF_TABS.some(t=>t.k===subtab)) subtab='stations';
 const noSize=workPositionsAwaitingSize().length;
 const pipeline=DB.station.map((s,i)=>{
  const wp=stationWorkPositions(s.code);
  return `${i?`<div class="pipe-arrow">${ico('arrow')}</div>`:''}<div class="stage"><div class="stage-top"><div class="stage-index">${s.seq}</div><div><b>${sfLabel(s)}</b><small>${s.always?'всегда':'по необходимости'}</small></div></div><div class="stage-machines">${wp.length?wp.map(w=>`<span class="pill" data-raw>${esc(w.code)}</span>`).join(' '):'<span class="mut">рабочих мест нет</span>'}</div></div>`;
 }).join('');
 const empty=DB.station.filter(s=>!stationWorkPositions(s.code).length);
 return `${referenceReseeded?'<div class="note" style="margin-bottom:14px">Справочники обновлены: станция стала шагом маршрута, станки переехали в рабочие места, появились операции и терминалы.</div>':''}<div class="page-head"><div><h2>Цех</h2><p>Станция — это шаг маршрута, а не экран и не станок. Где делают — рабочее место, что именно делают — операция, чем сканируют — терминал. Четыре разные вещи, которые в Spil лежали одной таблицей.</p></div><span class="pill ${noSize?'warn':'ok'}">${ico('factory','icon-inline')}${noSize} мест без габарита</span></div>
  <div class="card">
   <div class="section-title"><h3>Маршрут по станциям</h3><span class="pill ${empty.length?'warn':'ok'}">${empty.length?empty.length+' станций без мест':'везде есть места'}</span></div>
   <div class="pipeline">${pipeline}</div>
   ${empty.length?`<div class="note" style="margin-top:10px">Без рабочих мест: ${empty.map(s=>`<b>${raw(s.code)}</b>`).join(', ')}<span>. Силкскрин переносится на этапе 5б, отгрузка ещё не спроектирована — рабочих мест там пока нет, и это не пробел в данных.</span></div>`:''}
  </div>
  <div class="card">
   <div class="tabs">${SF_TABS.map(t=>`<button class="${subtab===t.k?'on':''}" onclick="subtab='${t.k}';render()">${t.label}</button>`).join('')}</div>
   ${({stations:viewSfStations,positions:viewSfPositions,operations:viewSfOperations,terminals:viewSfTerminals})[subtab]()}
  </div>
  ${subtab==='stations'||subtab==='positions'?sfImportCard():''}`;
}

/* --- 1. Станции ------------------------------------------------------ */
let stEdit=null;
function viewSfStations(){
 const rows=DB.station.map((s,i)=>{
  const wp=stationWorkPositions(s.code),ops=stationOperations(s.code);
  return `<tr><td class="mono"><b>${s.seq}</b></td><td class="mono"><b>${raw(s.code)}</b></td><td>${sfLabel(s)}</td>
   <td><span class="pill ${s.always?'ok':'info'}">${s.always?'всегда':'по необходимости'}</span></td>
   <td>${ops.length?ops.map(o=>`<span class="pill info" data-raw>${esc(o.code)}</span>`).join(' '):'<span class="mut">—</span>'}</td>
   <td>${wp.length?wp.map(w=>`<span class="pill" data-raw>${esc(w.code)}</span>`).join(' '):'<span class="mut">нет</span>'}</td>
   <td class="mut" style="max-width:260px">${raw(s.note||'')}</td>
   <td style="white-space:nowrap"><button class="sm" onclick="stEdit=${i};render()">Изменить</button>
   <button class="sm dl" onclick="delSfStation(${i})">×</button></td></tr>`;
 }).join('');
 return `${stEdit!==null?sfStationForm():''}
  <div class="sub">Одиннадцать шагов маршрута. Порядок и признак «всегда / по необходимости» пользователь подтвердил; имена даны по ТИПУ работы, а конкретная услуга печатается на стикере.</div>
  <table><thead><tr><th>№</th><th>Код</th><th>Название</th><th>В маршруте</th><th>Операции</th><th>Рабочие места</th><th>Примечание</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="8" class="empty">пусто</td></tr>'}</tbody></table>
  ${stEdit!==null?'':'<div class="row"><button class="pri" onclick="stEdit=\'new\';render()">Добавить станцию</button></div>'}`;
}
function sfStationForm(){
 const r = stEdit==='new' ? {seq:(Math.max(0,...DB.station.map(s=>s.seq))+1),code:'',name:'',nameEn:'',always:false,note:''} : DB.station[stEdit];
 return `<div class="form"><h3>${stEdit==='new'?'Новая станция':'Изменение'}</h3>
  <div class="grid">
   <div><label>Порядок *</label><input id="sf_seq" type="number" min="1" step="1" value="${r.seq}"></div>
   <div><label>Код *</label><input id="sf_code" value="${esc(r.code)}"></div>
   <div><label>Название (RU) *</label><input id="sf_name" value="${esc(r.name)}"></div>
   <div><label>Название (EN)</label><input id="sf_nameEn" value="${esc(r.nameEn||'')}"></div>
   <div style="grid-column:1/-1"><label class="chk"><input type="checkbox" id="sf_always" ${r.always?'checked':''}> Проходится всегда</label>
    <div class="hint">«Всегда» — станция есть в маршруте любой детали: резка, готовность к отгрузке, отгрузка. Остальные включаются составом изделия.</div></div>
  </div>
  <div style="margin-top:12px"><label>Примечание</label><input id="sf_note" value="${esc(r.note||'')}"></div>
  <div class="err" id="e_sfStation"></div>
  <div class="row"><button class="pri" onclick="saveSfStation()">Сохранить</button><button onclick="stEdit=null;render()">Отмена</button></div></div>`;
}
function saveSfStation(){
 const e=document.getElementById('e_sfStation'); e.style.display='none';
 const seq=+document.getElementById('sf_seq').value;
 const code=document.getElementById('sf_code').value.trim().toUpperCase();
 const name=document.getElementById('sf_name').value.trim();
 if(!Number.isInteger(seq)||seq<=0) return fail(e,'Порядок: целое положительное число');
 if(!code||!name) return fail(e,'Код и название обязательны');
 if(!SF_CODE_RE.test(code)) return fail(e,'Код: только A–Z, 0–9, дефис и подчёркивание');
 if(DB.station.some((s,i)=>i!==stEdit && s.code===code)) return fail(e,'Такой код уже есть');
 const o={seq,code,name,nameEn:document.getElementById('sf_nameEn').value.trim(),
  always:document.getElementById('sf_always').checked,note:document.getElementById('sf_note').value.trim()};
 if(stEdit==='new') DB.station.push(o); else Object.assign(DB.station[stEdit],o);
 DB.station.sort((a,b)=>a.seq-b.seq);
 stEdit=null; touch(); render();
}
/* Станцию, на которую ссылаются операции, не удаляем: операция без станции —
   сирота, и увидит её только тот, кто откроет нужную вкладку. */
function delSfStation(i){
 const s=DB.station[i];
 if(DB.operation.some(o=>o.station===s.code)) return alert('Cannot delete — operations belong to this station');
 if(DB.workPosition.some(w=>w.station===s.code)) return alert('Cannot delete — work positions belong to this station');
 if(!confirm('Delete this station?'))return; DB.station.splice(i,1); touch(); render();
}

/* --- 2. Рабочие места ------------------------------------------------ */
let wpEdit=null;
function viewSfPositions(){
 const cards=DB.workPosition.map(w=>{
  const st=workPositionStations(w);
  const icon=w.code.indexOf('FURN')===0?'furnace':w.code.indexOf('CNC')===0?'cnc':w.station==='EDGE'?'edge':w.station==='CUT'?'cut':'factory';
  return `<div class="machine-card"><div class="machine-head"><div class="machine-ico">${ico(icon)}</div><div><b>${sfLabel(w)}</b><div class="code" data-raw>${esc(w.code)}</div></div></div>
   <div class="machine-meta">
    <div><span>Станции</span><strong>${st.length?st.map(esc).join(' · '):'—'}</strong></div>
    <div><span>Габарит</span><strong>${w.maxW?w.maxW+' × '+w.maxL+' in':'не замерен'}</strong></div>
    <div><span>Загрузка</span><strong>${w.batchMode==='batch'?'садка':'поштучно'}</strong></div>
    <div><span>Оператор</span><strong>${w.defaultOperator?raw(w.defaultOperator):'—'}${w.defaultHelper?' + '+raw(w.defaultHelper):''}</strong></div>
   </div></div>`;
 }).join('');
 const rows=DB.workPosition.map((w,i)=>{
  const st=workPositionStations(w);
  return `<tr><td class="mono"><b>${raw(w.code)}</b></td><td>${sfLabel(w)}</td>
   <td>${st.map(c=>`<span class="pill ${c===w.station?'info':''}" data-raw>${esc(c)}</span>`).join(' ')||'<span class="bad pill">нет станции</span>'}</td>
   <td>${(w.operations||[]).map(c=>`<span class="pill" data-raw>${esc(c)}</span>`).join(' ')||'<span class="mut">—</span>'}</td>
   <td class="mono">${w.maxW?w.maxW+' × '+w.maxL:'<span class="bad pill">не замерен</span>'}</td>
   <td>${w.batchMode==='batch'?'<span class="pill warn">садка</span>':'<span class="mut">поштучно</span>'}</td>
   <td class="mono">${w.defaultOperator?raw(w.defaultOperator):'<span class="mut">—</span>'}${w.defaultHelper?' <span class="mut">+</span> '+raw(w.defaultHelper):''}</td>
   <td class="mut" style="max-width:220px">${raw(w.note||'')}</td>
   <td style="white-space:nowrap"><button class="sm" onclick="wpEdit=${i};render()">Изменить</button>
   <button class="sm dl" onclick="delSfPosition(${i})">×</button></td></tr>`;
 }).join('');
 const noSize=workPositionsAwaitingSize();
 return `${wpEdit!==null?sfPositionForm():''}
  <div class="sub">Где делают. Габарит — рабочее ПОЛЕ, а не корпус станка: модель отвечает на вопрос «влезет ли деталь». Оператор и напарник — префилл экрана, а не закрепление человека за станком.</div>
  <div class="machine-grid">${cards}</div>
  ${noSize.length?`<div class="note" style="margin-top:12px"><span>Ждут замеров в цеху (${noSize.length}):</span> ${noSize.map(w=>`<b>${raw(w.code)}</b>`).join(', ')}<span>. Пока габарита нет, check_route_fits() этапа 7·2 работать не может. Замеры приезжают импортом WORK_POSITIONS.csv — правка кода для этого не нужна.</span></div>`:''}
  <div class="section-title" style="margin-top:18px"><h3>Точная таблица рабочих мест</h3><span class="mut" style="font-size:11px">CRUD сохранён</span></div>
  <table><thead><tr><th>Код</th><th>Название</th><th>Станции</th><th>Операции</th><th>Габарит, in</th><th>Загрузка</th><th>Оператор</th><th>Примечание</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="9" class="empty">пусто</td></tr>'}</tbody></table>
  ${wpEdit!==null?'':'<div class="row"><button class="pri" onclick="wpEdit=\'new\';render()">Добавить рабочее место</button></div>'}`;
}
function sfPositionForm(){
 const r = wpEdit==='new' ? {code:'',station:'',name:'',nameEn:'',kind:'machine',operations:[],defaultOperator:'',defaultHelper:'',maxW:'',maxL:'',batchMode:'single',note:''} : DB.workPosition[wpEdit];
 return `<div class="form"><h3>${wpEdit==='new'?'Новое рабочее место':'Изменение'}</h3>
  <div class="grid">
   <div><label>Код *</label><input id="wp_code" value="${esc(r.code)}"></div>
   <div><label>Домашняя станция *</label><select id="wp_station"><option value="">— выбери —</option>
    ${DB.station.map(s=>`<option value="${esc(s.code)}" ${s.code===r.station?'selected':''} data-raw>${esc(s.code)} — ${esc(sfName(s))}</option>`).join('')}</select></div>
   <div><label>Название (RU) *</label><input id="wp_name" value="${esc(r.name)}"></div>
   <div><label>Название (EN)</label><input id="wp_nameEn" value="${esc(r.nameEn||'')}"></div>
   <div><label>Тип места</label><select id="wp_kind"><option value="machine" ${r.kind==='machine'?'selected':''}>станок</option><option value="manual" ${r.kind==='manual'?'selected':''}>ручное место</option></select></div>
   <div><label>Загрузка</label><select id="wp_batch"><option value="single" ${r.batchMode==='single'?'selected':''}>поштучно</option><option value="batch" ${r.batchMode==='batch'?'selected':''}>садкой</option></select></div>
   <div style="grid-column:1/-1"><label>Операции</label>
    <div style="display:flex;flex-wrap:wrap;gap:8px 16px">${DB.operation.map(o=>`<label style="display:inline-flex;align-items:center;gap:6px;font-weight:400"><input type="checkbox" class="wp_op" value="${esc(o.code)}" ${(r.operations||[]).includes(o.code)?'checked':''}><span data-raw>${esc(o.code)} — ${esc(sfName(o))}</span></label>`).join('')}</div>
    <div class="hint">Список станций места выводится из его операций, отдельно его не задают. Поэтому ЧПУ с полировкой контура сам оказывается и на FAB, и на EDGE.</div></div>
   <div><label>Оператор по умолчанию</label><input id="wp_op1" value="${esc(r.defaultOperator||'')}"></div>
   <div><label>Напарник по умолчанию</label><input id="wp_op2" value="${esc(r.defaultHelper||'')}"></div>
   <div><label>Макс. ширина поля, in</label><input id="wp_maxW" type="number" min="0" step="any" value="${r.maxW??''}"></div>
   <div><label>Макс. длина поля, in</label><input id="wp_maxL" type="number" min="0" step="any" value="${r.maxL??''}"></div>
  </div>
  <div style="margin-top:12px"><label>Примечание</label><input id="wp_note" value="${esc(r.note||'')}"></div>
  <div class="err" id="e_sfPosition"></div>
  <div class="row"><button class="pri" onclick="saveSfPosition()">Сохранить</button><button onclick="wpEdit=null;render()">Отмена</button></div></div>`;
}
function saveSfPosition(){
 const e=document.getElementById('e_sfPosition'); e.style.display='none';
 const code=document.getElementById('wp_code').value.trim().toUpperCase();
 const station=document.getElementById('wp_station').value;
 const name=document.getElementById('wp_name').value.trim();
 if(!code||!name) return fail(e,'Код и название обязательны');
 if(!SF_CODE_RE.test(code)) return fail(e,'Код: только A–Z, 0–9, дефис и подчёркивание');
 if(!DB.station.some(s=>s.code===station)) return fail(e,'Выбери домашнюю станцию');
 if(DB.workPosition.some((w,i)=>i!==wpEdit && w.code===code)) return fail(e,'Такой код уже есть');
 const g=id=>{const v=document.getElementById(id).value; return v===''?null:+v;};
 const maxW=g('wp_maxW'),maxL=g('wp_maxL');
 if((maxW==null)!==(maxL==null))return fail(e,'Габарит заполняется парой: ширина и длина');
 if(maxW!=null&&(!(maxW>0)||!(maxL>0)))return fail(e,'Габариты рабочего места должны быть больше нуля');
 const o={code,station,name,nameEn:document.getElementById('wp_nameEn').value.trim(),
  kind:document.getElementById('wp_kind').value,batchMode:document.getElementById('wp_batch').value,
  operations:[...document.querySelectorAll('.wp_op:checked')].map(x=>x.value),
  defaultOperator:document.getElementById('wp_op1').value.trim(),
  defaultHelper:document.getElementById('wp_op2').value.trim(),
  maxW,maxL,note:document.getElementById('wp_note').value.trim()};
 if(wpEdit==='new') DB.workPosition.push(o); else Object.assign(DB.workPosition[wpEdit],o);
 wpEdit=null; touch(); render();
}
function delSfPosition(i){
 const w=DB.workPosition[i];
 if(DB.user.some(u=>u.workPosition===w.code)) return alert('Cannot delete — users are assigned to this work position');
 if(DB.terminal.some(t=>(t.workPositions||[]).includes(w.code))) return alert('Cannot delete — terminals are wired to this work position');
 if(!confirm('Delete this work position?'))return; DB.workPosition.splice(i,1); touch(); render();
}

/* --- 3. Операции ----------------------------------------------------- */
let opEdit=null;
function viewSfOperations(){
 const rows=DB.operation.map((o,i)=>{
  const wp=operationWorkPositions(o.code);
  return `<tr><td class="mono"><b>${raw(o.code)}</b></td><td>${sfLabel(o)}</td>
   <td>${o.station?`<span class="pill info" data-raw>${esc(o.station)}</span>`:'<span class="bad pill">нет станции</span>'}</td>
   <td><span class="pill ${o.stage==='any'?'':'info'}">${SF_STAGE_LABEL[o.stage]}</span></td>
   <td>${o.unit?`<span class="pill">${SF_UNIT_LABEL[o.unit]}</span>`:'<span class="warn pill">не задана</span>'}</td>
   <td>${wp.length?wp.map(w=>`<span class="pill" data-raw>${esc(w.code)}</span>`).join(' '):'<span class="warn pill">нет места</span>'}</td>
   <td class="mut" style="max-width:260px">${raw(o.note||'')}</td>
   <td style="white-space:nowrap"><button class="sm" onclick="opEdit=${i};render()">Изменить</button>
   <button class="sm dl" onclick="delSfOperation(${i})">×</button></td></tr>`;
 }).join('');
 const noUnit=DB.operation.filter(o=>!o.unit).length;
 return `${opEdit!==null?sfOperationForm():''}
  <div class="sub">Что именно делают. «До печи / после печи» — свойство ОПЕРАЦИИ, а не станции: на одном и том же ЧПУ отверстия обязаны быть до печи, а полировка ламината — после. Держи это на станке — и третий визит детали затрёт первый.</div>
  ${noUnit?`<div class="note" style="margin-bottom:12px"><b>Единица не задана у ${noUnit} операций.</b> <span>Её не подставляли по догадке: на единице стоит цена, а выдуманная единица тише и опаснее пустой — в неё верят. Заполняется вместе с прайсом на этапе 6.</span></div>`:''}

   <div><label>Единица</label><select id="op_unit"><option value="">— не задана —</option>${SF_UNITS.map(x=>`<option value="${x}" ${x===r.unit?'selected':''}>${SF_UNIT_LABEL[x]}</option>`).join('')}</select></div>

function saveSfOperation(){
 const e=document.getElementById('e_sfOperation'); e.style.display='none';
 const code=document.getElementById('op_code').value.trim().toLowerCase();
 const station=document.getElementById('op_station').value;
 const name=document.getElementById('op_name').value.trim();
 if(!code||!name) return fail(e,'Код и название обязательны');
 if(!SF_OP_CODE_RE.test(code)) return fail(e,'Код операции: строчные латинские буквы, цифры и подчёркивание');
 if(!DB.station.some(s=>s.code===station)) return fail(e,'Выбери станцию');
 if(DB.operation.some((o,i)=>i!==opEdit && o.code===code)) return fail(e,'Такой код уже есть');
 const unit=document.getElementById('op_unit').value;
 const o={code,station,name,nameEn:document.getElementById('op_nameEn').value.trim(),
  stage:document.getElementById('op_stage').value,unit:unit||null,
  note:document.getElementById('op_note').value.trim()};
 if(opEdit==='new') DB.operation.push(o);
 else{
  /* Смена кода раньше молча осиротляла рабочие места: удалить операцию со
     ссылками нельзя, а переименовать было можно — и место ссылалось в пустоту.
     Тянем ссылки за операцией. */
  const was=DB.operation[opEdit].code;
  Object.assign(DB.operation[opEdit],o);
  if(was!==code) DB.workPosition.forEach(w=>{w.operations=(w.operations||[]).map(c=>c===was?code:c);});
 }
 opEdit=null; touch(); render();
}
function delSfOperation(i){
 const o=DB.operation[i];
 if(DB.workPosition.some(w=>(w.operations||[]).includes(o.code))) return alert('Cannot delete — work positions perform this operation');
 if(!confirm('Delete this operation?'))return; DB.operation.splice(i,1); touch(); render();
}

function viewSfTerminals(){
 const rows=DB.terminal.map((t,i)=>{

   <button class="sm dl" onclick="delSfTerminal(${i})">×</button></td></tr>`;
 }).join('');
 return `${tmEdit!==null?sfTerminalForm():''}
  <div class="sub">Экран сканирования. Терминал читает и пишет, но ничего не определяет: ключом шага маршрута он не бывает никогда. Оператор сканирует стикер — экран показывает открытые операции ЭТОЙ детали для ЭТОГО места, все отмечены заранее, он снимает галочку с того, чего не делал.</div>
  <div class="note" style="margin-bottom:12px">Именно здесь закрывается самый дорогой дефект Spil: закрыть операцию, которой нет в маршруте детали, физически невозможно — на экране её просто нет. Случай «CNC показал петли выполненными, хотя их не делали» не может возникнуть в принципе.</div>
  <table><thead><tr><th>Код</th><th>Название</th><th>Рабочие места</th><th>Станции, которые закрывает</th><th>Примечание</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="6" class="empty">Список пуст, и это честное состояние. Сколько экранов стоит в цеху и какие места висят на каждом — ещё не называли. Засеять «по одному на станцию» значило бы повторить болезнь подстанций Spil: справочник, распухший выдуманными строками.</td></tr>'}</tbody></table>
  ${tmEdit!==null?'':'<div class="row"><button class="pri" onclick="tmEdit=\'new\';render()">Добавить терминал</button></div>'}`;
}
function sfTerminalForm(){
 const r = tmEdit==='new' ? {code:'',name:'',nameEn:'',workPositions:[],note:''} : DB.terminal[tmEdit];
 return `<div class="form"><h3>${tmEdit==='new'?'Новый терминал':'Изменение'}</h3>
  <div class="grid">
   <div><label>Код *</label><input id="tm_code" value="${esc(r.code)}"></div>
   <div><label>Название (RU) *</label><input id="tm_name" value="${esc(r.name)}"></div>

  </div>

   <div style="display:flex;flex-wrap:wrap;gap:8px 16px">${DB.workPosition.map(w=>`<label style="display:inline-flex;align-items:center;gap:6px;font-weight:400"><input type="checkbox" class="tm_wp" value="${esc(w.code)}" ${(r.workPositions||[]).includes(w.code)?'checked':''}><span data-raw>${esc(w.code)} — ${esc(sfName(w))}</span></label>`).join('')}</div>
   <div class="hint">Один экран обслуживает несколько мест — переключать его оператор не будет, и это условие задачи, а не то, что надо чинить.</div></div>
  <div style="margin-top:12px"><label>Примечание</label><input id="tm_note" value="${esc(r.note||'')}"></div>
  <div class="err" id="e_sfTerminal"></div>
  <div class="row"><button class="pri" onclick="saveSfTerminal()">Сохранить</button><button onclick="tmEdit=null;render()">Отмена</button></div></div>`;

function saveSfTerminal(){
 const e=document.getElementById('e_sfTerminal'); e.style.display='none';
 const code=document.getElementById('tm_code').value.trim().toUpperCase();
 const name=document.getElementById('tm_name').value.trim();
 if(!code||!name) return fail(e,'Код и название обязательны');
 if(!SF_CODE_RE.test(code)) return fail(e,'Код: только A–Z, 0–9, дефис и подчёркивание');
 if(DB.terminal.some((t,i)=>i!==tmEdit && t.code===code)) return fail(e,'Такой код уже есть');
 const o={code,name,nameEn:document.getElementById('tm_nameEn').value.trim(),
  workPositions:[...document.querySelectorAll('.tm_wp:checked')].map(x=>x.value),

 tmEdit=null; touch(); render();

let sfImportReport=null;
function sfImportCard(){
 const which=subtab==='stations'?'STATIONS.csv':'WORK_POSITIONS.csv';
 return `<div class="card">
  <div class="section-title"><h3>Загрузить ${which}</h3><span class="pill info">слияние по коду</span></div>
  <div class="sub">Файл обновляет строки с теми же кодами и добавляет новые. Строки, которых в файле нет, остаются на месте и перечисляются в отчёте — чужой файл не сносит то, что завели руками.</div>
  <div class="row"><button onclick="document.getElementById('sfCsv').click()">Выбрать файл</button>
   <input type="file" id="sfCsv" accept=".csv,.txt" style="display:none" onchange="sfImportCsv(this,'${subtab}')"></div>
  ${sfImportReport&&sfImportReport.which===subtab?sfReportHTML(sfImportReport.rep):''}</div>`;
}
function sfReportHTML(rep){
 const rejected=rep.rejected.map(r=>`<tr><td class="mono">${r.line?r.line:'—'}</td><td class="mono" data-raw>${esc(r.code)}</td><td>${esc(r.why)}</td></tr>`).join('');
 return `<div class="note" style="margin-top:12px">
   <b>Принято строк: ${rep.accepted}</b> — новых ${rep.added}, обновлено ${rep.updated}. Отклонено: ${rep.rejected.length}.
   ${rep.missing.length?`<div style="margin-top:6px">В файле не было, оставлены как есть: ${rep.missing.map(c=>`<b>${esc(c)}</b>`).join(', ')}.</div>`:''}
  </div>
  ${rejected?`<table style="margin-top:10px"><thead><tr><th>Строка</th><th>Код</th><th>Почему отклонена</th></tr></thead><tbody>${rejected}</tbody></table>`:''}`;
}
function sfImportCsv(inp,which){
 const f=inp.files[0]; inp.value='';
 if(!f) return;
 if(f.size>2*1024*1024){alert('File not readable: CSV exceeds 2 MB.');return;}
 const r=new FileReader();
 r.onload=()=>{
  try{
   /* отчёт принадлежит той таблице, в которую грузили: иначе он остаётся
      висеть на соседней вкладке и относится там уже не к тем строкам */
   sfImportReport = {which:which, rep: which==='stations' ? importStationsCsv(r.result) : importWorkPositionsCsv(r.result)};
   touch(); render();
  }catch(e){ alert('File not readable: '+e.message); }
 };
 r.readAsText(f);
}

   IN : DB.glassProduct · DB.glassSheet · остальные справочники

   IGDB, и первое, что с ними придётся сделать, — дописать своего поставщика и
   переименовать чужие коды в цеховые. Без экрана это означает Excel, повторную

   Позиция, на которую ссылается Makeup, НЕ УДАЛЯЕТСЯ — только помечается
   неактивной. Иначе старый заказ показал бы `?` вместо кода стекла, и никто

 });

function mdGlassSave(){
 const e=document.getElementById('e_mdGlass');e.style.display='none';
 const code=mdVal('md_code'),name=mdVal('md_name'),thick=mdVal('md_thick');
 if(!code||!name)return fail(e,'Код и название обязательны');
 if(!GLASS_CODE_RE.test(code))return fail(e,'Код: только буквы, цифры и + . _ - /');
 if(DB.glassProduct.some(p=>p.code.toUpperCase()===code.toUpperCase()&&p.id!==mdDraft.id))return fail(e,'Такой код уже есть');
 const t=+thick;
 if(!Number.isFinite(t)||t<GLASS_MIN_MM||t>GLASS_MAX_MM)return fail(e,'Толщина: число от '+GLASS_MIN_MM+' до '+GLASS_MAX_MM+' мм');
 const surfaces=glassSurfacesCell(mdVal('md_surfaces'));
 if(surfaces===null)return fail(e,'Поверхности: номера от 1 до 8 через запятую');
 const next=Object.assign({},mdDraft,{
  code,name,manufacturer:mdVal('md_mfr'),thicknessMm:t,
  actualThicknessMm:mdVal('md_actual')===''?null:+mdVal('md_actual'),
  substrate:mdVal('md_substrate'),coatingFamily:mdVal('md_coating'),deposition:mdVal('md_deposition'),
  temperMode:mdVal('md_temper'),exposureRule:mdVal('md_exposure'),allowedSurfaces:surfaces,
  stockingUnit:mdVal('md_stockunit'),salesUnit:mdVal('md_salesunit'),legacyCode:mdVal('md_legacy'),
  note:mdVal('md_note'),stocked:mdChecked('md_stocked'),edgeDeletion:mdChecked('md_edge'),active:mdChecked('md_active')
 });
 if(mdEdit==='new'){
  next.id=glassProductId(code);
  if(DB.glassProduct.some(p=>p.id===next.id))return fail(e,'Позиция с таким идентификатором уже есть');
  DB.glassProduct.push(normalizeGlassProduct(next));
 }else{
  const at=DB.glassProduct.findIndex(p=>p.id===mdDraft.id);
  if(at<0)return fail(e,'Позиция не найдена');
  /* идентификатор НЕ пересчитывается по новому коду: на него ссылаются Makeup */
  DB.glassProduct[at]=normalizeGlassProduct(next);
 }
 mdEdit=null;mdDraft=null;normalizeMasterData();touch();render();
}
/* Снятие с производства — обратимая пометка, а не удаление: позиция исчезает
   из выбора, но остаётся видимой в старых заказах и в этой таблице. */
function mdGlassToggle(id){
 const p=glassProductById(id);if(!p)return;
 p.active=p.active===false;touch();render();
}
function mdGlassDelete(id){
 const p=glassProductById(id);if(!p)return;
 if(salesGlassProductHasReferences(id))
  return alert('Cannot delete — this glass is used in a Makeup. Mark it out of production instead.');
 if(glassSheetsFor(p.code).length&&!confirm('Supply rows for this glass will be left without a product. Delete anyway?'))return;
 if(!confirm('Delete this glass product?'))return;
 DB.glassProduct=DB.glassProduct.filter(x=>x.id!==id);
 touch();render();
}

 });

 mdSheetEdit=null;mdSheetDraft=null;normalizeMasterData();touch();render();

/* ==== src/erp/storage.js ==== */
/* =====================================================================
   erp/storage  ·  erp-1.0
   localStorage, экспорт/импорт JSON, старт приложения.
   IN : —
   OUT: —
   Правило: файл не содержит бизнес-логику доменов; он вызывает их публичные
   normalize/validate hooks и отвечает только за безопасный вход→выход.
   ===================================================================== */

function afterRender(){applyLang(document.body)}
let storageWarningShown=false;
function touch(){
 dirty=true;
 try{localStorage.setItem('glazing_system_v1',JSON.stringify(DB));storageWarningShown=false;return true;}
 catch(e){console.error('localStorage write failed:',e);if(!storageWarningShown){storageWarningShown=true;alert('Could not save to this browser. Export JSON and check free space.');}return false;}
}
/* Черновик заказа живёт только в памяти: F5 или закрытие вкладки стирали его
   без предупреждения. Спрашиваем ровно тогда, когда есть что терять — иначе
   браузер показывал бы диалог на каждом уходе со страницы. */
window.addEventListener('beforeunload',function(e){
 if(typeof salesDraftHasWork!=='function'||!salesDraftHasWork())return;
 e.preventDefault();e.returnValue='';return '';
});
function doExport(){
 const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='glazing_system_data.json'; a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000); dirty=false; render();
}
function doImport(inp){
 const f=inp.files[0]; if(!f) return; const r=new FileReader();
 if(f.size>10*1024*1024){alert('File not readable: JSON exceeds 10 MB.');inp.value='';return;}
 r.onload=()=>{ try{ DB=prepareImportedState(JSON.parse(r.result));touch();render(); }
  catch(e){ alert('File not readable: '+e.message); } };
 r.readAsText(f); inp.value='';
}
/* ИСПРАВЛЕНО (авг 2026). Раньше здесь был Object.assign(DB, JSON.parse(s)) —
   в DB попадало ЛЮБОЕ содержимое ключа, включая null вместо массива, и
   normalizeUsers() падал на .forEach. Результат: пустой белый экран без
   единого сообщения, и починить его можно было только через DevTools.
   Тот же ключ localStorage использовала предыдущая оболочка прототипа,
   так что чужая структура данных там вполне реальна. */
function mergeState(src){
 if(!src||typeof src!=='object')return;
 Object.keys(DEFAULT).forEach(k=>{
  const v=src[k];
  if(Array.isArray(DEFAULT[k])){ if(Array.isArray(v)) DB[k]=v; }
  else if(v!=null) DB[k]=v;
 });
}
function validateImportedState(src){
 if(!src||typeof src!=='object'||Array.isArray(src))throw new Error('Expected an exported state object.');
 Object.keys(DEFAULT).forEach(k=>{if(Array.isArray(DEFAULT[k])&&Object.prototype.hasOwnProperty.call(src,k)&&!Array.isArray(src[k]))throw new Error('The "'+k+'" field must be an array.');});
 if(typeof validateCustomersPayload==='function')validateCustomersPayload(src);
 if(typeof validateSalesPayload==='function')validateSalesPayload(src);
 function unique(list,key,label,normalize){
  const seen=new Set();(Array.isArray(list)?list:[]).forEach((row,i)=>{
   if(!row||typeof row!=='object')return;
   const raw=row[key];if(raw==null||raw==='')return;
   const value=normalize?normalize(raw):String(raw);
   if(seen.has(value))throw new Error(label+': duplicate "'+value+'".');seen.add(value);
  });
 }
 /* `level` больше не таблица — старый экспорт с этим ключом читается, ключ
    просто игнорируется: шагом маршрута стала сама станция. */
 unique(src.station,'code','Stations',v=>String(v).trim().toUpperCase());
 unique(src.operation,'code','Operations',v=>String(v).trim().toLowerCase());
 unique(src.workPosition,'code','Work positions',v=>String(v).trim().toUpperCase());
 unique(src.terminal,'code','Terminals',v=>String(v).trim().toUpperCase());
 /* Каталог стекла опознаётся и по id, и по коду: id держит ссылки из
    сохранённых Makeup, код — слияние при импорте CSV. Дубль любого из них
    означает, что одна из двух записей окажется недостижимой. */
 unique(src.glassProduct,'id','Glass products');
 unique(src.glassProduct,'code','Glass products',v=>String(v).trim().toUpperCase());
 unique(src.glassSheet,'id','Glass supply');
 unique(src.shapeDef,'id','Shape');unique(src.muntinDef,'id','Muntin');
 const entityId=/^[A-Za-z0-9_-]{1,96}$/;
 (src.shapeDef||[]).forEach((s,i)=>{if(s&&s.id&&!entityId.test(String(s.id)))throw new Error('Shape row '+(i+1)+' has an invalid id.');});
 (src.shapeDef||[]).forEach((s,i)=>{
  if(!s||typeof s!=='object')return;
  if(s.type!=null&&!SHAPE_PRESETS.some(p=>p.id===s.type))throw new Error('Shape row '+(i+1)+' has an unknown type.');
  if(s.features!=null&&!Array.isArray(s.features))throw new Error('Shape row '+(i+1)+': features must be an array.');
  if(s.polygon!=null&&!Array.isArray(s.polygon))throw new Error('Shape row '+(i+1)+': polygon must be an array.');
  if(s.edgeOps!=null&&(!s.edgeOps||typeof s.edgeOps!=='object'||Array.isArray(s.edgeOps)))throw new Error('Shape row '+(i+1)+': edgeOps must be an object.');
  const ids=new Set(),subId=/^[A-Za-z0-9:_-]{1,96}$/;(s.features||[]).forEach((f,j)=>{if(!f||!SHAPE_FEATURE_TYPES.includes(f.type))throw new Error('Shape '+(i+1)+', feature '+(j+1)+' has an unknown type.');if(f.id&&!subId.test(String(f.id)))throw new Error('Shape '+(i+1)+' has a feature with an invalid id.');if(f.id&&ids.has(f.id))throw new Error('Shape '+(i+1)+' has duplicate feature ids.');if(f.id)ids.add(f.id);});
  Object.keys(s.edgeOps||{}).forEach(edgeId=>{if(!subId.test(edgeId)||!Array.isArray(s.edgeOps[edgeId]))throw new Error('Shape '+(i+1)+' has invalid edgework.');s.edgeOps[edgeId].forEach(op=>{if(!op||!SHAPE_EDGE_OPS.includes(op.type))throw new Error('Shape '+(i+1)+' has an unknown edge operation.');});});
 });
 (src.muntinDef||[]).forEach((m,i)=>{if(m&&m.id&&!entityId.test(String(m.id)))throw new Error('Muntin row '+(i+1)+' has an invalid id.');});
 (src.station||[]).forEach((s,i)=>{if(s&&s.code&&!SF_CODE_RE.test(String(s.code).trim().toUpperCase()))throw new Error('Station row '+(i+1)+' has an invalid code.');});
 (src.workPosition||[]).forEach((w,i)=>{
  if(!w)return;
  if(w.code&&!SF_CODE_RE.test(String(w.code).trim().toUpperCase()))throw new Error('Work position row '+(i+1)+' has an invalid code.');
  if(w.operations!=null&&!Array.isArray(w.operations))throw new Error('Work position row '+(i+1)+': operations must be an array.');
 });
 (src.operation||[]).forEach((o,i)=>{if(o&&o.code&&!SF_OP_CODE_RE.test(String(o.code).trim().toLowerCase()))throw new Error('Operation row '+(i+1)+' has an invalid code.');});
 (src.terminal||[]).forEach((t,i)=>{
  if(!t)return;
  if(t.code&&!SF_CODE_RE.test(String(t.code).trim().toUpperCase()))throw new Error('Terminal row '+(i+1)+' has an invalid code.');
  if(t.workPositions!=null&&!Array.isArray(t.workPositions))throw new Error('Terminal row '+(i+1)+': workPositions must be an array.');
 });
 (src.user||[]).forEach((u,i)=>{
  if(!u)return;if(u.skills!=null&&!Array.isArray(u.skills))throw new Error('User '+(i+1)+': skills must be an array.');
  if(u.role!=null&&!ROLES.includes(u.role))throw new Error('User '+(i+1)+' has an unknown role.');
  (u.skills||[]).forEach((s,j)=>{const n=normSkill(s);if(!n)throw new Error('User '+(i+1)+', skill '+(j+1)+' is invalid.');});
 });
}
function prepareImportedState(src){
 validateImportedState(src);
 const previous=DB, previousReseeded=referenceReseeded;
 try{
  DB=JSON.parse(JSON.stringify(DEFAULT));mergeState(src);normalizeDB();
  /* Пересев на импорте, а не только на старте. Версия справочников живёт В
     ДАННЫХ ровно затем, чтобы чужой файл со старым каталогом тоже пересеялся;
     до сих пор это срабатывало лишь при следующем F5, и всё это время на
     экране лежала прежняя модель цеха. Теперь — сразу. */
  if(typeof reseedReferenceTables==='function'&&reseedReferenceTables(true))normalizeDB();
  const shapeIds=new Set(DB.shapeDef.map(s=>s.id));
  DB.muntinDef.forEach((m,i)=>{if(!shapeIds.has(m.shapeId))throw new Error('Muntin row '+(i+1)+' references a missing Shape.');});
  if(typeof validateSalesReferences==='function')validateSalesReferences();
  const next=DB;DB=previous;return next;
  /* Откатываем и ОТМЕТКУ о пересеве: импорт мог упасть уже после него, и
     баннер «справочники обновлены» рассказывал бы про замену, которой не было. */
 }catch(e){DB=previous;referenceReseeded=previousReseeded;throw e;}
}
function normalizeDB(){
 Object.keys(DEFAULT).forEach(k=>{ if(Array.isArray(DEFAULT[k])&&!Array.isArray(DB[k])) DB[k]=JSON.parse(JSON.stringify(DEFAULT[k])); });
 normalizeRefVersion();
 /* Порядок обязателен: рабочие места приводятся в порядок ДО пользователей.
    Пользователь ссылается на рабочее место, и проверять ссылку не на чем,
    пока таблица мест не нормализована. */
 normalizeShopFloor();
 normalizeUsers();
 normalizeSalesModules();
 if(typeof normalizeMasterData==='function')normalizeMasterData();
 if(typeof normalizeCustomers==='function')normalizeCustomers();
 if(typeof normalizeSalesData==='function')normalizeSalesData();
}
function boot(){
 let hadSavedState=false;
 try{ const s=localStorage.getItem('glazing_system_v1'); if(s){ hadSavedState=true; mergeState(JSON.parse(s)); } }
 catch(e){ console.warn('localStorage не прочитан, стартуем с дефолтов:',e.message); }
 try{ normalizeDB(); }
 catch(e){ console.warn('данные не нормализуются, откат на дефолты:',e.message); DB=JSON.parse(JSON.stringify(DEFAULT)); normalizeDB(); }
 /* Пересев справочников. Идёт ПОСЛЕ первой нормализации (иначе сравнивать не с
    чем) и сам вызывает её повторно, чтобы заводские данные прошли те же правила,
    что и любые другие. Рабочие данные не трогаются — см. reseedReferenceTables. */
 if(typeof reseedReferenceTables==='function'&&reseedReferenceTables(hadSavedState)){ normalizeDB(); touch(); }
 /* B8: пустой список пользователей — не рабочее состояние прототипа. Засев
    идёт после нормализации, чтобы демо-записи прошли те же правила, и ровно
    один раз на браузер (см. seedDemoUsers в erp/data). */
 if(typeof seedDemoUsers==='function'&&seedDemoUsers())touch();
 render();
}
boot();

/* ---------------------------------------------------------------------
   Печать чертежа на бумагу / в PDF.

   Никаких внешних библиотек: файл обязан открываться с диска. Чертёж уже
   является самодостаточным SVG, поэтому печать сводится к тому, чтобы на
   время печати показать ТОЛЬКО его. Отдельное окно не открываем — блокировщик
   всплывающих окон и режим file:// делают этот путь ненадёжным.
   --------------------------------------------------------------------- */
function printSheetHost(){
  var h=document.getElementById('printSheetHost');
  if(!h){h=document.createElement('div');h.id='printSheetHost';document.body.appendChild(h);}
  return h;
}
function printSheetCleanup(){
  document.body.classList.remove('printing');
  var h=document.getElementById('printSheetHost');if(h)h.innerHTML='';
}
/* Копия чертежа получает СВОИ идентификаторы. На странице в этот момент живёт
   ещё и превью с тем же <marker id="shpArr">, а браузер разрешает url(#id) по
   первому совпадению в документе — им оказывался скрытый превью-элемент, и на
   бумаге у цепочек размеров пропадали стрелки. */
function printSheetUniqueIds(svg){
  var n='pr'+Date.now().toString(36);
  return String(svg)
    .replace(/id="([A-Za-z][\w-]*)"/g,function(m,id){return 'id="'+id+'-'+n+'"';})
    .replace(/url\(#([A-Za-z][\w-]*)\)/g,function(m,id){return 'url(#'+id+'-'+n+')';});
}
/* Подготовка листа отделена от вызова печати: так её можно проверить тестом,
   не открывая системный диалог. */
function printSheetPrepare(svg,caption){
  if(!svg)return false;
  var h=printSheetHost();
  h.innerHTML='<div class="print-sheet">'+printSheetUniqueIds(svg)+(caption?'<div class="print-caption">'+esc(caption)+'</div>':'')+'</div>';
  document.body.classList.add('printing');
  return true;
}
/* svg — готовая разметка чертежа, caption — подпись под листом (что печатаем). */
function printSheet(svg,caption){
  if(!printSheetPrepare(svg,caption))return false;
  window.addEventListener('afterprint',printSheetCleanup,{once:true});
  /* Safari и часть сборок Chromium не шлют afterprint — подстраховываемся. */
  setTimeout(printSheetCleanup,60000);
  try{window.print();}catch(e){printSheetCleanup();return false;}
  return true;
}
window.addEventListener('resize',function(){if(typeof shapeFitPreview==='function')shapeFitPreview();});

</script>

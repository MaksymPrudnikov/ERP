<style>
/* ---- src/styles/base.css ---- */
*{box-sizing:border-box}
:root{
 --bg:#f4f6f8;--panel:#fff;--panel2:#f8fafb;--line:#e2e8ee;--line2:#edf1f4;
 --text:#17212b;--mut:#6c7a86;--nav:#12232e;--nav2:#183340;--blue:#2f7da8;
 --blue2:#eaf4fa;--green:#27815a;--green2:#e9f6ef;--amber:#a86c13;--amber2:#fff5df;
 --red:#a84444;--red2:#fdeeee;--shadow:0 8px 28px rgba(28,52,66,.06);
}
html{background:var(--bg)}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
.shell{display:flex;min-height:100vh}
.side{width:250px;flex:none;background:var(--nav);color:#dbe7ed;padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid #203844}
.brand{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px;display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#4ba0cf,#23678c);display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px rgba(50,137,184,.25)}
.brand-mark svg{width:21px;height:21px}
.brand-copy b{font-size:14px;color:#fff;letter-spacing:.01em}
.brand-copy span{display:block;font-size:11px;color:#7f9aa8;margin-top:1px}
.nav-group{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#58717e;padding:17px 18px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 14px;margin:2px 8px;cursor:pointer;color:#aebfc8;font-size:13px;border-radius:8px;transition:.15s}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.88}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.on{background:var(--nav2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #52a8d5}
.nav-item.soon{opacity:.46;cursor:default}
.nav-item.soon:hover{background:none;color:#aebfc8}
.nav-badge{margin-left:auto;font-size:9px;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.08);color:#9bb0bb;text-transform:uppercase;letter-spacing:.04em}
.side-footer{margin:18px 14px;padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:10px;color:#78919e;font-size:11px}
.main{flex:1;min-width:0}
header{height:66px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);color:var(--text);padding:0 26px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.header-title{display:flex;flex-direction:column}
header h1{font-size:15px;font-weight:650;margin:0}
.header-kicker{font-size:11px;color:var(--mut);margin-top:1px}
.sp{flex:1}
.top-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:5px 9px;border-radius:999px;font-size:11px;color:var(--mut)}
.top-chip svg{width:14px;height:14px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #cfd8df;background:#fff;padding:7px 11px;color:var(--text);transition:.15s}
button:hover{border-color:#9eafb9;background:#fbfcfd}
button.pri{background:#245f7f;color:#fff;border-color:#245f7f}
button.pri:hover{background:#1f536f}
button.gh{background:#fff;color:#344651;border-color:var(--line)}
button.sm{padding:4px 8px;font-size:12px;border-radius:6px}
button.dl{border-color:#ebcccc;color:#943e3e}
button:disabled{opacity:.45;cursor:not-allowed}
main{padding:26px;max-width:1440px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}
.page-head h2{font-size:24px;line-height:1.2;margin:0 0 5px;letter-spacing:-.02em}
.page-head p{margin:0;color:var(--mut);font-size:13px;max-width:780px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2,.card h3{font-size:15px;margin:0 0 5px;font-weight:650;display:flex;align-items:center;gap:8px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.section-title h3{margin:0;font-size:14px}
.sub{font-size:12px;color:var(--mut);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:#5c6a75;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fbfcfd}
td{padding:9px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fbfcfd}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:12px;color:#5a6771;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:8px 9px;border:1px solid #cbd5dc;border-radius:7px;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid #d9eef9;border-color:#71a9c8}
input[type=checkbox]{width:auto}
.form{background:#f8fbfd;border:1px solid #cfe0e9;border-radius:10px;padding:15px;margin-bottom:15px}
.form h3{margin:0 0 10px;font-size:14px;font-weight:650}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chk{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #cbd5dc;border-radius:8px;background:#fff;cursor:pointer;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:11px;border:1px solid #cbd5dc;background:#fff;white-space:nowrap}
.ok{background:var(--green2);border-color:#b9dfca;color:#236b4b}
.bad{background:var(--red2);border-color:#efc5c5;color:#934242}
.warn{background:var(--amber2);border-color:#efd9a6;color:#8a5b16}
.info{background:var(--blue2);border-color:#bddbea;color:#2b6685}
.err{color:#953d3d;font-size:12px;margin-top:8px;display:none}
.hint{font-size:12px;color:var(--mut);margin-top:10px}
.empty{padding:22px;text-align:center;color:var(--mut)}
.note{background:var(--amber2);border:1px solid #ecd7a7;border-radius:10px;padding:11px 13px;font-size:13px;color:#79551a;margin-bottom:14px}
.stub{background:var(--blue2);border:1px solid #c8dfeb;border-radius:10px;padding:11px 13px;font-size:13px;color:#315f78;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:9px 11px;background:none;color:#63717b}
.tabs button.on{border-bottom-color:#2f7da8;color:#1d455b;font-weight:650}
svg{display:block}
.preview-svg{background:#fbfdfe;border:1px solid var(--line);border-radius:10px}
#dirty{font-size:11px;color:#9a6616;background:#fff5df;border:1px solid #edd6a0;padding:4px 8px;border-radius:999px;display:none}

/* dashboard */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:var(--shadow)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.kpi-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--blue2);color:#2e7399}
.kpi-icon svg{width:18px;height:18px}
.kpi-num{font-size:25px;font-weight:700;line-height:1;letter-spacing:-.03em}
.kpi-label{font-size:12px;color:var(--mut);margin-top:5px}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.55fr);gap:16px}
.domain-map{padding:4px 0 2px}
.flow-row{display:flex;align-items:stretch;gap:8px}
.flow-arrow{display:flex;align-items:center;color:#9babb4;padding:0 1px}
.flow-arrow svg{width:19px;height:19px}
.domain-node{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;position:relative}
.domain-node.active{border-color:#c4ddea;background:#fbfdff}
.domain-node.planned{background:#fafbfc}
.domain-node.external{border-style:dashed;background:#fffdf8}
.domain-node .node-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px;background:#edf5f9;color:#2f759b}
.domain-node.planned .node-icon{background:#f1f3f5;color:#7b8992}
.domain-node.external .node-icon{background:#fff4d9;color:#936516}
.domain-node .node-icon svg{width:17px;height:17px}
.domain-node b{display:block;font-size:13px}
.domain-node small{display:block;color:var(--mut);font-size:11px;margin-top:3px;line-height:1.35}
.node-status{position:absolute;top:11px;right:10px;width:8px;height:8px;border-radius:50%;background:#3a9a6b}
.planned .node-status{background:#b8c1c7}
.external .node-status{background:#d49a32}
.flow-split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.phase-list{display:flex;flex-direction:column;gap:9px}
.phase-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:#fafbfc;border:1px solid var(--line2)}
.phase-num{width:25px;height:25px;border-radius:8px;background:#eaf4fa;color:#2d6d8e;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.phase-item b{font-size:12px;display:block}
.phase-item span{font-size:11px;color:var(--mut)}
.phase-item.current{border-color:#c5dfec;background:#f8fcfe}
.progress{height:6px;border-radius:20px;background:#e9eef2;overflow:hidden;margin-top:7px}
.progress>span{display:block;height:100%;border-radius:20px;background:#3e8fb7}

/* production */
.pipeline{display:flex;align-items:stretch;gap:7px;overflow-x:auto;padding:3px 0 8px}
.stage{min-width:185px;flex:1;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px}
.stage-top{display:flex;align-items:center;gap:9px}
.stage-index{width:28px;height:28px;border-radius:9px;background:#eaf4fa;color:#2f7395;display:grid;place-items:center;font-weight:700;font-size:12px}
.stage b{font-size:12px}
.stage small{display:block;color:var(--mut);font-size:10px;margin-top:1px}
.stage-machines{margin-top:10px;font-size:11px;color:#4f5e69}
.pipe-arrow{display:flex;align-items:center;color:#a5b2ba}
.pipe-arrow svg{width:18px;height:18px}
.machine-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.machine-card{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}
.machine-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.machine-ico{width:34px;height:34px;border-radius:9px;background:#f0f5f7;display:grid;place-items:center;color:#4c7488}
.machine-ico svg{width:17px;height:17px}
.machine-card b{font-size:12px}
.machine-card .code{font:10px ui-monospace,monospace;color:var(--mut)}
.machine-meta{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:10px;color:var(--mut)}
.machine-meta strong{display:block;color:#41515b;font-size:11px;font-weight:600}

/* integration */
.bridge{display:flex;align-items:stretch;gap:8px;margin:14px 0 18px}
.bridge-node{flex:1;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.bridge-node.external{border-style:dashed;background:#fffdf7}
.bridge-ico{width:38px;height:38px;border-radius:11px;background:#edf6fa;color:#2c759b;display:grid;place-items:center;margin-bottom:10px}
.bridge-node.external .bridge-ico{background:#fff3d6;color:#986914}
.bridge-ico svg{width:19px;height:19px}
.bridge-node b{font-size:13px}
.bridge-node p{font-size:11px;color:var(--mut);margin:5px 0 0}
.bridge-arrow{display:flex;align-items:center;color:#8fa2ac}
.bridge-arrow svg{width:22px;height:22px}
.return-flow{text-align:center;border-top:1px dashed #c9d3d9;margin-top:10px;padding-top:10px;color:var(--mut);font-size:11px}

/* modules */
.module-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.module-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;display:flex;gap:12px;align-items:flex-start}
.module-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#edf6fa;color:#2f789e;flex:none}
.module-icon svg{width:21px;height:21px}
.module-card h4{font-size:13px;margin:0 0 3px}
.module-card p{font-size:11px;color:var(--mut);margin:0}
.module-card .pill{margin-top:8px}
.skill-bars{display:flex;flex-direction:column;gap:9px}
.skill-line{display:grid;grid-template-columns:190px 1fr 70px;gap:10px;align-items:center;font-size:11px}
.bar-bg{height:7px;background:#edf1f4;border-radius:20px;overflow:hidden}
.bar-fill{height:100%;background:#438daf;border-radius:20px}
.card-soft{background:#fbfcfd;border:1px solid var(--line);border-radius:12px;padding:14px}
.icon-inline{display:inline-flex;vertical-align:-3px;margin-right:5px}
.icon-inline svg{width:16px;height:16px}
.skill-pillset{display:flex;flex-wrap:wrap;gap:7px}
.skill-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:#f6fafc;color:#364b57;font-size:11px;line-height:1}
.skill-badge .pill{padding:3px 7px;font-size:10px}
.skill-badge .icon-inline{margin-right:0}
.skill-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.skill-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;gap:12px;align-items:flex-start}
button.skill-card{width:100%;text-align:left;cursor:pointer;transition:.15s ease;border-color:var(--line)}
button.skill-card:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(20,42,58,.07);border-color:#bfd8e4}
button.skill-card.active{border-color:#96c6dc;background:#f4fbfe;box-shadow:0 10px 20px rgba(29,94,128,.08)}
.skill-card-icon{width:46px;height:46px;border-radius:13px;background:#edf6fa;color:#2f789e;display:grid;place-items:center;flex:none}
.skill-card-icon svg{width:22px;height:22px}
.skill-card-body{flex:1;min-width:0}
.skill-card-body b{display:block;font-size:13px;margin:0 0 4px}
.skill-card-body small{display:block;color:var(--mut);font-size:11px;line-height:1.35}
.skill-card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.skill-coverage-card .skill-card-meta .pill{font-size:10px}
.sales-skill-grid{margin:14px 0 16px}


/* language switch */
.lang-switch{display:inline-flex;align-items:center;padding:3px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;gap:2px}
.lang-switch button{border:0;background:transparent;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:650;color:var(--mut);min-width:34px}
.lang-switch button:hover{background:#fff;color:var(--text)}
.lang-switch button.on{background:#fff;color:#205d7d;box-shadow:0 1px 4px rgba(24,52,68,.12)}

@media(max-width:1050px){
 .kpi-grid{grid-template-columns:repeat(2,1fr)}
 .dashboard-grid{grid-template-columns:1fr}
 .flow-row{overflow-x:auto}.domain-node{min-width:170px}
 .bridge{overflow-x:auto}.bridge-node{min-width:210px}
}
@media(max-width:760px){
 .side{width:72px}.brand-copy,.nav-group,.nav-item span,.nav-badge,.side-footer{display:none}
 .brand{padding:17px}.brand-mark{width:36px;height:36px}
 .nav-item{justify-content:center;padding:12px;margin:4px 8px}
 main{padding:17px}header{padding:0 17px}.header-kicker,.top-chip{display:none}
 .kpi-grid{grid-template-columns:1fr 1fr}.module-cards{grid-template-columns:1fr}
 .page-head{align-items:flex-start;flex-direction:column}
 .lang-switch button{padding:4px 6px;min-width:30px}
}

.module-editor{border:1px solid #cddce5;background:#fafdff;border-radius:12px;padding:15px;margin-bottom:18px}.module-editor-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:13px}.module-editor-head h3{margin:0;font-size:15px}.module-editor-head p{margin:3px 0 0;color:var(--mut);font-size:11px}

<script>
/* ==== src/core/dim.js ==== */
/* =====================================================================
   core/dim  ·  v4.5-port
   Разбор и печать дюймовых размеров (общее для Shape и Muntin).
   IN : строка "48", "48 1/2", "48-1/2", число
   OUT: число дюймов / строка вида 48 1/2″
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.
   ===================================================================== */

/* ИСПРАВЛЕНО (авг 2026). Раньше inch() имел СВОЙ разбор, более слабый, чем
   fabParseDimStrict: "48-1/2" превращалось в 48 (дробь молча терялась), а "12abc"
   в 12. При этом сторона C читалась строгим парсером — то есть Width/Height и C
   понимали разный синтаксис. Теперь один парсер на всё; непонятный ввод = 0,
   и его ловит валидация ("Enter valid width and height"), а не тихо считает. */
function inch(t){
  if(typeof t==='number')return isFinite(t)?t:0;
  var r=fabParseDimStrict(t);
  return r.ok?r.v:0;
}
function frac64(v){
  v=+v||0;var whole=Math.floor(v+1e-9),n=Math.round((v-whole)*64);if(n===64){whole++;n=0;}
  if(!n)return String(whole);var a=n,b=64;while(b){var t=a%b;a=b;b=t;}n/=a;var d=64/a;
  return (whole?whole+' ':'')+n+'/'+d;
}
function dimIn(v){return frac64(v)+'″';}
function fabParseDimStrict(v){
  if(typeof v==='number')return isFinite(v)?{ok:true,v:v}:{ok:false,v:0};
  var t=String(v==null?'':v).trim().replace(/[\u2033\u201D"]/g,'');
  if(!t)return {ok:false,v:0,empty:true};
  var sign=1;
  if(t.charAt(0)==='-'){sign=-1;t=t.slice(1).trim();}else if(t.charAt(0)==='+'){t=t.slice(1).trim();}
  var m=t.match(/^(\d+(?:\.\d+)?)[\s-]+(\d+)\s*\/\s*(\d+)$/);
  if(m)return (+m[3])?{ok:true,v:sign*(+m[1]+(+m[2])/(+m[3]))}:{ok:false,v:0};
  m=t.match(/^(\d+)\s*\/\s*(\d+)$/);
  if(m)return (+m[2])?{ok:true,v:sign*((+m[1])/(+m[2]))}:{ok:false,v:0};
  if(/^\d+(?:\.\d+)?$/.test(t))return {ok:true,v:sign*parseFloat(t)};
  return {ok:false,v:0};
}

/* ==== src/core/poly.js ==== */
/* =====================================================================
   core/poly  ·  v4.5-port
   Полигональная геометрия: самопересечение, площадь, габарит.
   IN : массив точек [[x,y],...]
   OUT: bool / число / {minX,maxX,minY,maxY}
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.
   ===================================================================== */

function fabSegCross(p1,p2,p3,p4){
  function cr(o,a,b){return (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);}
  var e=1e-9,d1=cr(p3,p4,p1),d2=cr(p3,p4,p2),d3=cr(p1,p2,p3),d4=cr(p1,p2,p4);
  return ((d1>e&&d2<-e)||(d1<-e&&d2>e))&&((d3>e&&d4<-e)||(d3<-e&&d4>e));
}
function fabPolySelfIntersects(P){
  var n=P.length;if(n<4)return false;
  for(var i=0;i<n;i++)for(var j=i+2;j<n;j++){
    if(i===0&&j===n-1)continue;
    if(fabSegCross(P[i],P[(i+1)%n],P[j],P[(j+1)%n]))return true;
  }
  return false;
}
function fabSignedArea(P){var a=0;for(var i=0;i<P.length;i++){var j=(i+1)%P.length;a+=P[i][0]*P[j][1]-P[j][0]*P[i][1];}return a/2;}
function fabEdgeBounds(P){var xs=P.map(function(q){return q[0];}),ys=P.map(function(q){return q[1];});return {minX:Math.min.apply(null,xs),maxX:Math.max.apply(null,xs),minY:Math.min.apply(null,ys),maxY:Math.max.apply(null,ys)};}

/* ==== src/modules/shape/consts.js ==== */
/* =====================================================================
   shape/consts  ·  v4.5-port
   Константы Smart-Shape: режимы уклона, углы, порядок, цвета рёбер.
   IN : —
   OUT: константы + буквенные имена рёбер
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.
   ===================================================================== */

var SS_MODES=[{id:'m1',s1:1,s2:1},{id:'m2',s1:1,s2:-1},{id:'m3',s1:-1,s2:1},{id:'m4',s1:-1,s2:-1}];
var SS_CORNERS=[['none','None'],['single','Single'],['double','Double'],['triple','Triple']];
var SS_ORDER=['tl','tr','br','bl'];
var SS_COLORS={A:'#1a52c4',B:'#1c7a34',C:'#a84b00',D:'#9c1f88'};
var SS_EXTRA_COLORS=['#00838f','#c1362b','#6a4bbf','#8a5a1f','#0071a8','#a8447a','#5c7a1f','#7a3f8f','#a86a00','#3f6f8a','#a04040','#3f7a5f','#1f6f7a','#8f3f5f','#4f5fa8','#7a6a1f','#8a2f2f','#2f6a4f','#5f3f8a','#a05a2f','#2f5f8a','#6f8a2f','#8a4f7a','#3f8a7a'];
var SS_BAD={};

function ssMode(id){for(var i=0;i<SS_MODES.length;i++)if(SS_MODES[i].id===id)return SS_MODES[i];return null;}
function ssCornerCount(t){return t==='single'?1:t==='double'?2:t==='triple'?3:0;}
function ssCornerLabel(t){for(var i=0;i<SS_CORNERS.length;i++)if(SS_CORNERS[i][0]===t)return SS_CORNERS[i][1];return 'None';}
function ssAlpha(z){var n=z+1,s='';while(n>0){n--;s=String.fromCharCode(65+(n%26))+s;n=Math.floor(n/26);}return s;}
function ssLetter(i){return ssAlpha(i+4);}
function ssExtraColor(id){var n=0;for(var i=0;i<id.length;i++)n=n*26+(id.charCodeAt(i)-64);return SS_EXTRA_COLORS[Math.max(0,n-5)%SS_EXTRA_COLORS.length];}
function ssNum(v){var r=fabParseDimStrict(v);return r.ok?r.v:0;}
function ssNN(v){return Math.max(0,ssNum(v));}

/* ==== src/modules/shape/model.js ==== */
/* =====================================================================
   shape/model  ·  v4.5-port
   Ссылочно-стабильная нормализация модели, карта угловых рёбер, суммы по углам.
   IN : сырая модель Smart-Shape
   OUT: нормализованная модель + карта рёбер E/F/G…
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.
   ===================================================================== */

/* Ссылочно-стабильная нормализация: если модель уже корректна, возвращаем ТОТ ЖЕ объект.
   Иначе любой вызов ssModel() подменял бы объект, и записи по удержанной ссылке терялись. */
function ssIsModel(m){
  return !!(m&&typeof m==='object'&&m.corners&&m.extraEdges
    &&m.A&&m.A.elbow&&m.B&&m.B.elbow&&m.C&&m.C.elbow);
}
function ssNormalize(m){
  if(ssIsModel(m))return m;
  m=(m&&typeof m==='object')?m:{};
  var out={elbowsOn:m.elbowsOn!==false};
  ['A','B','C'].forEach(function(e){
    var s=(m[e]&&typeof m[e]==='object')?m[e]:{},el=(s.elbow&&typeof s.elbow==='object')?s.elbow:{};
    out[e]={len:s.len==null?'':String(s.len),out:s.out==null?'0':String(s.out),dir:s.dir||null,
      elbow:{to:el.to==null?'0':String(el.to),elbowLen:el.elbowLen==null?'0':String(el.elbowLen),
             past:el.past==null?'0':String(el.past),mode:el.mode||null}};
  });
  out.corners={};
  /* без модульных констант: normalizeShapeModel вызывается раньше, чем они инициализируются */
  ['tl','tr','br','bl'].forEach(function(k){var v=(m.corners||{})[k];out.corners[k]=['none','single','double','triple'].indexOf(v)>=0?v:'none';});
  out.extraEdges={};
  var ee=m.extraEdges||{};
  Object.keys(ee).forEach(function(k){out.extraEdges[k]={len:(ee[k]&&ee[k].len!=null)?String(ee[k].len):''};});
  return out;
}
function ssModel(S){if(!ssIsModel(S.shape.smart))S.shape.smart=ssNormalize(S.shape.smart);return S.shape.smart;}
/* A = высота слева (Height), B = низ (Width), C = высота справа (своё поле), D = AUTO */
function ssEdgeLen(S,e){
  if(e==='A')return Math.max(0,inch(S.h));
  if(e==='B')return Math.max(0,inch(S.w));
  var m=ssModel(S),r=fabParseDimStrict(m.C.len);
  return r.ok?Math.max(0,r.v):Math.max(0,inch(S.h));
}

/* ---------- карта угловых рёбер ---------- */
function ssEdgeMap(S){
  var m=ssModel(S),idx=0,map={},all=[];
  SS_ORDER.forEach(function(c){
    var n=ssCornerCount(m.corners[c]),arr=[];
    for(var step=0;step<n;step++){
      var v=ssLetter(idx++),h=ssLetter(idx++);
      arr.push({v:v,h:h,step:step});
      all.push({id:v,corner:c,axis:'v',step:step},{id:h,corner:c,axis:'h',step:step});
    }
    map[c]=arr;
  });
  return {map:map,all:all};
}
function ssSyncExtra(S){
  var m=ssModel(S),all=ssEdgeMap(S).all,next={};
  all.forEach(function(e){next[e.id]=m.extraEdges[e.id]||{len:''};});
  m.extraEdges=next;
}
function ssCornerTotals(S,corner){
  var m=ssModel(S),pairs=ssEdgeMap(S).map[corner]||[],vals=pairs.map(function(p){
    return {vId:p.v,hId:p.h,V:ssNN((m.extraEdges[p.v]||{}).len),H:ssNN((m.extraEdges[p.h]||{}).len)};
  });
  var v=0,h=0;vals.forEach(function(x){v+=x.V;h+=x.H;});
  return {vals:vals,v:v,h:h};
}

/* ==== src/modules/shape/contour.js ==== */
/* =====================================================================
   shape/contour  ·  v4.5-port
   Построение единого замкнутого контура: рёбра A/B/C, AUTO-D, лесенки углов.
   IN : нормализованная модель + W/H
   OUT: {pts, segs, base, sides}
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.
   ===================================================================== */

function ssEdgeLocal(S,e){
  var m=ssModel(S),s=m[e],vert=(e==='A'||e==='C'),L=ssEdgeLen(S,e);
  if(!m.elbowsOn){
    var o=ssNN(s.out);
    if(vert)return [[0,0],[s.dir==='right'?o:s.dir==='left'?-o:0,L]];
    return [[0,0],[L,s.dir==='up'?o:s.dir==='down'?-o:0]];
  }
  var E=s.elbow,to=ssNN(E.to),past=ssNN(E.past),h=Math.min(ssNN(E.elbowLen),L),M=ssMode(E.mode)||{s1:0,s2:0};
  var o1=M.s1*to,o2=o1+M.s2*past,coll=(h<=1e-9||h>=L-1e-9);
  if(vert)return coll?[[0,0],[o2,L]]:[[0,0],[o1,h],[o2,L]];
  return coll?[[0,0],[L,o2]]:[[0,0],[h,o1],[L,o2]];
}
function ssOff(P,o){return P.map(function(p){return [p[0]+o[0],p[1]+o[1]];});}
function ssBase(S){
  var BL=[0,0],
      Ap=ssOff(ssEdgeLocal(S,'A'),BL),AT=Ap[Ap.length-1],
      Bp=ssOff(ssEdgeLocal(S,'B'),BL),BR=Bp[Bp.length-1],
      Cp=ssOff(ssEdgeLocal(S,'C'),BR),CT=Cp[Cp.length-1];
  return {BL:BL,AT:AT,BR:BR,CT:CT,Ap:Ap,Bp:Bp,Cp:Cp,Dp:[AT,CT],
    Dlen:Math.abs(CT[0]-AT[0]),Dsigned:CT[0]-AT[0],Dout:Math.abs(CT[1]-AT[1]),
    Dtrue:Math.hypot(CT[0]-AT[0],CT[1]-AT[1]),
    DdirY:(CT[1]-AT[1])>1e-9?'up':(CT[1]-AT[1])<-1e-9?'down':null};
}
function ssPointAt(P,ax,val){
  for(var i=0;i<P.length-1;i++){
    var a=P[i],b=P[i+1],lo=Math.min(a[ax],b[ax]),hi=Math.max(a[ax],b[ax]);
    if(val>=lo-1e-9&&val<=hi+1e-9){
      var t=(b[ax]-a[ax])===0?0:(val-a[ax])/(b[ax]-a[ax]);
      return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
    }
  }
  var f=P[0],l=P[P.length-1];
  return Math.abs(val-f[ax])<Math.abs(val-l[ax])?[f[0],f[1]]:[l[0],l[1]];
}
function ssSpan(P,ax,from,to){
  var p0=ssPointAt(P,ax,from),p1=ssPointAt(P,ax,to),lo=Math.min(from,to)+1e-9,hi=Math.max(from,to)-1e-9;
  var mids=P.filter(function(p){return p[ax]>lo&&p[ax]<hi;}).slice();
  mids.sort(function(a,b){return from<to?a[ax]-b[ax]:b[ax]-a[ax];});
  return [p0].concat(mids,[p1]);
}
var SS_CG={tl:{h:[1,0],v:[0,-1],rev:false},tr:{h:[-1,0],v:[0,-1],rev:true},
           br:{h:[-1,0],v:[0,1],rev:false},bl:{h:[1,0],v:[0,1],rev:true}};
function ssStairs(S,corner,vertex,pVert,pHoriz){
  var T=ssCornerTotals(S,corner);
  if(!T.vals.length)return [];
  var g=SS_CG[corner];
  function P(dx,dy){return [vertex[0]+g.h[0]*dx+g.v[0]*dy,vertex[1]+g.h[1]*dx+g.v[1]*dy];}
  var pts=[P(0,T.v)],ids=[],dx=0,dy=T.v;
  T.vals.forEach(function(s){dx+=s.H;pts.push(P(dx,dy));ids.push(s.hId);dy-=s.V;pts.push(P(dx,dy));ids.push(s.vId);});
  pts[0]=[pVert[0],pVert[1]];
  pts[pts.length-1]=[pHoriz[0],pHoriz[1]];
  var segs=ids.map(function(id,i){return {id:id,p1:pts[i],p2:pts[i+1]};});
  if(g.rev)segs=segs.slice().reverse().map(function(s){return {id:s.id,p1:s.p2,p2:s.p1};});
  return segs;
}
/* Единый замкнутый контур + пути сторон в терминах приложения */
function ssContour(S){
  var G=ssBase(S),T={tl:ssCornerTotals(S,'tl'),tr:ssCornerTotals(S,'tr'),br:ssCornerTotals(S,'br'),bl:ssCornerTotals(S,'bl')};
  var dD=G.Dsigned>=0?1:-1,dB=-1;
  var spanA=ssSpan(G.Ap,1,G.BL[1]+T.bl.v,G.AT[1]-T.tl.v),
      spanD=ssSpan(G.Dp,0,G.AT[0]+dD*T.tl.h,G.CT[0]-dD*T.tr.h),
      spanC=ssSpan(G.Cp.slice().reverse(),1,G.CT[1]-T.tr.v,G.BR[1]+T.br.v),
      spanB=ssSpan(G.Bp.slice().reverse(),0,G.BR[0]+dB*T.br.h,G.BL[0]-dB*T.bl.h);
  var segs=[];
  function push(P,id){for(var i=0;i<P.length-1;i++)segs.push({id:id,p1:P[i],p2:P[i+1]});}
  push(spanA,'A');
  segs=segs.concat(ssStairs(S,'tl',G.AT,spanA[spanA.length-1],spanD[0]));
  push(spanD,'D');
  segs=segs.concat(ssStairs(S,'tr',G.CT,spanC[0],spanD[spanD.length-1]));
  push(spanC,'C');
  segs=segs.concat(ssStairs(S,'br',G.BR,spanC[spanC.length-1],spanB[0]));
  push(spanB,'B');
  segs=segs.concat(ssStairs(S,'bl',G.BL,spanA[0],spanB[spanB.length-1]));
  segs=segs.filter(function(s){return Math.hypot(s.p2[0]-s.p1[0],s.p2[1]-s.p1[1])>1e-9;});
  var pts=[];
  if(segs.length){
    pts.push(segs[0].p1);
    segs.forEach(function(s){pts.push(s.p2);});
    var a=pts[0],b=pts[pts.length-1];
    if(Math.abs(a[0]-b[0])<1e-9&&Math.abs(a[1]-b[1])<1e-9)pts.pop();
  }
  /* стороны приложения: bottom=B, right=C, top=D, left=A, в порядке обхода */
  return {pts:pts,segs:segs,base:G,
    sides:{bottom:spanB.slice().reverse(),right:spanC.slice().reverse(),top:spanD.slice().reverse(),left:spanA.slice().reverse()}};
}

/* ==== src/modules/shape/validate.js ==== */
/* =====================================================================
   shape/validate  ·  v4.5-port
   Валидация Smart-Shape: размеры, локти, угловые блоки, самопересечение.
   IN : линия Shape S
   OUT: {errors[], warns[]}
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.
   ===================================================================== */

function ssValidate(S){
  var m=ssModel(S),errors=[],warns=[];
  ['A','B','C'].forEach(function(e){
    var L=ssEdgeLen(S,e),nm=(e==='A'?'A (left / Height)':e==='B'?'B (bottom / Width)':'C (right)');
    if(!(L>0)){errors.push('Edge '+nm+': length must be greater than 0.');return;}
    if(e==='C'){var rc=fabParseDimStrict(m.C.len);if(m.C.len!==''&&!rc.ok)errors.push('Edge C: "'+m.C.len+'" is not a valid dimension.');}
    if(!m.elbowsOn){
      var ro=fabParseDimStrict(m[e].out);
      if(m[e].out!==''&&!ro.ok)errors.push('Edge '+e+': out of plumb / level "'+m[e].out+'" is not a valid dimension.');
      else if(ro.ok&&ro.v<0)errors.push('Edge '+e+': out of plumb / level cannot be negative.');
      else if(ro.ok&&ro.v>0&&!m[e].dir)errors.push('Edge '+e+': pick which way it is out of plumb / level.');
      return;

const _textOriginal=new WeakMap();
function tx(value){
 const raw=String(value??'');
 if(LANG!=='en') return raw;
 const m=raw.match(/^(\s*)([\s\S]*?)(\s*)$/);
 const lead=m?m[1]:'', core=m?m[2]:raw, tail=m?m[3]:'';
 if(I18N_EN[core]!==undefined) return lead+I18N_EN[core]+tail;
 let x=core;
 let mm;
 if((mm=x.match(/^станций заведено · (\d+) с уровнем потока$/))) x=`stations added · ${mm[1]} with flow level`;
 else if((mm=x.match(/^контуров Shape · (\d+) схем Muntin$/))) x=`Shape contours · ${mm[1]} Muntin layouts`;
 else if((mm=x.match(/^(\d+(?:\.\d+)?)[–-](\d+(?:\.\d+)?) мм$/))) x=`${mm[1]}–${mm[2]} mm`;
 else if((mm=x.match(/^(\d+) станц\.$/))) x=`${mm[1]} stations`;
 else if((mm=x.match(/^(\d+) станций$/))) x=`${mm[1]} stations`;
 else if((mm=x.match(/^(\d+) без уровня$/))) x=`${mm[1]} without level`;
 else if((mm=x.match(/^(\d+) точек$/))) x=`${mm[1]} points`;
 else if((mm=x.match(/^(\d+) чел\.$/))) x=`${mm[1]} people`;
 else if((mm=x.match(/^(\d+) человека$/))) x=`${mm[1]} people`;
 else if((mm=x.match(/^(\d+) бар · (.+)$/))) x=`${mm[1]} bars · ${mm[2]}`;
 else if((mm=x.match(/^(\d+) бар, суммарно (.+)$/))) x=`${mm[1]} bars, total ${mm[2]}`;
 else if((mm=x.match(/^Габарит: (.+)$/))) x=`Size: ${mm[1]}`;
 else if((mm=x.match(/^(\d+) станци(?:я|и|й)$/))) x=`${mm[1]} stations`;
 // Translate longer phrases even when punctuation or inline <code>/<b> splits a sentence.
 if(x===core){
   const keys=Object.keys(I18N_EN).filter(k=>k.length>=14 && core.includes(k)).sort((a,b)=>b.length-a.length);
   for(const k of keys) x=x.split(k).join(I18N_EN[k]);
 }
 return lead+x+tail;
}
function applyLang(root=document.body){
 document.documentElement.lang=LANG;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 let node;
 while(node=walker.nextNode()){
   const parent=node.parentElement;
   if(!parent || ['SCRIPT','STYLE'].includes(parent.tagName)) continue;
   /* data-raw = значение, введённое пользователем. Переводить его нельзя:
      RU/EN обязан менять интерфейс, а не содержимое базы. */
   if(parent.closest('[data-raw]')) continue;
   if(!_textOriginal.has(node)) _textOriginal.set(node,node.nodeValue);
   const original=_textOriginal.get(node);
   node.nodeValue = LANG==='en' ? tx(original) : original;
 }
 document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.title=LANG==='en'?tx(el.dataset.i18nTitle):el.dataset.i18nTitle; });

/* =====================================================================
   erp/nav  ·  erp-1.0
   Меню по доменам + маршрутизация вкладок + render().
   IN : tab / subtab
   OUT: DOM
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.
   ===================================================================== */

const NAV=[
 {group:'Обзор'},
 {k:'dashboard', label:'Главная', icon:'home'},
 {group:'Ядро'},
 {k:'users', label:'Пользователи', icon:'users'},
 {group:'Операции'},
 {k:'sales', label:'Продажи / конфигурация', icon:'sales'},
 {k:'optimization', label:'Оптимизация', icon:'optimize'},
 {k:'production', label:'Производство', icon:'factory'},
 {group:'Домены — далее'},
 {k:'inventory', label:'Склад', icon:'inventory', soon:1},
 {k:'purchasing', label:'Закупки', icon:'purchase', soon:1},
 {k:'shipping', label:'Отгрузка', icon:'shipping', soon:1},
 {k:'finance', label:'Финансы', icon:'finance', soon:1}
];
let tab='dashboard';

function renderNav(){
 document.getElementById('side').innerHTML =
  `<div class="brand"><div class="brand-mark">${ico('layers')}</div><div class="brand-copy"><b>GLASS ERP</b><span>production system · bilingual concept</span></div></div>` +
  NAV.map(n=>{
   if(n.group) return `<div class="nav-group">${n.group}</div>`;
   if(n.soon) return `<div class="nav-item soon">${ico(n.icon)} <span>${n.label}</span><span class="nav-badge">план</span></div>`;
   return `<div class="nav-item ${tab===n.k?'on':''}" onclick="tab='${n.k}';subtab=null;render()">${ico(n.icon)} <span>${n.label}</span></div>`;
  }).join('') +
  `<div class="side-footer">Фаза 1 · Фундамент<br>Spil остаётся источником работы до прохождения контрольных фаз.</div>`;
}

let subtab=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ИСПРАВЛЕНО (авг 2026): данные, которые ввёл пользователь, переводчику не отдаём.
   applyLang ходит по ВСЕМ текстовым узлам, поэтому станция с названием «Закалка»
   в EN превращалась в «Tempering» — то есть RU/EN менял сами данные, а не интерфейс.
   raw() помечает узел атрибутом data-raw, и переводчик его пропускает.
   Для <option> тот же смысл даёт атрибут data-raw прямо на теге.

   Исключение — строки, которые засеяли МЫ (дефолтный каталог станций и уровней):
   их перевод остаётся, иначе в EN каталог по умолчанию был бы русским. Как только
   пользователь переименует запись — значение перестаёт совпадать с засеянным
   и дальше не переводится никогда. */
const SEED_TEXT=new Set([].concat(
 (DEFAULT.station||[]).map(s=>s.name), (DEFAULT.station||[]).map(s=>s.note),
 (DEFAULT.level||[]).map(l=>l.label)
).filter(Boolean));
const raw=s=>{s=String(s??'');
 /* засеянное значение оборачиваем в свой <span>: так оно становится отдельным
    текстовым узлом и попадает в словарь целиком, а не куском чужой фразы */
 return SEED_TEXT.has(s)?`<span>${esc(s)}</span>`:`<span data-raw>${esc(s)}</span>`;};
const fail=(el,m)=>{el.textContent=tx(m);el.style.display='block';};

function render(){
 renderNav();
 document.getElementById('dirty').style.display=dirty?'inline-flex':'none';
 const meta={
  dashboard:['Обзор системы','Карта ERP и текущий статус'],
  users:['Пользователи','Роли, станции и покрытие навыков'],
  sales:['Продажи / конфигурация','Изолированные модули Shape и Muntinbar'],
  optimization:['Оптимизация','Мост данных к Perfect Cut'],
  production:['Производство','Поток цеха, станции и уровни']
 }[tab]||['ERP Glazing System','Производственная система'];
 document.getElementById('hdr').textContent=meta[0];
 document.getElementById('hdrSub').textContent=meta[1];
 document.getElementById('phaseChip').innerHTML=ico('activity','icon-inline')+'Фаза 1 · фундамент';
 const V={dashboard:viewDashboard,users:viewUsers, sales:viewSales, optimization:viewOptimization, production:viewProduction}[tab];
 document.getElementById('app').innerHTML = V ? V() : '<div class="empty">модуль в плане</div>';
 afterRender();
}

let uEdit=null, uDraft=null;
function viewUsers(){
 if(!subtab || !['list','report'].includes(subtab)) subtab='list';
 const covered=SKILLS.filter(skill=>DB.user.some(u=>(u.skills||[]).map(normSkill).some(x=>x.skill===skill))).length;
 return `<div class="page-head"><div><h2>Команда и доступ к производству</h2><p>Кто работает в системе, к какой станции привязан и какие операции умеет выполнять. Права по модулям и полям будут отдельным слоем.</p></div><span class="pill info">${ico('lock','icon-inline')}права — следующий шаг</span></div>
  <div class="kpi-grid">
   <div class="kpi"><div class="kpi-top"><div class="kpi-icon">${ico('users')}</div></div><div class="kpi-num">${DB.user.length}</div><div class="kpi-label">пользователей</div></div>
   <div class="kpi"><div class="kpi-top"><div class="kpi-icon">${ico('factory')}</div></div><div class="kpi-num">${DB.user.filter(u=>u.station).length}</div><div class="kpi-label">привязано к станции</div></div>
   <div class="kpi"><div class="kpi-top"><div class="kpi-icon">${ico('check')}</div></div><div class="kpi-num">${covered}/${SKILLS.length}</div><div class="kpi-label">типов навыков покрыто</div></div>
   <div class="kpi"><div class="kpi-top"><div class="kpi-icon">${ico('alert')}</div></div><div class="kpi-num">${SKILLS.length-covered}</div><div class="kpi-label">навыков без носителя</div></div>
  </div>
  <div class="card">
   <div class="tabs">
    <button class="${subtab==='list'?'on':''}" onclick="subtab='list';render()">Пользователи</button>
    <button class="${subtab==='report'?'on':''}" onclick="subtab='report';render()">Покрытие навыков</button>
   </div>
   ${subtab==='report'?skillReport():viewUsersList()}
  </div>`;
}
function viewUsersList(){
 const rows=DB.user.map((u,i)=>{
  const st=DB.station.find(s=>s.code===u.station);
  const skillPills=(u.skills||[]).map(skillBadgeHTML).join(' ');
  return `<tr><td><b>${raw(u.name)}</b></td><td>${esc(u.role)}</td>
   <td class="mono">${st?raw(st.code+' — '+st.name):'<span class="mut">не назначена</span>'}</td>
   <td>${skillPills||'<span class="mut">—</span>'}</td>
   <td style="white-space:nowrap"><button class="sm" onclick="uEdit=${i};uDraft=JSON.parse(JSON.stringify(DB.user[${i}]));uDraft.skills=(uDraft.skills||[]).map(normSkill);render()">Изменить</button>
   <button class="sm dl" onclick="delUser(${i})">×</button></td></tr>`;
 }).join('');
 return `${uEdit!==null?userForm():''}
  <table><thead><tr><th>Имя</th><th>Роль</th><th>Станция</th><th>Навыки</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="5" class="empty">пусто</td></tr>'}</tbody></table>
  ${uEdit!==null?'':'<div class="row"><button class="pri" onclick="uEdit=\'new\';uDraft={name:\'\',role:ROLES[0],station:\'\',skills:[]};render()">Добавить пользователя</button></div>'}`;
}
function userForm(){
 const r = uDraft;
 return `<div class="form"><h3>${uEdit==='new'?'Новый пользователь':'Изменение'}</h3>
  <div class="grid">
   <div><label>Имя *</label><input id="u_name" value="${esc(r.name||'')}" oninput="uDraft.name=this.value"></div>
   <div><label>Роль *</label><select id="u_role" onchange="uDraft.role=this.value">${ROLES.map(x=>`<option ${x===r.role?'selected':''}>${x}</option>`).join('')}</select></div>
   <div><label>Станция по умолчанию</label><select id="u_station" onchange="uDraft.station=this.value||null"><option value="">— нет —</option>
    ${DB.station.map(s=>`<option value="${s.code}" ${s.code===r.station?'selected':''}>${esc(s.code)} — ${SEED_TEXT.has(s.name)&&LANG==='en'?tx(s.name):esc(s.name)}</option>`).join('')}</select></div>
  </div>
  <div style="margin-top:12px"><label>Навыки и уровень владения</label>
   <div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">
   ${SKILLS.map(s=>{
     const entry=(r.skills||[]).find(x=>x.skill===s);
     return `<div style="display:flex;align-items:center;gap:8px">
      <label class="chk" style="min-width:230px"><input type="checkbox" ${entry?'checked':''} onchange="toggleUserSkill('${esc(s)}',this.checked)"> ${esc(s)}</label>
      ${entry?`<select onchange="setUserSkillLevel('${esc(s)}',this.value)">${SKILL_LEVELS.map(l=>`<option ${l===entry.level?'selected':''}>${l}</option>`).join('')}</select>`:'<span class="mut" style="font-size:12px">не отмечено</span>'}
     </div>`;
   }).join('')}
   </div>
  </div>
  <div class="err" id="e_user"></div>
  <div class="row"><button class="pri" onclick="saveUser()">Сохранить</button><button onclick="uEdit=null;uDraft=null;render()">Отмена</button></div></div>`;
}
function toggleUserSkill(skill, checked){
 if(!uDraft.skills) uDraft.skills=[];
 if(checked){ if(!uDraft.skills.some(x=>x.skill===skill)) uDraft.skills.push({skill, level:'Новичок'}); }
 else { uDraft.skills=uDraft.skills.filter(x=>x.skill!==skill); }
 render();
}
function setUserSkillLevel(skill, level){
 const e=uDraft.skills.find(x=>x.skill===skill); if(e) e.level=level;
}
function saveUser(){
 const e=document.getElementById('e_user'); e.style.display='none';
 uDraft.name=(uDraft.name||'').trim();
 if(!uDraft.name) return fail(e,'Укажи имя');
 if(uEdit==='new') DB.user.push(uDraft); else Object.assign(DB.user[uEdit],uDraft);
 uEdit=null; uDraft=null; touch(); render();
}
function delUser(i){ if(!confirm('Удалить пользователя?'))return; DB.user.splice(i,1); touch(); render(); }

/* --- отчёт: свод по навыкам всех людей сразу, чекбоксы этого не умеют,
   поэтому это отдельный экран, а не ещё одна колонка в списке --- */
function skillReport(){
 const cards=SKILLS.map(skill=>{
  const people=DB.user.filter(u=>(u.skills||[]).map(normSkill).some(x=>x.skill===skill));
  const pct=DB.user.length?Math.min(100,Math.round(people.length/DB.user.length*100)):0;
  const byLevel={}; SKILL_LEVELS.forEach(l=>byLevel[l]=[]);
  DB.user.forEach(u=>{const e=(u.skills||[]).map(normSkill).find(x=>x.skill===skill);if(e) byLevel[e.level].push(u.name);});
  const total=SKILL_LEVELS.reduce((s,l)=>s+byLevel[l].length,0), cls=total===0?'bad':total===1?'warn':'ok';
  return `<div class="skill-card skill-coverage-card"><div class="skill-card-icon">${ico(skillIconName(skill))}</div><div class="skill-card-body"><b>${esc(skill)}</b><small>${total===0?'нет носителя':total===1?'риск: 1 человек':total+' человека'}</small><div class="bar-bg" style="margin-top:9px"><div class="bar-fill" style="width:${pct}%"></div></div><div class="skill-card-meta">${SKILL_LEVELS.map(l=>`<span class="pill ${byLevel[l].length?'info':''}">${esc(l)} · ${byLevel[l].length}</span>`).join(' ')}</div></div></div>`;
 }).join('');
 const rows=SKILLS.map(skill=>{
  const byLevel={}; SKILL_LEVELS.forEach(l=>byLevel[l]=[]);
  DB.user.forEach(u=>{const e=(u.skills||[]).map(normSkill).find(x=>x.skill===skill);if(e) byLevel[e.level].push(u.name);});
  const total=SKILL_LEVELS.reduce((s,l)=>s+byLevel[l].length,0), cls=total===0?'bad':total===1?'warn':'ok';
  return `<tr><td><b>${esc(skill)}</b></td>${SKILL_LEVELS.map(l=>`<td>${byLevel[l].length?byLevel[l].map(raw).join(', '):'<span class="mut">—</span>'}</td>`).join('')}<td><span class="pill ${cls}">${total===0?'нет носителя':total===1?'риск: 1 человек':total+' человека'}</span></td></tr>`;
 }).join('');
 return `<div class="sub">Сначала визуальный слой — видно пробелы в компетенциях. Ниже остаётся точная матрица по уровням.</div>
  <div class="skill-card-grid" style="margin-bottom:14px">${cards}</div>
  <table><thead><tr><th>Навык</th>${SKILL_LEVELS.map(l=>`<th>${l}</th>`).join('')}<th>Покрытие</th></tr></thead><tbody>${rows}</tbody></table>`;
}

   Поток по уровням, станции/машины, CRUD.
   IN : DB.station / DB.level
   OUT: html
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.
   ===================================================================== */

function viewProduction(){
 if(!subtab) subtab='stations';
 const levels=[...DB.level].sort((a,b)=>a.n-b.n);
 const pipeline=levels.map((l,i)=>{
   const machines=DB.station.filter(s=>s.level===l.n);
   return `${i?`<div class="pipe-arrow">${ico('arrow')}</div>`:''}<div class="stage"><div class="stage-top"><div class="stage-index">${l.n}</div><div><b>${raw(l.label)}</b><small>${machines.length} станц.</small></div></div><div class="stage-machines">${machines.length?machines.map(s=>`<span class="pill" data-raw>${esc(s.code)}</span>`).join(' '):'<span class="mut">машины не назначены</span>'}</div></div>`;
 }).join('');
 const orphan=DB.station.filter(s=>s.level===null || s.level==='');
 return `<div class="page-head"><div><h2>Производственный поток</h2><p>Уровень — не просто цифра в таблице. Это место станции в маршруте детали через цех. Ниже поток виден как процесс, а таблица остаётся для точного редактирования.</p></div><span class="pill info">${ico('factory','icon-inline')}${DB.station.length} станций</span></div>
  <div class="card">
   <div class="section-title"><h3>Маршрут по уровням</h3><span class="pill ${orphan.length?'warn':'ok'}">${orphan.length?orphan.length+' без уровня':'все назначены'}</span></div>
   <div class="pipeline">${pipeline}</div>
   ${orphan.length?`<div class="note" style="margin-top:10px">Без уровня: ${orphan.map(s=>`<b>${raw(s.code)}</b> — ${raw(s.name)}`).join('; ')}. Их позицию в маршруте не угадываем.</div>`:''}
  </div>
  <div class="card">
   <div class="tabs"><button class="${subtab==='stations'?'on':''}" onclick="subtab='stations';render()">Станции / машины</button><button class="${subtab==='levels'?'on':''}" onclick="subtab='levels';render()">Уровни потока</button></div>
   ${subtab==='stations'?viewStations():viewLevels()}
  </div>`;
}
let stEdit=null;
function viewStations(){
 const machineCards=DB.station.map(s=>{
  const lv=DB.level.find(l=>l.n===s.level);
  const icon=s.code.includes('FURN')?'furnace':s.code.includes('CNC')?'cnc':s.code.includes('EDGE')||s.code.includes('BEVEL')?'edge':'cut';
  return `<div class="machine-card"><div class="machine-head"><div class="machine-ico">${ico(icon)}</div><div><b>${raw(s.name)}</b><div class="code" data-raw>${esc(s.code)}</div></div></div><div class="machine-meta"><div><span>Поток</span><strong>${lv?lv.n+' · '+raw(lv.label):'не назначен'}</strong></div><div><span>Габарит</span><strong>${s.maxW?s.maxW+' × '+s.maxL+' in':'—'}</strong></div><div><span>Толщина</span><strong>${s.minTh??'—'}–${s.maxTh??'—'} mm</strong></div><div><span>Статус</span><strong>${lv?'в маршруте':'требует решения'}</strong></div></div></div>`;
 }).join('');
 const rows=DB.station.map((s,i)=>{
  const lv=DB.level.find(l=>l.n===s.level);
  return `<tr><td class="mono"><b>${raw(s.code)}</b></td><td>${raw(s.name)}</td>
   <td>${lv?`<span class="pill info">${lv.n} · ${raw(lv.label)}</span>`:'<span class="bad pill">не назначен</span>'}</td>
   <td class="mono">${s.maxW?s.maxW+' × '+s.maxL:'<span class="mut">—</span>'}</td>
   <td class="mono">${s.minTh}–${s.maxTh} мм</td>
   <td class="mut" style="max-width:220px">${raw(s.note||'')}</td>
   <td style="white-space:nowrap"><button class="sm" onclick="stEdit=${i};render()">Изменить</button>
   <button class="sm dl" onclick="delStation(${i})">×</button></td></tr>`;
 }).join('');
 return `${stEdit!==null?stationForm():''}
  <div class="machine-grid">${machineCards}</div>
  <div class="section-title" style="margin-top:18px"><h3>Точная таблица станций</h3><span class="mut" style="font-size:11px">CRUD сохранён</span></div>
  <table><thead><tr><th>Код</th><th>Название</th><th>Уровень</th><th>Габарит, in</th><th>Толщина</th><th>Примечание</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="7" class="empty">пусто</td></tr>'}</tbody></table>
  ${stEdit!==null?'':'<div class="row"><button class="pri" onclick="stEdit=\'new\';render()">Добавить станцию</button></div>'}`;
}
function stationForm(){
 const r = stEdit==='new' ? {code:'',name:'',level:'',maxW:'',maxL:'',minTh:'',maxTh:'',note:''} : DB.station[stEdit];
 return `<div class="form"><h3>${stEdit==='new'?'Новая станция':'Изменение'}</h3>
  <div class="grid">
   <div><label>Код *</label><input id="st_code" value="${esc(r.code)}"></div>
   <div><label>Название *</label><input id="st_name" value="${esc(r.name)}"></div>
   <div><label>Уровень</label><select id="st_level"><option value="">— не назначен —</option>
    ${DB.level.map(l=>`<option value="${l.n}" ${l.n===r.level?'selected':''}>${l.n} · ${SEED_TEXT.has(l.label)&&LANG==='en'?tx(l.label):esc(l.label)}</option>`).join('')}</select></div>
   <div><label>Макс. ширина, in</label><input id="st_maxW" type="number" value="${r.maxW??''}"></div>
   <div><label>Макс. длина, in</label><input id="st_maxL" type="number" value="${r.maxL??''}"></div>
   <div><label>Мин. толщина, мм</label><input id="st_minTh" type="number" value="${r.minTh??''}"></div>
   <div><label>Макс. толщина, мм</label><input id="st_maxTh" type="number" value="${r.maxTh??''}"></div>
  </div>
  <div style="margin-top:12px"><label>Примечание</label><input id="st_note" value="${esc(r.note||'')}"></div>
  <div class="err" id="e_station"></div>
  <div class="row"><button class="pri" onclick="saveStation()">Сохранить</button><button onclick="stEdit=null;render()">Отмена</button></div></div>`;
}
function saveStation(){
 const e=document.getElementById('e_station'); e.style.display='none';
 const code=document.getElementById('st_code').value.trim().toUpperCase();
 const name=document.getElementById('st_name').value.trim();
 if(!code||!name) return fail(e,'Код и название обязательны');
 if(DB.station.some((s,i)=>i!==stEdit && s.code===code)) return fail(e,'Такой код уже есть');
 const g=id=>{const v=document.getElementById(id).value; return v===''?null:+v;};
 const o={code,name, level:g('st_level'), maxW:g('st_maxW'), maxL:g('st_maxL'),
  minTh:g('st_minTh'), maxTh:g('st_maxTh'), note:document.getElementById('st_note').value.trim()};
 if(stEdit==='new') DB.station.push(o); else Object.assign(DB.station[stEdit],o);
 stEdit=null; touch(); render();
}
function delStation(i){
 const s=DB.station[i];
 if(DB.user.some(u=>u.station===s.code)) return alert('Нельзя удалить — на станцию назначены пользователи');
 if(!confirm('Удалить станцию?'))return; DB.station.splice(i,1); touch(); render();
}

let lvEdit=null;
function viewLevels(){
 const rows=DB.level.map((l,i)=>{   /* DB.level держим отсортированным при записи, не в рендере */
  const cnt=DB.station.filter(s=>s.level===l.n).length;
  return `<tr><td class="mono"><b>${l.n}</b></td><td>${raw(l.label)}</td>
   <td class="mut">${cnt} станци${cnt===1?'я':cnt>=2&&cnt<=4?'и':'й'}</td>
   <td style="white-space:nowrap"><button class="sm" onclick="lvEdit=${i};render()">Изменить</button>
   <button class="sm dl" onclick="delLevel(${i})">×</button></td></tr>`;
 }).join('');
 return `${lvEdit!==null?levelForm():''}
  <table><thead><tr><th>№</th><th>Название этапа</th><th>Станций</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="4" class="empty">пусто</td></tr>'}</tbody></table>
  ${lvEdit!==null?'':'<div class="row"><button class="pri" onclick="lvEdit=\'new\';render()">Добавить уровень</button></div>'}
  <div class="hint">Список открытый — добавляй уровни по мере того, как появляются новые этапы (закалка, мойка, сборка стеклопакета и т.д.).</div>`;
}
function levelForm(){
 const r = lvEdit==='new' ? {n:(Math.max(0,...DB.level.map(l=>l.n))+1), label:''} : DB.level[lvEdit];
 return `<div class="form"><h3>${lvEdit==='new'?'Новый уровень':'Изменение'}</h3>
  <div class="grid"><div><label>Номер *</label><input id="lv_n" type="number" value="${r.n}"></div>
  <div><label>Название этапа *</label><input id="lv_label" value="${esc(r.label)}"></div></div>
  <div class="err" id="e_level"></div>
  <div class="row"><button class="pri" onclick="saveLevel()">Сохранить</button><button onclick="lvEdit=null;render()">Отмена</button></div></div>`;
}
function saveLevel(){
 const e=document.getElementById('e_level'); e.style.display='none';
 const n=+document.getElementById('lv_n').value, label=document.getElementById('lv_label').value.trim();
 if(!n||!label) return fail(e,'Заполни номер и название');
 if(DB.level.some((l,i)=>i!==lvEdit && l.n===n)) return fail(e,'Такой номер уже есть');
 if(lvEdit==='new') DB.level.push({n,label});
 else{
  /* ИСПРАВЛЕНО (авг 2026): смена номера уровня раньше молча осиротляла станции —
     удалять уровень со станциями запрещено, а переименовать его в другой номер
     было можно, и station.level указывал в пустоту. Тянем станции за уровнем. */
  const was=DB.level[lvEdit].n;
  Object.assign(DB.level[lvEdit],{n,label});
  if(was!==n) DB.station.forEach(s=>{ if(s.level===was) s.level=n; });
 }
 DB.level.sort((a,b)=>a.n-b.n);
 lvEdit=null; touch(); render();
}
function delLevel(i){
 const l=DB.level[i];
 if(DB.station.some(s=>s.level===l.n)) return alert('Нельзя удалить — на этот уровень назначены станции');
 if(!confirm('Удалить уровень?'))return; DB.level.splice(i,1); touch(); render();
}

/* ==== src/erp/storage.js ==== */
/* =====================================================================
   erp/storage  ·  erp-1.0
   localStorage, экспорт/импорт JSON, старт приложения.
   IN : —
   OUT: —
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.
   ===================================================================== */

function afterRender(){applyLang(document.body)}
function touch(){dirty=true; try{localStorage.setItem('glazing_system_v1',JSON.stringify(DB));}catch(e){}}
function doExport(){
 const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='glazing_system_data.json'; a.click();
 URL.revokeObjectURL(a.href); dirty=false; render();
}
function doImport(inp){
 const f=inp.files[0]; if(!f) return; const r=new FileReader();
 r.onload=()=>{ try{ mergeState(JSON.parse(r.result)); normalizeDB(); touch(); render(); }
  catch(e){ alert('Файл не читается: '+e.message); } };
 r.readAsText(f); inp.value='';
}
/* ИСПРАВЛЕНО (авг 2026). Раньше здесь был Object.assign(DB, JSON.parse(s)) —
   в DB попадало ЛЮБОЕ содержимое ключа, включая null вместо массива, и
   normalizeUsers() падал на .forEach. Результат: пустой белый экран без
   единого сообщения, и починить его можно было только через DevTools.
   Тот же ключ localStorage использовала предыдущая оболочка прототипа,
   так что чужая структура данных там вполне реальна. */
function mergeState(src){
 if(!src||typeof src!=='object')return;
 Object.keys(DEFAULT).forEach(k=>{
  const v=src[k];
  if(Array.isArray(DEFAULT[k])){ if(Array.isArray(v)) DB[k]=v; }
  else if(v!=null) DB[k]=v;
 });
}
function normalizeDB(){
 Object.keys(DEFAULT).forEach(k=>{ if(Array.isArray(DEFAULT[k])&&!Array.isArray(DB[k])) DB[k]=JSON.parse(JSON.stringify(DEFAULT[k])); });
 normalizeStations();
 normalizeUsers();
 normalizeSalesModules();
}
function boot(){
 try{ const s=localStorage.getItem('glazing_system_v1'); if(s) mergeState(JSON.parse(s)); }
 catch(e){ console.warn('localStorage не прочитан, стартуем с дефолтов:',e.message); }
 try{ normalizeDB(); }
 catch(e){ console.warn('данные не нормализуются, откат на дефолты:',e.message); DB=JSON.parse(JSON.stringify(DEFAULT)); normalizeDB(); }
 render();
}
boot();

</script>

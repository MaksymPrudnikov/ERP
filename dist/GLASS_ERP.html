<!DOCTYPE html>
<!--
  GLASS ERP — Glazing System
  СБОРКА — не редактировать руками. Детерминированно собрано из src/ через build/build.js.
  Правки вносить в отдельные модули src/**, затем: node build/build.js
  Состав сборки: 45 модулей, 2 стиля.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLASS ERP — Glazing System</title>
<style>
/* ---- src/styles/base.css ---- */
*{box-sizing:border-box}
:root{
 --bg:#f4f6f8;--panel:#fff;--panel2:#f8fafb;--line:#e2e8ee;--line2:#edf1f4;
 --text:#17212b;--mut:#6c7a86;--nav:#12232e;--nav2:#183340;--blue:#2f7da8;
 --blue2:#eaf4fa;--green:#27815a;--green2:#e9f6ef;--amber:#a86c13;--amber2:#fff5df;
 --red:#a84444;--red2:#fdeeee;--shadow:0 8px 28px rgba(28,52,66,.06);
}
html{background:var(--bg)}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
.shell{--side-w:250px;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh;background:var(--nav)}
.side{width:var(--side-w);flex:none;align-self:start;background:var(--nav);color:#dbe7ed;padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid #203844}
.brand{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px;display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#4ba0cf,#23678c);display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px rgba(50,137,184,.25)}
.brand-mark svg{width:21px;height:21px}
.brand-copy b{font-size:14px;color:#fff;letter-spacing:.01em}
.brand-copy span{display:block;font-size:11px;color:#7f9aa8;margin-top:1px}
.nav-group{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#58717e;padding:17px 18px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 14px;margin:2px 8px;cursor:pointer;color:#aebfc8;font-size:13px;border-radius:8px;transition:.15s}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.88}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.on{background:var(--nav2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #52a8d5}
.nav-item.soon{opacity:.46;cursor:default}
.nav-item.soon:hover{background:none;color:#aebfc8}
.nav-badge{margin-left:auto;font-size:9px;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.08);color:#9bb0bb;text-transform:uppercase;letter-spacing:.04em}
.side-footer{margin:18px 14px;padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:10px;color:#78919e;font-size:11px}
.main{flex:1;min-width:0;min-height:100vh;background:var(--bg)}
header{height:66px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);color:var(--text);padding:0 26px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.header-title{display:flex;flex-direction:column}
header h1{font-size:15px;font-weight:650;margin:0}
.header-kicker{font-size:11px;color:var(--mut);margin-top:1px}
.sp{flex:1}
.top-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:5px 9px;border-radius:999px;font-size:11px;color:var(--mut)}
.top-chip svg{width:14px;height:14px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #cfd8df;background:#fff;padding:7px 11px;color:var(--text);transition:.15s}
button:hover{border-color:#9eafb9;background:#fbfcfd}
button.pri{background:#245f7f;color:#fff;border-color:#245f7f}
button.pri:hover{background:#1f536f}
button.gh{background:#fff;color:#344651;border-color:var(--line)}
button.sm{padding:4px 8px;font-size:12px;border-radius:6px}
button.dl{border-color:#ebcccc;color:#943e3e}
button:disabled{opacity:.45;cursor:not-allowed}
main{padding:26px;max-width:1440px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}
.page-head h2{font-size:24px;line-height:1.2;margin:0 0 5px;letter-spacing:-.02em}
.page-head p{margin:0;color:var(--mut);font-size:13px;max-width:780px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2,.card h3{font-size:15px;margin:0 0 5px;font-weight:650;display:flex;align-items:center;gap:8px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.section-title h3{margin:0;font-size:14px}
.sub{font-size:12px;color:var(--mut);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:#5c6a75;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fbfcfd}
td{padding:9px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fbfcfd}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:12px;color:#5a6771;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:8px 9px;border:1px solid #cbd5dc;border-radius:7px;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid #d9eef9;border-color:#71a9c8}
input[type=checkbox]{width:auto}
.form{background:#f8fbfd;border:1px solid #cfe0e9;border-radius:10px;padding:15px;margin-bottom:15px}
.form h3{margin:0 0 10px;font-size:14px;font-weight:650}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chk{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #cbd5dc;border-radius:8px;background:#fff;cursor:pointer;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:11px;border:1px solid #cbd5dc;background:#fff;white-space:nowrap}
.ok{background:var(--green2);border-color:#b9dfca;color:#236b4b}
.bad{background:var(--red2);border-color:#efc5c5;color:#934242}
.warn{background:var(--amber2);border-color:#efd9a6;color:#8a5b16}
.info{background:var(--blue2);border-color:#bddbea;color:#2b6685}
.err{color:#953d3d;font-size:12px;margin-top:8px;display:none}
.hint{font-size:12px;color:var(--mut);margin-top:10px}
.empty{padding:22px;text-align:center;color:var(--mut)}
.note{background:var(--amber2);border:1px solid #ecd7a7;border-radius:10px;padding:11px 13px;font-size:13px;color:#79551a;margin-bottom:14px}
.stub{background:var(--blue2);border:1px solid #c8dfeb;border-radius:10px;padding:11px 13px;font-size:13px;color:#315f78;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:9px 11px;background:none;color:#63717b}
.tabs button.on{border-bottom-color:#2f7da8;color:#1d455b;font-weight:650}
svg{display:block}
.preview-svg{background:#fbfdfe;border:1px solid var(--line);border-radius:10px}
#dirty{font-size:11px;color:#9a6616;background:#fff5df;border:1px solid #edd6a0;padding:4px 8px;border-radius:999px;display:none}

/* dashboard */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:var(--shadow)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.kpi-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--blue2);color:#2e7399}
.kpi-icon svg{width:18px;height:18px}
.kpi-num{font-size:25px;font-weight:700;line-height:1;letter-spacing:-.03em}
.kpi-label{font-size:12px;color:var(--mut);margin-top:5px}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.55fr);gap:16px}
.domain-map{padding:4px 0 2px}
.flow-row{display:flex;align-items:stretch;gap:8px}
.flow-arrow{display:flex;align-items:center;color:#9babb4;padding:0 1px}
.flow-arrow svg{width:19px;height:19px}
.domain-node{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;position:relative}
.domain-node.active{border-color:#c4ddea;background:#fbfdff}
.domain-node.planned{background:#fafbfc}
.domain-node.external{border-style:dashed;background:#fffdf8}
.domain-node .node-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px;background:#edf5f9;color:#2f759b}
.domain-node.planned .node-icon{background:#f1f3f5;color:#7b8992}
.domain-node.external .node-icon{background:#fff4d9;color:#936516}
.domain-node .node-icon svg{width:17px;height:17px}
.domain-node b{display:block;font-size:13px}
.domain-node small{display:block;color:var(--mut);font-size:11px;margin-top:3px;line-height:1.35}
.node-status{position:absolute;top:11px;right:10px;width:8px;height:8px;border-radius:50%;background:#3a9a6b}
.planned .node-status{background:#b8c1c7}
.external .node-status{background:#d49a32}
.flow-split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.phase-list{display:flex;flex-direction:column;gap:9px}
.phase-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:#fafbfc;border:1px solid var(--line2)}
.phase-num{width:25px;height:25px;border-radius:8px;background:#eaf4fa;color:#2d6d8e;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.phase-item b{font-size:12px;display:block}
.phase-item span{font-size:11px;color:var(--mut)}
.phase-item.current{border-color:#c5dfec;background:#f8fcfe}
.progress{height:6px;border-radius:20px;background:#e9eef2;overflow:hidden;margin-top:7px}
.progress>span{display:block;height:100%;border-radius:20px;background:#3e8fb7}

/* production */
.pipeline{display:flex;align-items:stretch;gap:7px;overflow-x:auto;padding:3px 0 8px}
.stage{min-width:185px;flex:1;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px}
.stage-top{display:flex;align-items:center;gap:9px}
.stage-index{width:28px;height:28px;border-radius:9px;background:#eaf4fa;color:#2f7395;display:grid;place-items:center;font-weight:700;font-size:12px}
.stage b{font-size:12px}
.stage small{display:block;color:var(--mut);font-size:10px;margin-top:1px}
.stage-machines{margin-top:10px;font-size:11px;color:#4f5e69}
.pipe-arrow{display:flex;align-items:center;color:#a5b2ba}
.pipe-arrow svg{width:18px;height:18px}
.machine-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.machine-card{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}
.machine-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.machine-ico{width:34px;height:34px;border-radius:9px;background:#f0f5f7;display:grid;place-items:center;color:#4c7488}
.machine-ico svg{width:17px;height:17px}
.machine-card b{font-size:12px}
.machine-card .code{font:10px ui-monospace,monospace;color:var(--mut)}
.machine-meta{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:10px;color:var(--mut)}
.machine-meta strong{display:block;color:#41515b;font-size:11px;font-weight:600}

/* integration */
.bridge{display:flex;align-items:stretch;gap:8px;margin:14px 0 18px}
.bridge-node{flex:1;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.bridge-node.external{border-style:dashed;background:#fffdf7}
.bridge-ico{width:38px;height:38px;border-radius:11px;background:#edf6fa;color:#2c759b;display:grid;place-items:center;margin-bottom:10px}
.bridge-node.external .bridge-ico{background:#fff3d6;color:#986914}
.bridge-ico svg{width:19px;height:19px}
.bridge-node b{font-size:13px}
.bridge-node p{font-size:11px;color:var(--mut);margin:5px 0 0}
.bridge-arrow{display:flex;align-items:center;color:#8fa2ac}
.bridge-arrow svg{width:22px;height:22px}
.return-flow{text-align:center;border-top:1px dashed #c9d3d9;margin-top:10px;padding-top:10px;color:var(--mut);font-size:11px}

/* modules */
.module-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.module-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;display:flex;gap:12px;align-items:flex-start}
.module-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#edf6fa;color:#2f789e;flex:none}
.module-icon svg{width:21px;height:21px}
.module-card h4{font-size:13px;margin:0 0 3px}
.module-card p{font-size:11px;color:var(--mut);margin:0}
.module-card .pill{margin-top:8px}
.skill-bars{display:flex;flex-direction:column;gap:9px}
.skill-line{display:grid;grid-template-columns:190px 1fr 70px;gap:10px;align-items:center;font-size:11px}
.bar-bg{height:7px;background:#edf1f4;border-radius:20px;overflow:hidden}
.bar-fill{height:100%;background:#438daf;border-radius:20px}
.card-soft{background:#fbfcfd;border:1px solid var(--line);border-radius:12px;padding:14px}
.icon-inline{display:inline-flex;vertical-align:-3px;margin-right:5px}
.icon-inline svg{width:16px;height:16px}
.skill-pillset{display:flex;flex-wrap:wrap;gap:7px}
.skill-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:#f6fafc;color:#364b57;font-size:11px;line-height:1}
.skill-badge .pill{padding:3px 7px;font-size:10px}
.skill-badge .icon-inline{margin-right:0}
.skill-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.skill-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;gap:12px;align-items:flex-start}
button.skill-card{width:100%;text-align:left;cursor:pointer;transition:.15s ease;border-color:var(--line)}
button.skill-card:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(20,42,58,.07);border-color:#bfd8e4}
button.skill-card.active{border-color:#96c6dc;background:#f4fbfe;box-shadow:0 10px 20px rgba(29,94,128,.08)}
.skill-card-icon{width:46px;height:46px;border-radius:13px;background:#edf6fa;color:#2f789e;display:grid;place-items:center;flex:none}
.skill-card-icon svg{width:22px;height:22px}
.skill-card-body{flex:1;min-width:0}
.skill-card-body b{display:block;font-size:13px;margin:0 0 4px}
.skill-card-body small{display:block;color:var(--mut);font-size:11px;line-height:1.35}
.skill-card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.skill-coverage-card .skill-card-meta .pill{font-size:10px}
.sales-skill-grid{margin:14px 0 16px}


/* language switch */
.lang-switch{display:inline-flex;align-items:center;padding:3px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;gap:2px}
.lang-switch button{border:0;background:transparent;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:650;color:var(--mut);min-width:34px}
.lang-switch button:hover{background:#fff;color:var(--text)}
.lang-switch button.on{background:#fff;color:#205d7d;box-shadow:0 1px 4px rgba(24,52,68,.12)}

@media(max-width:1050px){
 .kpi-grid{grid-template-columns:repeat(2,1fr)}
 .dashboard-grid{grid-template-columns:1fr}
 .flow-row{overflow-x:auto}.domain-node{min-width:170px}
 .bridge{overflow-x:auto}.bridge-node{min-width:210px}
}
@media(max-width:760px){
 .shell{--side-w:72px}.side{width:var(--side-w)}.brand-copy,.nav-group,.nav-item span,.nav-badge,.side-footer{display:none}
 .brand{padding:17px}.brand-mark{width:36px;height:36px}
 .nav-item{justify-content:center;padding:12px;margin:4px 8px}
 main{padding:17px}header{padding:0 17px}.header-kicker,.top-chip{display:none}
 .kpi-grid{grid-template-columns:1fr 1fr}.module-cards{grid-template-columns:1fr}
 .page-head{align-items:flex-start;flex-direction:column}
 .lang-switch button{padding:4px 6px;min-width:30px}
 table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
 .card,.form,.main,main,.section-title,.page-head{min-width:0;max-width:100%}
 .tabs{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
 .tabs button{flex:none}
 input,select,textarea{min-width:0}
}
@media(max-width:520px){
 .shell{--side-w:56px}.side{width:var(--side-w)}
 .brand{padding:12px 10px}.brand-mark{width:34px;height:34px}
 .nav-item{padding:10px;margin:4px 6px}
 header{min-height:60px;height:auto;padding:8px;gap:5px;flex-wrap:wrap}
 .header-title,#dirty{display:none!important}
 header .sp{display:none}
 header .gh{padding:5px 7px;font-size:10px;flex:1;white-space:nowrap}
 .lang-switch{margin-left:auto}
 main{padding:10px}
 .card{padding:12px;border-radius:11px}
 .kpi-grid{grid-template-columns:1fr}
 .row>button{flex:1}
 .section-title{align-items:flex-start;gap:8px;flex-wrap:wrap}
}

/* ---- src/styles/modules.css ---- */
.real-module-note{display:flex;gap:12px;align-items:flex-start;background:#f3f9fc;border:1px solid #cfe4ee;border-radius:10px;padding:11px 13px;margin-bottom:14px}.real-module-note b{white-space:nowrap;color:#245f7f}.real-module-note span{font-size:12px;color:#526b79}
.module-chain{display:flex;align-items:center;gap:10px;margin-bottom:14px}.module-chain-node{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fbfcfd}.module-chain-node .node-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--blue2);color:#2f7395}.module-chain-node .node-icon svg{width:18px;height:18px}.module-chain-node b{display:block;font-size:12px}.module-chain-node span{display:block;font-size:10.5px;color:var(--mut)}.module-chain-arrow{color:#9aabb4}.module-chain-arrow svg{width:18px}
.module-editor{border:1px solid #cddce5;background:#fafdff;border-radius:12px;padding:15px;margin-bottom:18px}.module-editor-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:13px}.module-editor-head h3{margin:0;font-size:15px}.module-editor-head p{margin:3px 0 0;color:var(--mut);font-size:11px}
.shape-editor-layout{display:grid;grid-template-columns:minmax(430px,.78fr) minmax(560px,1.22fr);gap:14px;align-items:start}.shape-controls,.shape-preview-side,.muntin-controls,.muntin-preview-side{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px}.shape-preview-side,.muntin-preview-side{position:sticky;top:14px}.smart-svg{width:100%;height:auto;border:1px solid var(--line2);border-radius:9px;background:#fbfdfe}

@media print{
  @page{margin:9mm}
  /* На время печати на листе остаётся только чертёж: интерфейс, меню и панели
     на бумаге не нужны и съедают место. */
  body.printing{background:#fff!important}
  body.printing>*{display:none!important}
  body.printing>#printSheetHost{display:block!important;position:static}
  .print-sheet{width:100%}
  .print-sheet svg{width:100%;height:auto;max-height:96vh;max-width:100%}
  .print-caption{margin-top:5mm;font:11px Arial,sans-serif;color:#475467}
}

<script>
/* ==== src/core/dim.js ==== */
/* =====================================================================
   core/dim  ·  v4.5-port
   Разбор и печать дюймовых размеров (общее для Shape и Muntin).
   IN : строка "48", "48 1/2", "48-1/2", число
   OUT: число дюймов / строка вида 48 1/2″
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.
   ===================================================================== */

/* ИСПРАВЛЕНО (авг 2026). Раньше inch() имел СВОЙ разбор, более слабый, чем
   fabParseDimStrict: "48-1/2" превращалось в 48 (дробь молча терялась), а "12abc"
   в 12. При этом сторона C читалась строгим парсером — то есть Width/Height и C
   понимали разный синтаксис. Теперь один парсер на всё; непонятный ввод = 0,
   и его ловит валидация ("Enter valid width and height"), а не тихо считает. */
function inch(t){
  if(typeof t==='number')return isFinite(t)?t:0;
  var r=fabParseDimStrict(t);
  return r.ok?r.v:0;
}
function frac64(v){
  v=+v||0;var whole=Math.floor(v+1e-9),n=Math.round((v-whole)*64);if(n===64){whole++;n=0;}
  if(!n)return String(whole);var a=n,b=64;while(b){var t=a%b;a=b;b=t;}n/=a;var d=64/a;
  return (whole?whole+' ':'')+n+'/'+d;
}
function dimIn(v){return frac64(v)+'″';}
function fabParseDimStrict(v){
  if(typeof v==='number')return isFinite(v)?{ok:true,v:v}:{ok:false,v:0};
  var t=String(v==null?'':v).trim().replace(/[\u2033\u201D"]/g,'');
  if(!t)return {ok:false,v:0,empty:true};
  var sign=1;
  if(t.charAt(0)==='-'){sign=-1;t=t.slice(1).trim();}else if(t.charAt(0)==='+'){t=t.slice(1).trim();}
  var m=t.match(/^(\d+(?:\.\d+)?)[\s-]+(\d+)\s*\/\s*(\d+)$/);
  if(m){var mixed=(+m[3])?sign*(+m[1]+(+m[2])/(+m[3])):NaN;return isFinite(mixed)?{ok:true,v:mixed}:{ok:false,v:0};}
  m=t.match(/^(\d+)\s*\/\s*(\d+)$/);
  if(m){var fraction=(+m[2])?sign*((+m[1])/(+m[2])):NaN;return isFinite(fraction)?{ok:true,v:fraction}:{ok:false,v:0};}
  if(/^\d+(?:\.\d+)?$/.test(t)){var decimal=sign*parseFloat(t);return isFinite(decimal)?{ok:true,v:decimal}:{ok:false,v:0};}
  return {ok:false,v:0};
}

/* ==== src/core/poly.js ==== */
/* =====================================================================
   core/poly  ·  v4.5-port
   Полигональная геометрия: самопересечение, площадь, габарит.
   IN : массив точек [[x,y],...]
   OUT: bool / число / {minX,maxX,minY,maxY}
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.
   ===================================================================== */

function fabSegCross(p1,p2,p3,p4){
  function cr(o,a,b){return (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);}
  var e=1e-9,d1=cr(p3,p4,p1),d2=cr(p3,p4,p2),d3=cr(p1,p2,p3),d4=cr(p1,p2,p4);
  return ((d1>e&&d2<-e)||(d1<-e&&d2>e))&&((d3>e&&d4<-e)||(d3<-e&&d4>e));
}
function fabPolySelfIntersects(P){
  var n=P.length;if(n<4)return false;
  for(var i=0;i<n;i++)for(var j=i+2;j<n;j++){
    if(i===0&&j===n-1)continue;
    if(fabSegCross(P[i],P[(i+1)%n],P[j],P[(j+1)%n]))return true;
  }
  return false;
}
function fabSignedArea(P){var a=0;for(var i=0;i<P.length;i++){var j=(i+1)%P.length;a+=P[i][0]*P[j][1]-P[j][0]*P[i][1];}return a/2;}
function fabEdgeBounds(P){var xs=P.map(function(q){return q[0];}),ys=P.map(function(q){return q[1];});return {minX:Math.min.apply(null,xs),maxX:Math.max.apply(null,xs),minY:Math.min.apply(null,ys),maxY:Math.max.apply(null,ys)};}

/* Общие безопасные примитивы. Они используются Shape, Cutting Geometry и
   проверками features. Все функции чистые: входные массивы не изменяются. */
function fabPointInPoly(p,P){
  if(!p||!P||P.length<3)return false;
  var inside=false,x=p[0],y=p[1];
  for(var i=0,j=P.length-1;i<P.length;j=i++){
    var a=P[i],b=P[j],cross=((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/((b[1]-a[1])||1e-30)+a[0]);
    if(cross)inside=!inside;
  }
  return inside;
}
function fabPointSegDistance(p,a,b){
  var dx=b[0]-a[0],dy=b[1]-a[1],d=dx*dx+dy*dy;
  if(d<=1e-20)return Math.hypot(p[0]-a[0],p[1]-a[1]);
  var t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/d;t=Math.max(0,Math.min(1,t));
  return Math.hypot(p[0]-(a[0]+dx*t),p[1]-(a[1]+dy*t));
}
function fabPointPolyDistance(p,P){
  var d=Infinity;for(var i=0;i<(P||[]).length;i++)d=Math.min(d,fabPointSegDistance(p,P[i],P[(i+1)%P.length]));return d;
}
function fabLineIntersection(a,b,c,d){
  var x1=a[0],y1=a[1],x2=b[0],y2=b[1],x3=c[0],y3=c[1],x4=d[0],y4=d[1];
  var den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);if(Math.abs(den)<1e-10)return null;
  var q1=x1*y2-y1*x2,q2=x3*y4-y3*x4;
  var x=(q1*(x3-x4)-(x1-x2)*q2)/den,y=(q1*(y3-y4)-(y1-y2)*q2)/den;
  return isFinite(x)&&isFinite(y)?[x,y]:null;
}
function fabPolylineLength(P,closed){
  var n=(P||[]).length,L=0;if(n<2)return 0;
  for(var i=0;i<n-(closed?0:1);i++){var a=P[i],b=P[(i+1)%n];L+=Math.hypot(b[0]-a[0],b[1]-a[1]);}return L;
}
function fabBBoxContainsPoint(b,p,eps){eps=eps||0;return p[0]>=b.minX-eps&&p[0]<=b.maxX+eps&&p[1]>=b.minY-eps&&p[1]<=b.maxY+eps;}
function fabPointOnSegment(p,a,b,eps){
  eps=eps==null?1e-8:eps;return fabPointSegDistance(p,a,b)<=eps&&p[0]>=Math.min(a[0],b[0])-eps&&p[0]<=Math.max(a[0],b[0])+eps&&p[1]>=Math.min(a[1],b[1])-eps&&p[1]<=Math.max(a[1],b[1])+eps;
}
function fabSegIntersectsInclusive(a,b,c,d){
  if(fabSegCross(a,b,c,d))return true;
  return fabPointOnSegment(a,c,d)||fabPointOnSegment(b,c,d)||fabPointOnSegment(c,a,b)||fabPointOnSegment(d,a,b);
}
function fabPolygonsOverlap(A,B){
  if(!A||!B||A.length<3||B.length<3)return false;
  for(var i=0;i<A.length;i++)for(var j=0;j<B.length;j++)if(fabSegIntersectsInclusive(A[i],A[(i+1)%A.length],B[j],B[(j+1)%B.length]))return true;
  return fabPointInPoly(A[0],B)||fabPointInPoly(B[0],A);
}

/* ==== src/modules/shape/consts.js ==== */
/* =====================================================================
   shape/consts  ·  v4.5-port
   Константы Smart-Shape: режимы уклона, углы, порядок, цвета рёбер.
   IN : —
   OUT: константы + буквенные имена рёбер
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.
   ===================================================================== */

var SS_MODES=[{id:'m1',s1:1,s2:1},{id:'m2',s1:1,s2:-1},{id:'m3',s1:-1,s2:1},{id:'m4',s1:-1,s2:-1}];
var SS_CORNERS=[['none','None'],['single','Single'],['double','Double'],['triple','Triple']];
var SS_ORDER=['tl','tr','br','bl'];
var SS_COLORS={A:'#1a52c4',B:'#1c7a34',C:'#a84b00',D:'#9c1f88'};
var SS_EXTRA_COLORS=['#00838f','#c1362b','#6a4bbf','#8a5a1f','#0071a8','#a8447a','#5c7a1f','#7a3f8f','#a86a00','#3f6f8a','#a04040','#3f7a5f','#1f6f7a','#8f3f5f','#4f5fa8','#7a6a1f','#8a2f2f','#2f6a4f','#5f3f8a','#a05a2f','#2f5f8a','#6f8a2f','#8a4f7a','#3f8a7a'];
var SS_BAD={};

function ssMode(id){for(var i=0;i<SS_MODES.length;i++)if(SS_MODES[i].id===id)return SS_MODES[i];return null;}
function ssCornerCount(t){return t==='single'?1:t==='double'?2:t==='triple'?3:0;}
function ssCornerLabel(t){for(var i=0;i<SS_CORNERS.length;i++)if(SS_CORNERS[i][0]===t)return SS_CORNERS[i][1];return 'None';}

      cur=[cur[0]+vecs[i][0],cur[1]+vecs[i][1]];
      map[a.p2[0].toFixed(8)+','+a.p2[1].toFixed(8)]=cur.slice();

    var cx=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2,cy=(Math.min.apply(null,ys)+Math.max.apply(null,ys))/2;

/* ---------- пунктирная база отвеса / уровня ----------
   Линия ложится на ВНЕШНЮЮ огибающую стороны (слева min X, справа max X,
   сверху min Y, снизу max Y). Именно поэтому малый размер уклона сам
   переезжает на нужный конец, когда направление наклона меняется. */
function shapeAnnRefLines(r,S,DP){
  var out='';
  (r.edges||[]).forEach(function(g){
    if(!g.segments||!g.segments.length)return;
    var side=shapeAnnSide(S,g.id);if(!side)return;
    var vert=shapeAnnAxis(S,g.id)==='v',sp=shapeAnnGroupPoints(g).map(DP);
    if(sp.length<2)return;
    var ref,vals,lo,hi,dev;
    if(vert){
      ref=side==='left'?Math.min.apply(null,sp.map(function(q){return q[0];})):Math.max.apply(null,sp.map(function(q){return q[0];}));
      vals=sp.map(function(q){return q[1];});
    }else{
      ref=side==='top'?Math.min.apply(null,sp.map(function(q){return q[1];})):Math.max.apply(null,sp.map(function(q){return q[1];}));
      vals=sp.map(function(q){return q[0];});
    }
    lo=Math.min.apply(null,vals);hi=Math.max.apply(null,vals);
    dev=Math.max.apply(null,sp.map(function(q){return Math.abs((vert?q[0]:q[1])-ref);}));
    if(dev<1.2)return;
    out+=vert
      ? '<line x1="'+ref+'" y1="'+lo+'" x2="'+ref+'" y2="'+hi+'" stroke="#101828" stroke-width=".8" stroke-dasharray="8 5"/>'
      : '<line x1="'+lo+'" y1="'+ref+'" x2="'+hi+'" y2="'+ref+'" stroke="#101828" stroke-width=".8" stroke-dasharray="8 5"/>';
  });
  return out;
}

/* ---------- машинные линии обработки ----------
   Производственная договорённость цеха:
   Front Mitre — сплошная параллельная линия внутри стекла,
   Back  Mitre — штриховая,
   Bevel       — пунктир точками.
   Это индикаторы обработки, а НЕ дополнительные физические рёбра. */
function shapeAnnOpOf(def,id,type){
  var l=shapeEdgeOps(def,id);
  for(var i=0;i<l.length;i++)if(l[i].type===type)return l[i];
  return null;
}
function shapeAnnWitness(r,S,DP){
  var def=r.definition,pts=r.points.map(DP),out='';
  if(!pts.length)return '';
  var cxx=0,cyy=0;pts.forEach(function(p){cxx+=p[0]/pts.length;cyy+=p[1]/pts.length;});
  (r.edges||[]).forEach(function(g){
    var mit=shapeAnnOpOf(def,g.id,'Mitering'),bev=shapeAnnOpOf(def,g.id,'Beveling');
    if(!mit&&!bev)return;

    if(mit)style=side==='front'?'stroke-dasharray:none':'stroke-dasharray:10 6';

      var a=DP(seg.p1),b=DP(seg.p2),dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);

      if(nx*(cxx-mx)+ny*(cyy-my)<0){nx=-nx;ny=-ny;}
      var cut=Math.min(6,L*.18),o=8;
      out+='<line x1="'+(a[0]+tx*cut+nx*o)+'" y1="'+(a[1]+ty*cut+ny*o)+'" x2="'+(b[0]-tx*cut+nx*o)+'" y2="'+(b[1]-ty*cut+ny*o)+'" stroke="#101828" stroke-width="1.05" style="'+style+'"/>';
    });
  });

}

/* ---------- вид сверху для митры ----------
   Реальная схема направления обработки, не декорация.
   Верхняя линия — ЛИЦЕВАЯ грань стекла, нижняя — ТЫЛЬНАЯ.
   Front Mitre оставляет лицевую грань длинной и подрезает тыльную, Back — наоборот. */
function shapeAnnNeedsOverhead(r){
  var def=r&&r.definition;if(!def)return false;

function shapeAnnOverhead(r,F,left,right){
  var def=r.definition,lm=shapeAnnOpOf(def,'A','Mitering'),rm=shapeAnnOpOf(def,'C','Mitering');
  if(!lm&&!rm)return '';

  function shift(op){
    if(!op)return 0;

  if(lm){if((lm.side||'back')==='front')lb+=ld;else lf+=ld;}
  if(rm){if((rm.side||'back')==='front')rb-=rd;else rf-=rd;}
  return '<path d="M'+lf+' '+yF+' L'+rf+' '+yF+' L'+rb+' '+yB+' L'+lb+' '+yB+' Z" fill="none" stroke="#101828" stroke-width="1"/>'
    +shapeAnnText((bl+br)/2,yB+14,'Overhead View',{size:11,weight:700});
}

/* ---------- прямоугольные метки угла (чертёжная договорённость) ---------- */
function shapeAnnRightAngles(r,DP){
  var P=r.points,out='';
  for(var i=0;i<P.length;i++){
    var a=P[(i-1+P.length)%P.length],b=P[i],c=P[(i+1)%P.length];
    var v1=[a[0]-b[0],a[1]-b[1]],v2=[c[0]-b[0],c[1]-b[1]],l1=Math.hypot(v1[0],v1[1]),l2=Math.hypot(v2[0],v2[1]);
    if(l1<1e-6||l2<1e-6)continue;

    var q=DP(b),qa=DP(a),qc=DP(c);
    var s1=[qa[0]-q[0],qa[1]-q[1]],s2=[qc[0]-q[0],qc[1]-q[1]],sl1=Math.hypot(s1[0],s1[1])||1,sl2=Math.hypot(s2[0],s2[1])||1,z=8;
    var u1=[s1[0]/sl1,s1[1]/sl1],u2=[s2[0]/sl2,s2[1]/sl2];

}

/* ---------- цепочки размеров по сторонам ----------
   ЭТО ГЛАВНОЕ: каждая сторона разбивается на реальные производственные
   участки, и скошенный край получает свой размер, а не растворяется
   в общем габарите. Малые (≤2″) расхождения с огибающей выносятся
   отдельными размерами уклона; большие — это геометрия выреза. */

    if(side==='top'&&inf&&inf.corner==='tl'&&inf.axis==='h'){
      var next=(r.geometry.edges||[]).filter(function(n){
        var ni=shapeAnnExtraInfo(S,n.id);
        return ni&&ni.corner==='tl'&&ni.axis==='v'&&shapeAnnEqP(n.p1,e.p2);
      })[0];
      if(next){var d=next.p2[0]-next.p1[0];if(d<0)v=Math.max(0,v+d);}

  var es=shapeAnnChainSegments(r,S,side),pts=[];
  es.forEach(function(e){pts.push(DP(e.p1),DP(e.p2));});
  if(!pts.length)return null;
  if(shapeAnnSideAxis(side)==='x'){var xs=pts.map(function(p){return p[0];});return {min:Math.min.apply(null,xs),max:Math.max.apply(null,xs)};}
  var ys=pts.map(function(p){return p[1];});return {min:Math.min.apply(null,ys),max:Math.max.apply(null,ys)};
}
function shapeAnnChains(r,S,DP,box){
  var out='';

    var ex=shapeAnnExtent(r,S,side,DP);if(!ex)return;
    var items=shapeAnnChainItems(r,S,side),total=items.reduce(function(a,q){return a+q.v;},0);
    if(total<1e-9)return;
    var allX=r.points.map(function(p){return p[0];}),engMin=Math.min.apply(null,allX),engMax=Math.max.apply(null,allX);
    var sideXs=[];shapeAnnChainSegments(r,S,side).forEach(function(e){sideXs.push(e.p1[0],e.p2[0]);});
    var lp=Math.max(0,Math.min.apply(null,sideXs)-engMin),rp=Math.max(0,engMax-Math.max.apply(null,sideXs));
    var minSmall=22,cursor=ex.min,width=Math.max(1,ex.max-ex.min);
    if(lp>1/64&&lp<=2+1e-8){var g1=Math.max(ex.min-box.left,minSmall);out+=shapeAnnDimH(ex.min-g1,ex.min,y,shapeAnnDim(lp));}
    items.forEach(function(q,i){
      var w=(i===items.length-1)?(ex.max-cursor):width*q.v/total,nx=cursor+w;
      out+=shapeAnnDimH(cursor,nx,y,shapeAnnDim(q.v));cursor=nx;
    });
    if(rp>1/64&&rp<=2+1e-8){var g2=Math.max(box.right-ex.max,minSmall);out+=shapeAnnDimH(ex.max,ex.max+g2,y,shapeAnnDim(rp));}
  }
  function vChain(side,x){
    var ex=shapeAnnExtent(r,S,side,DP);if(!ex)return;
    var items=shapeAnnChainItems(r,S,side),total=items.reduce(function(a,q){return a+q.v;},0);
    if(total<1e-9)return;
    var allY=r.points.map(function(p){return p[1];}),engMin=Math.min.apply(null,allY),engMax=Math.max.apply(null,allY);
    var sideYs=[];shapeAnnChainSegments(r,S,side).forEach(function(e){sideYs.push(e.p1[1],e.p2[1]);});
    var bp=Math.max(0,Math.min.apply(null,sideYs)-engMin),tp=Math.max(0,engMax-Math.max.apply(null,sideYs));
    /* экранный Y перевёрнут: цепочка идёт снизу вверх */
    var minSmall=22,cursor=ex.max,height=Math.max(1,ex.max-ex.min);
    if(bp>1/64&&bp<=2+1e-8){var g1=Math.max(box.bottom-ex.max,minSmall);out+=shapeAnnDimV(x,ex.max,ex.max+g1,shapeAnnDim(bp));}
    items.forEach(function(q,i){

      out+=shapeAnnDimV(x,ny,cursor,shapeAnnDim(q.v));cursor=ny;
    });
    if(tp>1/64&&tp<=2+1e-8){var g2=Math.max(ex.min-box.top,minSmall);out+=shapeAnnDimV(x,ex.min-g2,ex.min,shapeAnnDim(tp));}

/* ---------- локальные выноски уклона ----------
   Чертёж ставит величину у того конца сегмента, чей уклон она описывает.
   При реальном локте нулевой «to» переносит выноску «past» на перелом. */
function shapeAnnCallouts(r,S,DP){
  var m=(S.shape&&S.shape.smart)||null;if(!m)return '';
  var out='';
  (r.edges||[]).forEach(function(g){
    var vert=shapeAnnAxis(S,g.id)==='v',sp=shapeAnnGroupPoints(g).map(DP);
    if(sp.length<2)return;
    function label(q,val){
      val=Math.abs(inch(val||'0'));if(val<1/64)return;
      out+=shapeAnnText(vert?q[0]+7:q[0],vert?q[1]-2:q[1]-6,shapeAnnDim(val),{size:8,anchor:vert?'start':'middle',weight:600});
    }
    /* Скос ребра нотча подписывается ВСЕГДА, в обоих режимах: у нотча нет
       локтя, но его уход от отвеса/уровня — такой же производственный размер,
       и без него внутренние скосы читались бы только по картинке. */
    var inf=shapeAnnExtraInfo(S,g.id);
    if(inf){
      var x=(m.extraEdges||{})[g.id]||{},ov=Math.abs(inch(x.out||'0'));
      if(ov>1/64){
        var mid=[(sp[0][0]+sp[sp.length-1][0])/2,(sp[0][1]+sp[sp.length-1][1])/2];
        var arrow=inf.axis==='v'?(x.dir==='right'?'→':x.dir==='left'?'←':''):(x.dir==='up'?'↑':x.dir==='down'?'↓':'');
        out+=shapeAnnText(inf.axis==='v'?mid[0]+9:mid[0],inf.axis==='v'?mid[1]:mid[1]-9,
          arrow+' '+shapeAnnDim(ov),{size:8,anchor:inf.axis==='v'?'start':'middle',weight:600,color:'#95430f'});
      }
      return;
    }
    if(m.elbowsOn){
      var E=(g.id==='A'||g.id==='B'||g.id==='C')?(m[g.id]||{}).elbow:null;
      if(!E)return;
      var h=Math.abs(inch(E.elbowLen||'0')),to=Math.abs(inch(E.to||'0')),past=Math.abs(inch(E.past||'0'));
      if(h>1e-9&&sp.length>=3){
        if(to>1/64)label(sp[0],E.to);
        if(past>1/64)label(to<1/64?sp[1]:sp[sp.length-1],E.past);
      }else if(past>1/64)label(sp[sp.length-1],E.past);
    }else{
      if(g.id!=='A'&&g.id!=='B'&&g.id!=='C')return;
      var v=Math.abs(inch((m[g.id]||{}).out||'0'));
      if(v>1/64)label(sp[sp.length-1],v);
    }
  });
  return out;
}

/* ---------- цвет физического ребра ----------
   Та же палитра, что в матрице Edge: опознание ребра идёт по цвету, поэтому
   на чертеже не нужны подписи «A · 48″» — размеры несут цепочки. */

/* Контур рёбрами, а не одним путём: каждое ребро своим цветом. */
function shapeAnnContour(r,DP,active){
  var out='';
  (r.geometry.edges||[]).forEach(function(e){
    var a=DP(e.p1),b=DP(e.p2),sel=active&&active===e.id;
    out+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+shapeEdgeColor(e.id)+'" stroke-width="'+(sel?4.6:1.3)+'"'+(sel?' stroke-linecap="square"':'')+'/>';
  });

}

/* ---------- сборка ---------- */
function shapeAnnotationDefs(){
  return '<defs><marker id="shpArr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#101828" stroke-width=".75"/></marker></defs>';
}
/* Возвращает {contour, annotations, box} — контур считается по отображаемым
   точкам, чтобы усиленный уклон и его размеры совпадали друг с другом. */
function shapeAnnotationLayer(result,F,active){
  var S=result.line,DP=shapeAnnDisplay(result,S,F),disp=result.points.map(DP);
  var xs=disp.map(function(p){return p[0];}),ys=disp.map(function(p){return p[1];});

/* ==== src/modules/shape/drawing.js ==== */
/* =====================================================================

/* Короткая цеховая запись обработки: 45° Back Mitre · FP · Bevel 1″ (Front). */

   Админ · Владелец. Прежние семь ролей были выдумкой прототипа — проектировать
   права под несуществующие должности нельзя. Цех, отгрузка и снабжение
   именованных учёток не получают: учётка принадлежит терминалу станции, а
   человек опознаётся сканом бейджа при действии.
   Прибыль видит только Владелец; Админ — техническая роль без денег. */
const ROLES=['Продажи','Бухгалтер','Админ','Владелец'];
/* Неизвестная роль из импорта или из старых данных падает в самую слабую —
   Продажи: она не видит ни себестоимости, ни настроек системы. */
const SAFE_DEFAULT_ROLE='Продажи';
const SKILLS=['Резка','Кромка (arris/polish)','ЧПУ полировка','Сверловка/выемки','Закалка','Контроль качества','Отгрузка/погрузка'];
const SKILL_LEVELS=['Новичок','Мидл','Синьор'];
/* Старые записи могли хранить навык строкой — для них сохраняем исторический
   уровень «Мидл». Объект с неизвестным навыком/уровнем не угадываем и удаляем. */
const normSkill = x => {
 const src=typeof x==='string'?{skill:x,level:'Мидл'}:(x&&typeof x==='object'?x:null);
 if(!src)return null;
 const skill=String(src.skill==null?'':src.skill).trim();if(!SKILLS.includes(skill))return null;
 const level=typeof x==='string'?'Мидл':src.level;if(!SKILL_LEVELS.includes(level))return null;return {skill,level};
};
/* Пользователь привязан к РАБОЧЕМУ МЕСТУ, а не к станции: станция теперь шаг
   маршрута, и «привязать человека к шагу маршрута» не значит ничего.

   Старое поле `station` держало код станка (CUT1, CNC1, FURN1) — по коду оно
   и переносится в `workPosition`. Код, которому в реальном цеху ничего не
   соответствует (`EDGE1` — выдуманная «кромкообрабатывающая линия», вместо
   неё стоят ARRIS-H/M, POL1–3, MITER1, BEVEL1), обнуляется. Угадывать, за
   каким из шести мест стоял человек, нельзя: это ровно та подмена, из-за
   которой у Spil расстановка смены оказалась структурой цеха.

   И это ПРЕФИЛЛ, не назначение. Правда о том, кто сделал работу, приходит со
   скана и живёт в событии (хендофф, раздел 9м §3). */
function normalizeUsers(){
 if(!Array.isArray(DB.user))DB.user=[];
 DB.user=DB.user.filter(u=>u&&typeof u==='object');
 DB.user.forEach(u=>{
  u.name=String(u.name==null?'':u.name);u.role=ROLES.includes(u.role)?u.role:SAFE_DEFAULT_ROLE;
  const legacy=u.workPosition==null?u.station:u.workPosition;
  const code=String(legacy==null?'':legacy).trim().toUpperCase();
  u.workPosition=DB.workPosition.some(w=>w.code===code)?code:'';
  delete u.station;
  const seen=Object.create(null);u.skills=(Array.isArray(u.skills)?u.skills:[]).map(normSkill).filter(x=>x&&!seen[x.skill]&&(seen[x.skill]=true));
 });
}
/* =====================================================================
   ПЕРЕСЕВ СПРАВОЧНИКОВ

   Проблема, которую это чинит: mergeState при загрузке делает DB[k]=v, то есть
   сохранённый массив ЦЕЛИКОМ заменяет заводскую заготовку. Значит правка сида
   в коде до работающего браузера не доезжает никогда — там лежат старые данные,
   и они переживают любую заливку. Экспорт с импортом не помогает: из своего же
   JSON приедут те же старые записи.

   Решение: у данных есть версия справочников. Если она отстала — справочные
   таблицы заменяются заводскими, а рабочие данные (пользователи, клиенты,
   заказы, чертежи) не трогаются вообще.

   Версия живёт В ДАННЫХ, а не в localStorage: тогда чужой импорт со старым
   каталогом тоже пересеется, а это именно то поведение, которое нужно.

   ОГРАНИЧЕНИЕ, ЗНАТЬ ОБЯЗАТЕЛЬНО: пересев затирает ручные правки справочников.
   Пока экрана справочников нет, править их можно только на экране Производства,
   и цена невелика. Как появится Master Data (Этап 5) — заменить на слияние по
   коду: свои строки пользователя оставлять, заводские обновлять.
   ===================================================================== */
/* `level` из списка ушёл вместе с таблицей: шагом маршрута теперь является
   сама СТАНЦИЯ, и держать рядом второй справочник тех же одиннадцати строк
   означало бы два источника правды. На его место встали три новые таблицы
   цеха — операции, рабочие места и терминалы (см. erp/shopfloor/data). */
const REFERENCE_TABLES=['station','operation','workPosition','terminal','glassProduct','heatTreatment','spacerVariant','gasProduct','sealantProduct','interlayerProduct','fritProduct','spandrelProduct'];
/* 2 → 3: у сохранённых данных под ключом `station` лежат СТАНКИ прежней
   модели. Пересев меняет там смысл таблицы, а не только её содержимое,
   поэтому версия обязана подняться — иначе браузер пользователя навсегда
   останется со станками там, где код ждёт шаги маршрута.

   3 → 4: каталог стекла перестал быть шестнадцатью выдуманными заглушками —
   в `glassProduct` встали 511 реальных позиций, и схема записи изменилась
   целиком: подложка, режим закалки, правило поверхности, единицы хранения и
   продажи, оптика IGDB. Поставка при этом уехала в отдельную таблицу
   `glassSheet`. Без подъёма версии браузер пользователя остался бы со
   старыми заглушками, а конфигуратор — с шестнадцатью строками выбора.

   `glassSheet` в списке пересева НЕТ намеренно: там лежат цены и сроки,
   введённые руками, а пересев заменяет таблицу заводской — то есть стёр бы
   их при следующем же подъёме версии. Заводского содержимого у поставки не
   бывает (см. erp/masterdata/glass). */
const REFERENCE_VERSION=4;
let referenceReseeded=false;
/* Версия справочников обязана быть целым числом: из руками правленного JSON
   она приезжала строкой или мусором, и сравнение `have>=REFERENCE_VERSION`
   тихо давало не тот ответ. Раньше эта строка жила в normalizeStations —
   таблица уехала в erp/shopfloor, проверка осталась здесь. */
function normalizeRefVersion(){
 const rv=+DB.refVersion;DB.refVersion=isFinite(rv)&&Number.isInteger(rv)&&rv>0?rv:0;
}
/* hadSaved — были ли в браузере сохранённые данные. Нужен ТОЛЬКО для
   уведомления: на чистой установке пересев тоже проходит (версия 0 → 2), но
   говорить «справочники обновлены» там не о чем, ничего не заменялось. */
function reseedReferenceTables(hadSaved){
 const have=Number.isInteger(+DB.refVersion)?+DB.refVersion:0;
 if(have>=REFERENCE_VERSION)return false;
 const done=[];
 REFERENCE_TABLES.forEach(k=>{if(Array.isArray(DEFAULT[k])){DB[k]=JSON.parse(JSON.stringify(DEFAULT[k]));done.push(k);}});
 DB.refVersion=REFERENCE_VERSION;
 referenceReseeded=!!hadSaved;
 console.info('reference tables reseeded '+have+' \u2192 '+REFERENCE_VERSION+': '+done.join(', '));
 return true;
}

 return `<span class="skill-badge">${ico(skillIconName(s.skill),'icon-inline')}<span>${esc(s.skill)}</span><span class="pill">${esc(s.level)}</span></span>`;
}

/* B8 · демо-пользователи. Прототип стартовал с пустым DB.user: дашборд
   показывал ноль, отчёт по навыкам был пуст, а привязку к станции и роли

   человек; Админ не засеян намеренно, это техническая роль. Рабочее место у
   всех троих пустое: это офисные роли, за станком они не стоят.
   Имена латиницей: имя пользователя — данные, переводчик их не трогает, и
   русское имя осталось бы русским в английском интерфейсе. */
const DEMO_USERS=[
 {name:'Demo Sales',role:'Продажи',workPosition:'',skills:[]},
 {name:'Demo Accounting',role:'Бухгалтер',workPosition:'',skills:[]},
 {name:'Demo Owner',role:'Владелец',workPosition:'',skills:[]}
];
const DEMO_USERS_KEY='glazing_system_demo_users_v1';
/* Засев ОДИН раз на браузер. Отметка живёт в localStorage, а не в DB, потому
   что это свойство установки, а не данных: иначе удалённые демо-записи
   возвращались бы после каждого F5, а импорт чужого экспорта засевал бы их
   заново поверх настоящих людей. */
function seedDemoUsers(){
 try{if(localStorage.getItem(DEMO_USERS_KEY))return false;localStorage.setItem(DEMO_USERS_KEY,'1');}catch(e){return false;}
 if(!Array.isArray(DB.user)||DB.user.length)return false;
 DB.user=JSON.parse(JSON.stringify(DEMO_USERS));
 return true;
}

/* Справочники цеха — станции, операции, рабочие места и терминалы — живут в

const DEFAULT={
 user:[],

 muntinDef:[{id:'m1', name:'Adaptive 2V × 1H', shapeId:'s1', muntin:{enabled:true,productId:'mb058_black',flipped:false,layout:{type:'grid',verticalBars:2,horizontalBars:1},production:{mode:'equal',edgeInsetX:0.4375,edgeInsetY:0.4375,endClearance:0,edgeMode:'offset',verticalPositions:[],horizontalPositions:[]}}}]

/* ==== src/erp/shopfloor/data.js ==== */
/* =====================================================================
   erp/shopfloor/data  ·  shopfloor-1.0
   Четыре РАЗНЫЕ сущности цеха, которые Spil держал в одной таблице.
   IN : templates/STATIONS.csv · templates/WORK_POSITIONS.csv
   OUT: DEFAULT.station · DEFAULT.operation · DEFAULT.workPosition · DEFAULT.terminal
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.

   ПОЧЕМУ ЧЕТЫРЕ ТАБЛИЦЫ, А НЕ ОДНА (хендофф, разделы 9м · 9н)

   В Spil «станция» означала сразу три вещи, и от этого ломались данные:
   экран сканирования, шаг маршрута и станок. Скан говорил «на CNC сделано»,
   но не говорил КАКАЯ операция — следующая запись ложилась на то же место и
   затирала предыдущую. Самый дорогой случай, названный пользователем: `CNC`
   показывал, что петли уже выполнены, хотя их не делали. Деталь уезжала без
   петель, а закалённое стекло не досверливается.

   Здесь эти три вещи разъехались, и к ним добавилась четвёртая:

     station      шаг маршрута, ровно 11, у каждого порядок и always/optional
     operation    что именно делают: единица, stage до/после печи
     workPosition где делают: габарит, batch_mode, список операций
     terminal     экран сканирования — ТОЛЬКО ввод, ключом шага не бывает

   Отдельно, чтобы не потерялось: подстанции Spil (cutting1 / cutting2) сюда
   НЕ переносятся ни одной строкой. Это были люди, станки, операции и смены
   вперемешку — все они разрезы журнала событий, а не единицы цеха.
   ===================================================================== */

const SF_STAGES=['pre_temper','heat','post_temper','any'];
const SF_KINDS=['machine','manual'];
const SF_BATCH_MODES=['single','batch'];
/* Единица услуги. `null` — «ещё не подтверждена пользователем», и это
   рабочее состояние: выдумывать единицу нельзя, на ней стоит цена. */
const SF_UNITS=['in','ft2','pcs','lb'];

function sfStr(v){return String(v==null?'':v).trim();}
function sfCode(v){return sfStr(v).toUpperCase();}
function sfNum(v){if(v==null||v==='')return null;const n=+v;return Number.isFinite(n)&&n>0?n:null;}
const SF_CODE_RE=/^[A-Z0-9][A-Z0-9_-]{0,39}$/;
const SF_OP_CODE_RE=/^[a-z0-9][a-z0-9_]{0,39}$/;

   колонка always_or_optional заполнена пользователем.

/* =====================================================================

   единица тише и опаснее пустой, потому что в неё верят. */
DEFAULT.operation=[
 {code:'cutting',            station:'CUT',  name:'Резка',                        nameEn:'Cutting',                  stage:'pre_temper',  unit:null,  note:''},

 {code:'arris_machine',      station:'EDGE', name:'Притупление машинное',         nameEn:'Machine arrising',         stage:'pre_temper',  unit:'in',  note:'себестоимость иная, чем у ручного, а в счёте позиция одна — RA'},
 {code:'polish',             station:'EDGE', name:'Полировка прямой кромки',      nameEn:'Flat polishing',           stage:'pre_temper',  unit:'in',  note:''},
 {code:'miter',              station:'EDGE', name:'Митра',                        nameEn:'Mitering',                 stage:'pre_temper',  unit:'in',  note:''},

/* =====================================================================
   4. ТЕРМИНАЛЫ — экраны сканирования. Таблица заведена ПУСТОЙ, и это не
   недоделка.

   Про поведение терминала известно всё: оператор сканирует стикер, экран
   показывает открытые операции ЭТОЙ детали для ЭТОГО места, все отмечены
   заранее, он снимает галочку с того, чего не делал. Экраны никто не
   переключает — это условие задачи, а не то, что надо чинить. Главный
   выигрыш: закрыть операцию, которой нет в маршруте детали, физически
   невозможно, её просто нет на экране.

   А вот СКОЛЬКО экранов стоит в цеху и какие места висят на каждом —
   пользователь ещё не называл. Засеять «по одному на станцию» значило бы
   повторить болезнь подстанций Spil: справочник, распухший выдуманными
   строками. Пустая таблица с CRUD — честное состояние: модель готова,
   данные заводятся из цеха. */
DEFAULT.terminal=[];

/* ---------------------------------------------------------------------
   Выведенные связи. Ничего не хранят — считают из уже введённого.
   --------------------------------------------------------------------- */
/* Станции, которым служит рабочее место. НЕ отдельное поле: у CNC1 оно само
   даёт FAB + EDGE из его операций, и второй источник правды не заводится. */
function workPositionStations(wp){
 if(!wp||!Array.isArray(wp.operations))return [];
 const seen=Object.create(null),out=[];
 (wp.station?[wp.station]:[]).concat(wp.operations.map(c=>{
   const op=DB.operation.find(o=>o.code===c);return op?op.station:'';
 })).forEach(code=>{if(code&&!seen[code]){seen[code]=true;out.push(code);}});
 return out.sort((a,b)=>stationSeq(a)-stationSeq(b));
}
function stationSeq(code){const s=DB.station.find(x=>x.code===code);return s?s.seq:999;}
/* Рабочие места станции — по операциям, а не по домашнему полю: иначе CNC1
   не попал бы в EDGE, хотя фигурную кромку полируют именно на нём. */
function stationWorkPositions(code){return DB.workPosition.filter(w=>workPositionStations(w).includes(code));}
function stationOperations(code){return DB.operation.filter(o=>o.station===code);}
/* Операция без рабочего места — не ошибка, а видимый пробел: силкскрин ещё
   не перенесён, отгрузка ещё не спроектирована. */
function operationWorkPositions(code){return DB.workPosition.filter(w=>(w.operations||[]).includes(code));}
/* Рабочие места, которые ЖДУТ ЗАМЕРОВ. Не то же самое, что «без габарита»:
   у ручного места габарита нет и не будет — там руки, а не станок, и считать
   его недостающим замером значит вечно показывать долг, который никто не
   закроет. Определение одно на всю систему, чтобы экраны не спорили друг с
   другом о числе. */
function workPositionsAwaitingSize(){
 return DB.workPosition.filter(function(w){return w.maxW==null&&w.kind!=='manual';});
}
/* Станции, которые терминал в принципе может закрывать. Это СПРАВКА для
   экрана, а не право: ключом шага маршрута терминал не бывает никогда. */
function terminalStations(t){
 const seen=Object.create(null),out=[];
 ((t&&t.workPositions)||[]).forEach(code=>{
  const wp=DB.workPosition.find(w=>w.code===code);
  if(wp)workPositionStations(wp).forEach(s=>{if(!seen[s]){seen[s]=true;out.push(s);}});
 });
 return out.sort((a,b)=>stationSeq(a)-stationSeq(b));
}

/* ---------------------------------------------------------------------
   Нормализация. Идёт ДО normalizeUsers: пользователь ссылается на рабочее
   место, и проверять ссылку не на чем, пока места не приведены в порядок.

   Устойчивость здесь обязательна, а не желательна. В браузере пользователя
   под ключом `station` лежат СТАНКИ старой модели (CUT1, EDGE1, CNC1…), и
   этот код увидит их раньше, чем пересев успеет заменить таблицу
   заводской. Ронять загрузку он при этом не имеет права — иначе до пересева
   дело не дойдёт вообще.
   --------------------------------------------------------------------- */
function normalizeShopFloor(){
 const seen=Object.create(null);
 DB.station=(Array.isArray(DB.station)?DB.station:[]).filter(s=>{
  if(!s||typeof s!=='object')return false;
  const code=sfCode(s.code);if(!code||seen[code])return false;seen[code]=true;return true;
 }).map((s,i)=>{
  const seq=Number.isInteger(+s.seq)&&+s.seq>0?+s.seq:i+1;
  return {seq,code:sfCode(s.code),name:sfStr(s.name),nameEn:sfStr(s.nameEn),always:s.always===true,note:sfStr(s.note)};
 }).sort((a,b)=>a.seq-b.seq);

 const opSeen=Object.create(null);
 DB.operation=(Array.isArray(DB.operation)?DB.operation:[]).filter(o=>{
  if(!o||typeof o!=='object')return false;
  const code=sfStr(o.code).toLowerCase();if(!code||opSeen[code])return false;opSeen[code]=true;return true;
 }).map(o=>{
  const station=sfCode(o.station);
  return {
   code:sfStr(o.code).toLowerCase(),
   /* операция без своей станции — сирота, а не ошибка данных: станцию могли
      удалить. Пустая ссылка видна на экране, выдуманная — нет. */
   station:DB.station.some(s=>s.code===station)?station:'',
   name:sfStr(o.name),nameEn:sfStr(o.nameEn),
   stage:SF_STAGES.includes(o.stage)?o.stage:'any',
   unit:SF_UNITS.includes(o.unit)?o.unit:null,
   note:sfStr(o.note)
  };
 });

 const wpSeen=Object.create(null);
 DB.workPosition=(Array.isArray(DB.workPosition)?DB.workPosition:[]).filter(w=>{
  if(!w||typeof w!=='object')return false;
  const code=sfCode(w.code);if(!code||wpSeen[code])return false;wpSeen[code]=true;return true;
 }).map(w=>{
  const station=sfCode(w.station),opSet=Object.create(null);
  const maxW=sfNum(w.maxW),maxL=sfNum(w.maxL);
  return {
   code:sfCode(w.code),
   station:DB.station.some(s=>s.code===station)?station:'',
   name:sfStr(w.name),nameEn:sfStr(w.nameEn),
   kind:SF_KINDS.includes(w.kind)?w.kind:'machine',
   operations:(Array.isArray(w.operations)?w.operations:[]).map(c=>sfStr(c).toLowerCase())
     .filter(c=>c&&DB.operation.some(o=>o.code===c)&&!opSet[c]&&(opSet[c]=true)),
   defaultOperator:sfStr(w.defaultOperator),defaultHelper:sfStr(w.defaultHelper),
   /* габарит принимается только парой: одна сторона без второй не отвечает
      на вопрос «влезет ли деталь», а выглядит как заполненная строка */
   maxW:(maxW!=null&&maxL!=null)?maxW:null,
   maxL:(maxW!=null&&maxL!=null)?maxL:null,
   batchMode:SF_BATCH_MODES.includes(w.batchMode)?w.batchMode:'single',
   note:sfStr(w.note)
  };
 });

 const tSeen=Object.create(null);
 DB.terminal=(Array.isArray(DB.terminal)?DB.terminal:[]).filter(t=>{
  if(!t||typeof t!=='object')return false;
  const code=sfCode(t.code);if(!code||tSeen[code])return false;tSeen[code]=true;return true;
 }).map(t=>{
  const wpSet=Object.create(null);
  return {
   code:sfCode(t.code),name:sfStr(t.name),nameEn:sfStr(t.nameEn),
   workPositions:(Array.isArray(t.workPositions)?t.workPositions:[]).map(sfCode)
     .filter(c=>c&&DB.workPosition.some(w=>w.code===c)&&!wpSet[c]&&(wpSet[c]=true)),
   note:sfStr(t.note)
  };
 });
}

/* ---------------------------------------------------------------------
   Разбор CSV. Нужен здесь, а не в Этапе 5·3, по простой причине: 19 из 22
   рабочих мест ждут замеров в цеху. Без импорта каждый снятый габарит
   означал бы правку кода и новую сборку.

   Формат — тот, в котором пользователю отдают файлы: запятая, кавычки
   вокруг полей с запятыми, удвоенная кавычка внутри. BOM от Excel снимаем.
   --------------------------------------------------------------------- */
function parseCsv(text){
 const src=String(text==null?'':text).replace(/^﻿/,'');
 const rows=[];let row=[],field='',quoted=false,i=0;
 const endField=()=>{row.push(field);field='';};
 const endRow=()=>{endField();if(row.length>1||row[0]!=='')rows.push(row);row=[];};
 while(i<src.length){
  const c=src[i];
  if(quoted){
   if(c==='"'){ if(src[i+1]==='"'){field+='"';i+=2;continue;} quoted=false;i++;continue; }
   field+=c;i++;continue;
  }
  if(c==='"'){quoted=true;i++;continue;}
  if(c===','){endField();i++;continue;}
  if(c==='\r'){i++;continue;}
  if(c==='\n'){endRow();i++;continue;}
  field+=c;i++;
 }
 if(field!==''||row.length)endRow();
 if(!rows.length)return {header:[],rows:[]};
 const header=rows[0].map(h=>sfStr(h));
 return {header,rows:rows.slice(1).map(r=>{
  const o=Object.create(null);header.forEach((h,n)=>{o[h]=sfStr(r[n]);});return o;
 })};
}

/* Отчёт вместо тихого успеха: «принято N, отклонено M и почему». Строка,
   которую отклонили без причины, возвращается пользователю как загадка. */
function sfReport(){return {accepted:0,added:0,updated:0,rejected:[],missing:[]};}
function sfReject(rep,line,code,why){rep.rejected.push({line,code:code||'—',why});}

/* Импорт STATIONS.csv. Слияние ПО КОДУ, а не замена таблицы: строки, которые
   пользователь завёл руками, чужой файл сносить не должен. Чего в файле нет —
   попадает в `missing` отчёта, а не удаляется молча. */
function importStationsCsv(text){
 const {header,rows}=parseCsv(text),rep=sfReport();
 if(!header.includes('code')||!header.includes('seq'))
  {sfReject(rep,0,'','файл не похож на STATIONS.csv: нет колонок seq и code');return rep;}
 const inFile=Object.create(null);
 rows.forEach((r,n)=>{
  const line=n+2,code=sfCode(r.code);
  if(!code)return sfReject(rep,line,'','пустой код');
  if(!SF_CODE_RE.test(code))return sfReject(rep,line,code,'код: только A–Z, 0–9, дефис и подчёркивание');
  if(inFile[code])return sfReject(rep,line,code,'код повторяется в файле');
  const seq=+r.seq;
  if(!Number.isInteger(seq)||seq<=0)return sfReject(rep,line,code,'seq должен быть целым положительным');
  const flag=sfStr(r.always_or_optional).toLowerCase();
  if(flag!=='always'&&flag!=='optional')return sfReject(rep,line,code,'always_or_optional: ожидается always или optional');
  inFile[code]=true;
  const next={seq,code,name:sfStr(r.name_ru),nameEn:sfStr(r.name_en),always:flag==='always',note:sfStr(r.note)};
  const at=DB.station.findIndex(s=>s.code===code);
  if(at<0){DB.station.push(next);rep.added++;}else{Object.assign(DB.station[at],next);rep.updated++;}
  rep.accepted++;
 });
 DB.station.forEach(s=>{if(!inFile[s.code])rep.missing.push(s.code);});
 normalizeShopFloor();
 return rep;
}

/* Импорт WORK_POSITIONS.csv. Здесь же приезжают габариты, которых ждёт
   `check_route_fits()` этапа 7·2. Пустой габарит в файле означает «ещё не
   замерили» и стирает прежнее значение только вместе с парной стороной —
   половина габарита хуже, чем его отсутствие. */
function importWorkPositionsCsv(text){
 const {header,rows}=parseCsv(text),rep=sfReport();
 if(!header.includes('code')||!header.includes('station'))
  {sfReject(rep,0,'','файл не похож на WORK_POSITIONS.csv: нет колонок code и station');return rep;}
 const inFile=Object.create(null);
 rows.forEach((r,n)=>{
  const line=n+2,code=sfCode(r.code);
  if(!code)return sfReject(rep,line,'','пустой код');
  if(!SF_CODE_RE.test(code))return sfReject(rep,line,code,'код: только A–Z, 0–9, дефис и подчёркивание');
  if(inFile[code])return sfReject(rep,line,code,'код повторяется в файле');
  const station=sfCode(r.station);
  if(!DB.station.some(s=>s.code===station))return sfReject(rep,line,code,'станции '+(station||'—')+' нет в справочнике');
  const ops=sfStr(r.operations).split(/[,;]/).map(x=>sfStr(x).toLowerCase()).filter(Boolean);
  const unknown=ops.filter(c=>!DB.operation.some(o=>o.code===c));
  if(unknown.length)return sfReject(rep,line,code,'неизвестные операции: '+unknown.join(', '));
  const kind=sfStr(r.kind).toLowerCase()||'machine';
  if(!SF_KINDS.includes(kind))return sfReject(rep,line,code,'kind: ожидается machine или manual');
  const batchMode=sfStr(r.batch_mode).toLowerCase()||'single';
  if(!SF_BATCH_MODES.includes(batchMode))return sfReject(rep,line,code,'batch_mode: ожидается single или batch');
  const maxW=sfNum(r.max_w_in),maxL=sfNum(r.max_l_in);
  if((maxW==null)!==(maxL==null))return sfReject(rep,line,code,'габарит заполняется парой: max_w_in и max_l_in');
  inFile[code]=true;
  const seenOp=Object.create(null);
  const next={code,station,name:sfStr(r.name_ru),nameEn:sfStr(r.name_en),kind,
   operations:ops.filter(c=>!seenOp[c]&&(seenOp[c]=true)),
   defaultOperator:sfStr(r.default_operator),defaultHelper:sfStr(r.default_helper),
   maxW,maxL,batchMode,note:sfStr(r.note)};
  const at=DB.workPosition.findIndex(w=>w.code===code);
  if(at<0){DB.workPosition.push(next);rep.added++;}else{Object.assign(DB.workPosition[at],next);rep.updated++;}
  rep.accepted++;
 });
 DB.workPosition.forEach(w=>{if(!inFile[w.code])rep.missing.push(w.code);});
 normalizeShopFloor();
 return rep;
}

/* ---------------------------------------------------------------------
   Имя записи на языке интерфейса. Не перевод: обе колонки заполнил
   пользователь, здесь только выбор нужной. Пустая nameEn — не беда, тогда
   показываем то единственное имя, которое есть.
   --------------------------------------------------------------------- */
function sfName(row){
 if(!row)return '';
 return (LANG==='en'&&row.nameEn)?row.nameEn:(row.name||row.nameEn||'');
}
/* Локализованное имя — уже данные, а не интерфейс: переводчику его не отдаём. */
function sfLabel(row){return `<span data-raw>${esc(sfName(row))}</span>`;}

/* ==== src/erp/masterdata/units.js ==== */
/* =====================================================================
   erp/masterdata/units  ·  masterdata-1.0
   Единицы измерения справочников.
   IN : —
   OUT: MD_UNITS · MD_UNIT_CALCS
   Правило: файл не знает про цены, клиентов и заказы. Только вход→выход.

   ЕДИНИЦА — ЭТО ТРИ РАЗНЫХ ВОПРОСА, А НЕ ОДИН

   Пользователь назвал их прямо: закупка, хранение, продажа. У одного и того
   же товара они расходятся, и держать одну колонку «единица» значит однажды
   посчитать не то:

     закупка   в чём поставщик даёт ЦЕНУ           стекло — sq ft, герметик — карton
     хранение  в чём считаем ОСТАТОК на складе     стекло — sq ft, штапик — лист
     продажа   в чём выставляем клиенту            стекло — sq ft, услуга — штука

   Закупка принадлежит СТРОКЕ ПОСТАВКИ (один продукт у двух поставщиков может
   стоить за разные единицы), хранение и продажа — самому продукту.

   КАЛЬКУЛЯЦИЯ — САМОЕ ВАЖНОЕ ПОЛЕ

   Она отвечает, как из детали получается количество, и без неё единица — просто
   надпись:

     area    площадь детали      sq ft · sq m
     linear  длина или периметр  дюйм · фут · метр
     flat    штуки как есть      лист · штука · коробка · кг

   Именно поэтому не всякий товар покупается квадратными футами: коробку
   пластин или бочку герметика площадью не мерят, а на складе они лежат рядом
   со стеклом. Список открытый — новые единицы дописываются сюда.
   ===================================================================== */

const MD_UNIT_CALCS=['area','linear','flat'];
/* nameEn заполнен у каждой строки намеренно: имя единицы приходит из этого
   файла, а не из словаря интерфейса — так в EN не остаётся русского даже
   там, где строку показывает таблица, собранная данными. */
const MD_UNITS=[
 {code:'sqft',  calc:'area',  name:'кв. фут',   nameEn:'sq ft'},
 {code:'sqm',   calc:'area',  name:'кв. метр',  nameEn:'sq m'},
 {code:'inch',  calc:'linear',name:'дюйм',      nameEn:'inch'},
 {code:'ft',    calc:'linear',name:'фут',       nameEn:'ft'},
 {code:'m',     calc:'linear',name:'метр',      nameEn:'m'},
 {code:'each',  calc:'flat',  name:'штука',     nameEn:'each'},
 {code:'sheet', calc:'flat',  name:'лист',      nameEn:'sheet'},
 {code:'lite',  calc:'flat',  name:'деталь',    nameEn:'lite'},
 {code:'box',   calc:'flat',  name:'коробка',   nameEn:'box'},
 {code:'carton',calc:'flat',  name:'картон',    nameEn:'carton'},
 {code:'bag',   calc:'flat',  name:'мешок',     nameEn:'bag'},
 {code:'drum',  calc:'flat',  name:'бочка',     nameEn:'drum'},
 {code:'roll',  calc:'flat',  name:'рулон',     nameEn:'roll'},
 {code:'kg',    calc:'flat',  name:'кг',        nameEn:'kg'},
 {code:'lb',    calc:'flat',  name:'фунт',      nameEn:'lb'},
 {code:'liter', calc:'flat',  name:'литр',      nameEn:'liter'}
];
/* Написания, в которых единица приезжает из чужого файла. Прайс поставщика
   пишет `SQ FT`, выгрузка Spil — `ft2`, Excel — `sq. ft.`; всё это одна и та
   же единица, и отклонять её строкой отчёта было бы издевательством. */
const MD_UNIT_ALIASES={
 'ft2':'sqft','sf':'sqft','sqft':'sqft','sq ft':'sqft','sq.ft':'sqft','sq. ft.':'sqft','sqfeet':'sqft','square foot':'sqft','square feet':'sqft',
 'm2':'sqm','sqm':'sqm','sq m':'sqm','кв.м':'sqm','кв м':'sqm',
 'in':'inch','inch':'inch','inches':'inch','"':'inch',
 'foot':'ft','feet':'ft','lin ft':'ft','lft':'ft',
 'meter':'m','metre':'m','mtr':'m',
 'ea':'each','pc':'each','pcs':'each','piece':'each','pieces':'each','unit':'each','units':'each',
 'sheets':'sheet','plate':'sheet','lites':'lite',
 'boxes':'box','ctn':'carton','cartons':'carton','bags':'bag','drums':'drum','brum':'drum','rolls':'roll',
 'kgs':'kg','kilogram':'kg','lbs':'lb','pound':'lb','pounds':'lb',
 'l':'liter','ltr':'liter','litre':'liter','liters':'liter','litres':'liter'
};

function mdUnit(code){const c=String(code==null?'':code).trim().toLowerCase();return MD_UNITS.find(u=>u.code===c)||null;}
/* Приведение к коду списка. Пустая строка не угадывается: вызывающий сам
   решает, чем заполнить пропуск — у стекла это sq ft, у бочки герметика нет. */
function mdUnitCode(v,fallback){
 const raw=String(v==null?'':v).trim().toLowerCase();
 if(!raw)return fallback||'';
 const direct=mdUnit(raw);if(direct)return direct.code;
 const alias=MD_UNIT_ALIASES[raw]||MD_UNIT_ALIASES[raw.replace(/[\s.]+/g,'')];
 return alias||(fallback||'');
}
/* Калькуляция берётся у единицы, а не хранится второй раз рядом с ней: два
   поля об одном означают два ответа, и однажды они разойдутся. */
function mdUnitCalc(code){const u=mdUnit(code);return u?u.calc:'';}
/* Имя единицы на языке интерфейса. Не перевод словарём — обе колонки
   заполнены здесь, язык только выбирает нужную (тот же приём, что sfName). */
function mdUnitName(code){const u=mdUnit(code);if(!u)return String(code==null?'':code);return (typeof LANG!=='undefined'&&LANG==='en')?u.nameEn:u.name;}

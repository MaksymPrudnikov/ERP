# =====================================================================
#  Автосборка и автопроверка GLASS ERP
#
#  Зачем: ты меняешь ОДИН модуль в src/ прямо на сайте GitHub, а всё
#  остальное происходит само — терминал не нужен.
#
#  Что делает после каждой правки в src/ или build/:
#   1. проверяет, что все файлы модулей зарегистрированы (частая ошибка —
#      добавили файл, забыли подключить, он молча не работает);
#   2. пересобирает dist/GLASS_ERP.html из модулей;
#   3. прогоняет регрессионные тесты, включая эталонные числа раскроя из v4.5;
#   4. только если всё зелёное — коммитит новый dist обратно в main,
#      и живая ссылка обновляется сама.
#
#  Если тесты упали — dist НЕ обновляется, живая версия продолжает
#  работать на старом коде, а в репозитории появляется красный крестик
#  и письмо на почту. Сломать рабочую систему одной неудачной заменой
#  модуля таким образом нельзя.
# =====================================================================
name: Сборка и тесты

on:
  # Проверяем ЛЮБУЮ ветку, а не только main: раньше кандидат в feature-ветке
  # оставался непроверенным, и «зелёный CI перед merge» приходилось получать
  # вручную через кнопку на вкладке Actions — про неё легко забыть.
  push:
    paths:
      - 'src/**'
      - 'build/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  pull_request:             # PR проверяется до вливания
    paths:
      - 'src/**'
      - 'build/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:        # кнопка «запустить вручную» на вкладке Actions

permissions:
  contents: write

concurrency:                # если правок подряд несколько — доводим только последнюю
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Установить зависимости
        run: npm ci --no-audit --no-fund

      - name: Установить браузер для тестов
        run: npx playwright install --with-deps chromium

      - name: Проверить, что все модули зарегистрированы
        run: node build/check-manifest.js

      - name: Собрать dist/GLASS_ERP.html
        run: node build/build.js

      - name: Прогнать тесты по собранному файлу
        run: TARGET=dist node test/run.js

      # Автокоммит dist — ТОЛЬКО для main. В feature-ветке и в PR сборка с тестами
      # прогоняется, но живая версия не трогается: кандидат получает честный
      # зелёный или красный, ничего при этом не обновляя.
      - name: Закоммитить пересобранный dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- dist/GLASS_ERP.html; then
            echo "dist не изменился — коммитить нечего"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/GLASS_ERP.html
          git commit -m "Автосборка dist после правки модулей"
          git push

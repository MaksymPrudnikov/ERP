# =====================================================================
#  Автосборка и автопроверка GLASS ERP
#
#  Зачем: ты меняешь ОДИН модуль в src/ прямо на сайте GitHub, а всё
#  остальное происходит само — терминал не нужен.
#
#  Из одних и тех же модулей собираются ДВЕ версии:
#    src/index.html      — по модулям, её открывает живая ссылка;
#    dist/GLASS_ERP.html — один файл, чтобы открыть с диска без сервера.
#  Проверяются обе: раньше тесты шли только по собранному файлу, и
#  расхождение между версиями CI не замечал.
#
#  Что делает после каждой правки в src/ или build/:
#   1. проверяет, что собранный dist не пришёл из ветки (иначе при слиянии
#      будет конфликт, который приходится разбирать руками);
#   2. проверяет, что все файлы модулей зарегистрированы и что шапка не
#      разошлась между версиями;
#   3. пересобирает обе версии из модулей;
#   4. прогоняет регрессионные тесты по обеим, включая эталонные числа
#      раскроя из v4.5;
#   5. только если всё зелёное — коммитит пересобранные файлы обратно в main,
#      и живая ссылка обновляется сама.
#
#  Если тесты упали — сборка НЕ обновляется, живая версия продолжает
#  работать на старом коде, а в репозитории появляется красный крестик
#  и письмо на почту. Сломать рабочую систему одной неудачной заменой
#  модуля таким образом нельзя.
# =====================================================================
name: Сборка и тесты

on:
  # Проверяем ЛЮБУЮ ветку, а не только main: раньше кандидат в feature-ветке
  # оставался непроверенным, и «зелёный CI перед merge» приходилось получать
  # вручную через кнопку на вкладке Actions — про неё легко забыть.
  push:
    paths:
      - 'src/**'
      - 'build/**'
      - 'test/**'
      - 'dist/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  pull_request:             # PR проверяется до вливания
    paths:
      - 'src/**'
      - 'build/**'
      - 'test/**'
      - 'dist/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:        # кнопка «запустить вручную» на вкладке Actions

permissions:
  contents: write

concurrency:                # если правок подряд несколько — доводим только последнюю
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — нужна история, иначе не с чем сравнивать ветку.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Собранный dist пишет CI в main. Если его же правит ветка, при слиянии
      # получаются две разные версии полуторамегабайтного файла. Автослияние
      # для него запрещено в .gitattributes намеренно (иначе git молча выдаёт
      # файл, не соответствующий ни одной стороне), и разрешение конфликта
      # каждый раз упирается в ручную пересборку. Если dist в ветку не попадает,
      # сливать нечего — конфликта не возникает.
      - name: Собранный dist не приходит из ветки
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch --no-tags --quiet origin main
          if git diff --quiet origin/main HEAD -- dist/GLASS_ERP.html; then
            echo "dist в ветке совпадает с main — при слиянии конфликта не будет."
            exit 0
          fi
          echo "::error::dist/GLASS_ERP.html в ветке отличается от main — уберите его из коммитов."
          echo ""
          echo "Собранный файл обновляет только CI после слияния в main."
          echo "В ветке собирайте без него:"
          echo "    npm run build:web        (то же самое, что node build/build.js --web)"
          echo ""
          echo "Как убрать уже попавший в ветку файл:"
          echo "    git checkout origin/main -- dist/GLASS_ERP.html"
          echo "    git commit -m 'dist убран из ветки: его пересобирает CI'"
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Установить зависимости
        run: npm ci --no-audit --no-fund

      - name: Установить браузер для тестов
        run: npx playwright install --with-deps chromium

      # Ловит две ошибки: модуль добавили в src/, но не зарегистрировали
      # (он молча не работает), и шапку правили не в src/shell.html.
      - name: Проверить состав модулей и шапку
        run: node build/check-manifest.js

      # Один и тот же tree, выданный с LF или CRLF, обязан собраться побайтово
      # одинаково — иначе сборка на Windows и в CI разъезжается.
      - name: Проверить воспроизводимость сборки
        run: node build/check-reproducible.js

      - name: Собрать обе версии
        run: node build/build.js

      - name: Прогнать тесты по версии из модулей
        run: node test/run.js

      - name: Прогнать тесты по собранному файлу
        run: TARGET=dist node test/run.js

      # Автокоммит сборки — ТОЛЬКО для main. В feature-ветке и в PR сборка
      # с тестами прогоняется, но живая версия не трогается: кандидат получает
      # честный зелёный или красный, ничего при этом не обновляя.
      - name: Закоммитить пересобранные версии
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- dist/GLASS_ERP.html src/index.html; then
            echo "сборка не изменилась — коммитить нечего"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/GLASS_ERP.html src/index.html
          git commit -m "Автосборка после правки модулей"
          git push

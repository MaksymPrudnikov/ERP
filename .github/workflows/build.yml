# =====================================================================
#  Автосборка и автопроверка GLASS ERP
#
#  Порядок работы (AGENTS.md, «Ветка и PR»):
#   1. ветка от свежего main, правка модулей в src/;
#   2. node tools/prepush.js — догоняет main, гоняет все проверки и тесты,
#      пушит ветку;
#   3. PR в main — этот файл проверяет его (событие pull_request): dist не
#      пришёл из ветки, модули зарегистрированы, сборка воспроизводима, SQL
#      сервера, тесты по обеим версиям — src/index.html и dist/GLASS_ERP.html;
#   4. после слияния тот же прогон идёт по main (событие push) и, если всё
#      зелёное, коммитит пересобранные файлы — «Автосборка после правки
#      модулей»; сайт обновляется сам.
#
#  Тесты упали — сборка НЕ обновляется, сайт работает на старом коде.
#  Обязательных проверок (required status checks) на main нет намеренно:
#  они не пускают пуш автосборки (решение 12.11.2026).
# =====================================================================
name: Сборка и тесты

on:
  # Ветки проверяет pull_request, push — только main (после слияния, ради
  # автосборки): один прогон на PR вместо двух.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build/**'
      - 'test/**'
      - 'tools/**'            # e2e-cases, e2e-exceptions и др. гоняет test/run.js
      - 'dist/**'
      - 'docs/**'             # test/docs.js сверяет документы с кодом
      - '*.md'
      - 'templates/**'
      - 'extension/**'        # расширение Gmail: test/gmail-extension.js (аудит 17.11.2026)
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  pull_request:             # PR проверяется до вливания
    paths:
      - 'src/**'
      - 'build/**'
      - 'test/**'
      - 'tools/**'            # e2e-cases, e2e-exceptions и др. гоняет test/run.js
      - 'dist/**'
      - 'docs/**'             # test/docs.js сверяет документы с кодом
      - '*.md'
      - 'templates/**'
      - 'extension/**'        # расширение Gmail: test/gmail-extension.js (аудит 17.11.2026)
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:        # кнопка «запустить вручную» на вкладке Actions

permissions:
  contents: write

concurrency:                # если правок подряд несколько — доводим только последнюю
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Система указана точно, не latest: 20.10.2026 GitHub сам сменил latest
    # на 26.04, и старый Playwright не поставил Chromium. Новую Ubuntu —
    # только вместе с Playwright, который её знает.
    runs-on: ubuntu-26.04
    steps:
      # fetch-depth: 0 — нужна история, иначе не с чем сравнивать ветку.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Собранный dist пишет CI в main. Если его же правит ветка, при слиянии
      # получаются две разные версии полуторамегабайтного файла. Автослияние
      # для него запрещено в .gitattributes намеренно (иначе git молча выдаёт
      # файл, не соответствующий ни одной стороне), и разрешение конфликта
      # каждый раз упирается в ручную пересборку. Если dist в ветку не попадает,
      # сливать нечего — конфликта не возникает.
      - name: Собранный dist не приходит из ветки
        if: github.ref != 'refs/heads/main'
        run: |
          # В PR проверяется слияние с main (refs/pull/N/merge): первый родитель —
          # main на момент слияния. В ручном прогоне по ветке — свежий origin/main.
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE=HEAD^1
          else git fetch --no-tags --quiet origin main; BASE=origin/main; fi
          if git diff --quiet "$BASE" HEAD -- dist/GLASS_ERP.html; then
            echo "dist в ветке совпадает с main — при слиянии конфликта не будет."
            exit 0
          fi
          echo "::error::dist/GLASS_ERP.html в ветке отличается от main — уберите его из коммитов."
          echo ""
          echo "Собранный файл обновляет только CI после слияния в main."
          echo "В ветке собирайте без него:"
          echo "    npm run build:web        (то же самое, что node build/build.js --web)"
          echo ""
          echo "Как убрать уже попавший в ветку файл:"
          echo "    git checkout origin/main -- dist/GLASS_ERP.html"
          echo "    git commit -m 'dist убран из ветки: его пересобирает CI'"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Установить зависимости
        run: npm ci --no-audit --no-fund

      - name: Установить браузер для тестов
        run: npx playwright install --with-deps chromium

      # Ловит две ошибки: модуль добавили в src/, но не зарегистрировали
      # (он молча не работает), и шапку правили не в src/shell.html.
      - name: Проверить состав модулей и шапку
        run: node build/check-manifest.js

      # Один и тот же tree, выданный с LF или CRLF, обязан собраться побайтово
      # одинаково — иначе сборка на Windows и в CI разъезжается.
      - name: Проверить воспроизводимость сборки
        run: node build/check-reproducible.js

      # SQL сервера (tools/supabase/schema.sql) на PGlite — Postgres в Node:
      # заглушка Supabase, схема дважды, check.sql. Ошибка в SQL не доходит
      # до main (план «до 10», этап 2, 09.11.2026). Сценарии двух
      # компьютеров в test/run.js гоняют команды ERP против того же SQL.
      - name: Проверить SQL сервера
        run: node tools/supabase/check-pglite.js

      - name: Собрать обе версии
        run: node build/build.js

      - name: Прогнать тесты по версии из модулей
        run: node test/run.js

      - name: Прогнать тесты по собранному файлу
        run: TARGET=dist node test/run.js

      # Автокоммит сборки — ТОЛЬКО для main. В feature-ветке и в PR сборка
      # с тестами прогоняется, но живая версия не трогается: кандидат получает
      # честный зелёный или красный, ничего при этом не обновляя.
      - name: Закоммитить пересобранные версии
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- dist/GLASS_ERP.html src/index.html; then
            echo "сборка не изменилась — коммитить нечего"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/GLASS_ERP.html src/index.html
          git commit -m "Автосборка после правки модулей"
          git push

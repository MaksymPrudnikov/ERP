<style>

{k:'m',st:'CERP',x:34,y:20,w:6,l:6,h:2.2},{k:'m',st:'LAM',x:34,y:27,w:1,l:12,h:1},{k:'m',st:'LAM',x:39,y:27,w:1,l:12,h:1},{k:'m',st:'LAM',x:35,y:30,w:4,l:3,h:2.6},{k:'m',st:'PAINT',x:46,y:9.9,w:6,l:6,h:2.4},{k:'m',st:'IGU',x:46,y:17,w:1,l:22,h:1},{k:'m',st:'IGU',x:51,y:17,w:1,l:22,h:1},{k:'m',st:'IGU',x:47,y:20,w:4,l:3,h:2.2},
{k:'m',st:'HEAT',x:53.1,y:.6,w:2,l:40,h:1.8},{k:'s',st:'HEAT',x:57,y:2,w:3.4,l:8},{k:'a',st:'SHIP',label:'Shipping',x:.3,y:61.3,w:64.4,l:8.4}].map((o,i)=>Object.assign({id:i+1,st:'',label:'',h:0},o));
const KN={m:'Machine',w:'Wall',o:'Object',a:'Area',s:'Dolly spot'};
const svg=document.getElementById('fsv'),pan=document.getElementById('pan'),cv=document.createElement('canvas').getContext('2d'),$=id=>document.getElementById(id),root=$('erp');
const r2=v=>Math.round(v*100)/100,f2=v=>(Math.round(v*100)/100).toFixed(2),cur=()=>it.find(i=>i.id===sel),TW={};

function carriers(){const out=[];Object.keys(ST).forEach(code=>{const n=ST[code].d;if(!n)return;const sk=/^SHIP/.test(code),dw=sk?1.3:.7,dl=sk?2.4:1.6,sx=sk?1.8:.9,sy=sk?2.9:2,spot=it.find(i=>(i.k==='s'||i.k==='a')&&i.st===code),m=it.find(i=>i.k==='m'&&i.st===code);if(!spot&&!m)return;
for(let j=0;j<n;j++){let x,y;if(spot){const cols=Math.max(1,Math.floor((spot.w-.2)/sx));x=spot.x+.3+(j%cols)*sx+(spot.k==='a'?30:0);y=spot.y+.4+Math.floor(j/cols)*sy;}else{x=m.x+j*sx;y=m.y+m.l+.5;}out.push({k:'c',st:code,x,y,w:dw,l:dl,h:sk?1.1:1.7,cls:sk?'skid':'dolly'});}});return out;}

function segs(b){const L=Math.max(b.w,b.l);if(L<=6)return[b];const n=Math.ceil(L/6),r=[];for(let j=0;j<n;j++)r.push(b.w>=b.l?Object.assign({},b,{x:b.x+b.w*j/n,w:b.w/n}):Object.assign({},b,{y:b.y+b.l*j/n,l:b.l/n}));return r;}
function box(b,cls){const x0=b.x,y0=b.y,x1=b.x+b.w,y1=b.y+b.l,h=b.k==='w'?Math.min(b.h,1.3):b.h,c=Math.cos(yaw),s=Math.sin(yaw);let o='';

function flows(map){const c=cur();if(!c||!c.st||!FLOWS[c.st])return'';const F=FLOWS[c.st],me=cen(c.st);if(!me)return'';let o='';
const arrow=(a,b,n,cls,mk)=>{const p=map(a),q=map(b),dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy);if(L<30)return'';const ux=dx/L,uy=dy/L,s=[p[0]+ux*14,p[1]+uy*14],e=[q[0]-ux*16,q[1]-uy*16],w=Math.min(5,1.2+n/12);
